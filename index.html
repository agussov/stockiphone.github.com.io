<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Stock iPhone</title>

<style>
:root{
  --bg:#171124;
  --bg2:#211735;
  --panel:#251b3a;
  --panel2:#2b2043;
  --border:#49355f;

  --gold:#d8b35a;
  --gold2:#f0d27b;

  --text:#ffffff;
  --muted:#aaa2b8;

  --green:#62d39b;
  --red:#e77878;

  --shadow:0 12px 35px rgba(0,0,0,.30);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(
      circle at top,
      #302047 0%,
      var(--bg) 48%,
      #120d1c 100%
    );
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   LOGIN
========================= */

.hidden{
  display:none !important;
}

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:360px;
  padding:30px;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(37,27,58,.92);
  box-shadow:var(--shadow);
  backdrop-filter:blur(15px);
}

.login-logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:6px;
}

.login-sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:25px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  height:42px;
  padding:0 12px;
  color:white;
  background:#171222;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--gold);
}

.login-button{
  width:100%;
  height:43px;
  border:0;
  border-radius:11px;
  background:linear-gradient(
    135deg,
    var(--gold),
    var(--gold2)
  );
  color:#241a08;
  font-weight:800;
}

.login-error{
  min-height:18px;
  margin-top:12px;
  color:var(--red);
  font-size:13px;
  text-align:center;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:22px 18px 60px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}

.brand{
  display:flex;
  flex-direction:column;
}

.brand-title{
  font-size:25px;
  line-height:1.1;
  font-weight:850;
  letter-spacing:-.5px;
}

.brand-title span{
  color:var(--gold2);
}

.brand-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.header-actions{
  display:flex;
  gap:8px;
}

/* BUTTONS */

.btn{
  border:1px solid var(--border);
  border-radius:10px;
  height:38px;
  padding:0 13px;
  color:white;
  background:#2a203d;
  font-size:13px;
  font-weight:700;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:var(--gold);
}

.btn-gold{
  background:linear-gradient(
    135deg,
    #c99e42,
    #ebca70
  );
  color:#251b0b;
  border-color:#e3c36c;
}

.btn-small{
  height:30px;
  padding:0 9px;
  font-size:12px;
}

/* SEARCH */

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  height:40px;
  border-radius:11px;
  border:1px solid var(--border);
  background:rgba(24,17,37,.9);
  color:white;
  padding:0 13px;
  outline:none;
}

.search input:focus{
  border-color:var(--gold);
}

.search input::placeholder{
  color:#777082;
}

/* EMPTY */

.empty{
  border:1px dashed var(--border);
  border-radius:16px;
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  background:rgba(37,27,58,.5);
}

.empty-title{
  color:white;
  font-weight:700;
  margin-bottom:6px;
}

.empty-text{
  font-size:13px;
}

/* =========================
   PROVIDERS
========================= */

.provider{
  background:rgba(37,27,58,.88);
  border:1px solid var(--border);
  border-radius:17px;
  margin-bottom:15px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.provider-head{
  min-height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 13px;
  background:
    linear-gradient(
      90deg,
      rgba(216,179,90,.10),
      rgba(216,179,90,.02)
    );
  border-bottom:1px solid var(--border);
}

.provider-name{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.provider-icon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:rgba(216,179,90,.12);
  color:var(--gold2);
  font-weight:800;
  font-size:13px;
}

.provider-title{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.provider-actions{
  display:flex;
  gap:5px;
  flex-shrink:0;
}

.icon-btn{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:8px;
  background:#211830;
  color:#d5cedf;
  font-size:13px;
}

.icon-btn:hover{
  border-color:var(--gold);
  color:var(--gold2);
}

/* PRODUCTS */

.products{
  padding:4px 9px 9px;
}

.product{
  display:grid;
  grid-template-columns:
    24px
    minmax(150px,1.6fr)
    90px
    95px
    110px
    105px;

  align-items:center;
  gap:9px;

  min-height:58px;

  padding:8px 6px;

  border-bottom:1px solid rgba(73,53,95,.55);

  transition:.15s;
}

.product:last-child{
  border-bottom:0;
}

.product:hover{
  background:rgba(255,255,255,.025);
  border-radius:9px;
}

.drag{
  color:#766c83;
  cursor:grab;
  font-size:16px;
  text-align:center;
}

.drag:active{
  cursor:grabbing;
}

.product-main{
  min-width:0;
}

.product-name{
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-capacity{
  display:inline-block;
  margin-top:3px;
  padding:2px 6px;
  border-radius:5px;
  background:#352849;
  color:#c7bdd2;
  font-size:10px;
}

.price{
  font-size:12px;
}

.price-label{
  display:block;
  color:#81768d;
  font-size:9px;
  text-transform:uppercase;
  margin-bottom:2px;
}

.price-value{
  font-weight:700;
}

.stock{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.stock button{
  width:25px;
  height:25px;
  padding:0;
  border-radius:7px;
  border:1px solid var(--border);
  background:#211830;
  color:white;
  font-weight:800;
}

.stock button:hover{
  border-color:var(--gold);
}

.stock-number{
  min-width:22px;
  text-align:center;
  font-size:13px;
  font-weight:800;
}

.stock-zero{
  color:var(--red);
}

.product-actions{
  display:flex;
  justify-content:flex-end;
  gap:5px;
}

.add-product{
  margin:5px 6px 2px;
  width:calc(100% - 12px);
  height:32px;
  border:1px dashed var(--border);
  border-radius:8px;
  background:transparent;
  color:var(--gold2);
  font-size:12px;
  font-weight:700;
}

.add-product:hover{
  background:rgba(216,179,90,.07);
  border-color:var(--gold);
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:50;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px;

  background:rgba(8,5,14,.72);
  backdrop-filter:blur(7px);
}

.modal{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;

  border:1px solid var(--border);
  border-radius:18px;

  background:#251b3a;
  box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 17px;
  border-bottom:1px solid var(--border);
}

.modal-title{
  font-size:16px;
  font-weight:800;
}

.modal-close{
  width:30px;
  height:30px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#1b1429;
  color:white;
}

.modal-body{
  padding:17px;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:13px 17px;
  border-top:1px solid var(--border);
}

/* =========================
   CALCULATOR
========================= */

.calculator{
  width:100%;
}

.calc-display{
  width:100%;
  height:55px;
  padding:0 14px;

  border:1px solid var(--border);
  border-radius:10px;

  background:#171122;
  color:white;

  text-align:right;
  font-size:24px;
  font-weight:700;

  margin-bottom:9px;
}

.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.calc-grid button{
  height:43px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#302345;
  color:white;
  font-weight:700;
}

.calc-grid button:hover{
  border-color:var(--gold);
}

.calc-grid .calc-gold{
  background:#b88f39;
  color:#211707;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .app{
    padding:16px 11px 45px;
  }

  .header{
    align-items:flex-start;
  }

  .brand-title{
    font-size:22px;
  }

  .header-actions{
    flex-direction:column;
  }

  .header-actions .btn{
    height:34px;
    font-size:11px;
  }

  .toolbar{
    flex-direction:column;
  }

  .product{
    grid-template-columns:
      20px
      minmax(120px,1fr)
      75px
      80px;

    gap:6px;
  }

  .product .price:nth-of-type(2){
    display:none;
  }

  .product-actions{
    grid-column:2 / -1;
    justify-content:flex-end;
  }

  .stock{
    justify-content:flex-start;
  }

  .provider-title{
    max-width:170px;
  }

  .provider-actions .icon-btn{
    width:28px;
    height:28px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen" class="login-screen">

  <div class="login-box">

    <div class="login-logo">
      Stock iPhone
    </div>

    <div class="login-sub">
      Panel de administración
    </div>

    <form id="loginForm">

      <div class="field">
        <label>Usuario</label>
        <input
          id="loginUser"
          type="text"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        class="login-button"
        type="submit"
      >
        INGRESAR
      </button>

      <div
        id="loginError"
        class="login-error"
      ></div>

    </form>

  </div>

</section>


<!-- =========================
     APP
========================= -->

<main
  id="app"
  class="app hidden"
>

  <header class="header">

    <div class="brand">

      <div class="brand-title">
        Agustín · <span>Stock iPhone</span>
      </div>

      <div class="brand-sub">
        Control de productos, costos y stock
      </div>

    </div>

    <div class="header-actions">

      <button
        id="btnProveedor"
        class="btn btn-gold"
      >
        ＋ Proveedor
      </button>

      <button
        id="btnProducto"
        class="btn"
      >
        ＋ Producto
      </button>

      <button
        id="btnCalculadora"
        class="btn"
      >
        🧮
      </button>

    </div>

  </header>


  <div class="toolbar">

    <div class="search">
      <input
        id="buscar"
        type="search"
        placeholder="Buscar iPhone, capacidad o proveedor..."
      >
    </div>

  </div>


  <section id="stockContainer"></section>

</main>


<!-- =========================
     MODAL
========================= -->

<div
  id="modalBackdrop"
  class="modal-backdrop hidden"
>

  <div class="modal">

    <div class="modal-head">

      <div
        id="modalTitle"
        class="modal-title"
      >
        Ventana
      </div>

      <button
        id="modalClose"
        class="modal-close"
      >
        ×
      </button>

    </div>

    <div
      id="modalBody"
      class="modal-body"
    ></div>

    <div
      id="modalFooter"
      class="modal-footer"
    ></div>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const API =
  "https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";


/* =========================================================
   ESTADO
========================================================= */

let proveedores = [];
let productos = [];

let draggedProduct = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


function escapeHTML(text){

  return String(text ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function dinero(valor){

  return new Intl.NumberFormat(
    "es-AR",
    {
      style:"currency",
      currency:"ARS",
      maximumFractionDigits:0
    }
  ).format(Number(valor) || 0);

}


/* =========================================================
   LOGIN
========================================================= */

$("loginForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    $("loginError").textContent = "";

    try{

      const response =
        await fetch(
          API + "/login",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },
            body:JSON.stringify({

              usuario:
                $("loginUser")
                  .value
                  .trim(),

              password:
                $("loginPassword")
                  .value

            })
          }
        );


      const result =
        await response.json();


      if(
        !response.ok ||
        result.ok === false
      ){

        throw new Error(
          result.error ||
          "Usuario o contraseña incorrectos"
        );

      }


      $("loginScreen")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      await cargarStock();

    }
    catch(error){

      $("loginError")
        .textContent =
          error.message;

    }

  }
);


/* =========================================================
   CARGAR STOCK
========================================================= */

async function cargarStock(){

  try{

    const response =
      await fetch(
        API + "/stock"
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      result.ok === false
    ){

      throw new Error(
        result.error ||
        "No se pudo cargar el stock"
      );

    }


    proveedores =
      result.proveedores || [];

    productos =
      result.productos || [];

    render();

  }
  catch(error){

    $("stockContainer").innerHTML = `
      <div class="empty">

        <div class="empty-title">
          No se pudo cargar el stock
        </div>

        <div class="empty-text">
          ${escapeHTML(error.message)}
        </div>

      </div>
    `;

  }

}


/* =========================================================
   API POST
========================================================= */

async function apiPost(data){

  const response =
    await fetch(
      API,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify(data)
      }
    );


  let result;

  try{

    result =
      await response.json();

  }
  catch{

    throw new Error(
      "El servidor devolvió una respuesta inválida"
    );

  }


  if(
    !response.ok ||
    result.ok === false
  ){

    throw new Error(
      result.error ||
      "Error del servidor"
    );

  }


  return result;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const container =
    $("stockContainer");

  const buscar =
    $("buscar")
      .value
      .trim()
      .toLowerCase();


  if(!proveedores.length){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-title">
          Todavía no hay proveedores
        </div>

        <div class="empty-text">
          Agregá tu primer proveedor para comenzar a cargar productos.
        </div>

        <br>

        <button
          class="btn btn-gold"
          onclick="abrirProveedor()"
        >
          ＋ Agregar proveedor
        </button>

      </div>

    `;

    return;

  }


  let html = "";


  proveedores.forEach(proveedor => {

    let lista =
      productos
        .filter(
          p =>
            Number(p.proveedor_id) ===
            Number(proveedor.id)
        );


    if(buscar){

      lista =
        lista.filter(p => {

          const texto = [

            p.producto,
            p.capacidad,
            proveedor.nombre

          ]
          .join(" ")
          .toLowerCase();

          return texto.includes(buscar);

        });

    }


    html += `

      <section
        class="provider"
        data-provider="${proveedor.id}"
      >

        <div class="provider-head">

          <div class="provider-name">

            <div class="provider-icon">
              
            </div>

            <div
              class="provider-title"
            >
              ${escapeHTML(proveedor.nombre)}
            </div>

          </div>


          <div class="provider-actions">

            <button
              class="icon-btn"
              title="Renombrar"
              onclick="renombrarProveedor(${proveedor.id})"
            >
              ✎
            </button>

            <button
              class="icon-btn"
              title="Ajustar precios"
              onclick="ajustarPrecios(${proveedor.id})"
            >
              $
            </button>

            <button
              class="icon-btn"
              title="Eliminar"
              onclick="eliminarProveedor(${proveedor.id})"
            >
              🗑
            </button>

          </div>

        </div>


        <div
          class="products"
          data-products="${proveedor.id}"
        >

    `;


    if(!lista.length){

      html += `

        <div
          style="
            padding:18px;
            text-align:center;
            color:var(--muted);
            font-size:12px;
          "
        >
          ${buscar
            ? "No se encontraron productos."
            : "Todavía no hay productos en este proveedor."
          }
        </div>

      `;

    }


    lista.forEach(p => {

      html += productoHTML(p);

    });


    html += `

          <button
            class="add-product"
            onclick="abrirProducto(null,${proveedor.id})"
          >
            ＋ Agregar producto a ${escapeHTML(proveedor.nombre)}
          </button>

        </div>

      </section>

    `;

  });


  container.innerHTML = html;


  activarDragDrop();

}


/* =========================================================
   PRODUCTO HTML
========================================================= */

function productoHTML(p){

  const stock =
    Number(p.cantidad) || 0;


  return `

    <div
      class="product"
      draggable="true"
      data-id="${p.id}"
    >

      <div
        class="drag"
        title="Arrastrar para ordenar"
      >
        ☷
      </div>


      <div class="product-main">

        <div class="product-name">
          ${escapeHTML(p.producto)}
        </div>

        <span class="product-capacity">
          ${escapeHTML(p.capacidad || "Ninguno")}
        </span>

      </div>


      <div class="price">

        <span class="price-label">
          Costo
        </span>

        <span class="price-value">
          ${dinero(p.costo)}
        </span>

      </div>


      <div class="price">

        <span class="price-label">
          Venta
        </span>

        <span class="price-value">
          ${dinero(p.venta)}
        </span>

      </div>


      <div class="stock">

        <button
          onclick="cambiarStock(${p.id},-1)"
        >
          −
        </button>

        <span
          class="
            stock-number
            ${stock === 0 ? "stock-zero" : ""}
          "
        >
          ${stock}
        </span>

        <button
          onclick="cambiarStock(${p.id},1)"
        >
          +
        </button>

      </div>


      <div class="product-actions">

        <button
          class="icon-btn"
          title="Editar"
          onclick="abrirProducto(${p.id})"
        >
          ✎
        </button>

        <button
          class="icon-btn"
          title="Eliminar"

/* =========================================================
   DRAG & DROP
========================================================= */

function activarDragDrop(){

  document
    .querySelectorAll(".product")
    .forEach(element => {

      element.addEventListener(
        "dragstart",
        () => {

          draggedProduct =
            element;

          element.style.opacity =
            ".45";

        }
      );


      element.addEventListener(
        "dragend",
        () => {

          element.style.opacity =
            "1";

          draggedProduct =
            null;

        }
      );


      element.addEventListener(
        "dragover",
        event => {

          event.preventDefault();

        }
      );


      element.addEventListener(
        "drop",
        async event => {

          event.preventDefault();

          if(
            !draggedProduct ||
            draggedProduct === element
          ){
            return;
          }


          const container =
            element.parentElement;


          const items =
            [...container.querySelectorAll(".product")];


          const from =
            items.indexOf(
              draggedProduct
            );

          const to =
            items.indexOf(element);


          if(from < to){

            container.insertBefore(
              draggedProduct,
              element.nextSibling
            );

          }
          else{

            container.insertBefore(
              draggedProduct,
              element
            );

          }


          const ids =
            [...container.querySelectorAll(".product")]
              .map(
                el =>
                  Number(
                    el.dataset.id
                  )
              );


          const proveedorId =
            Number(
              container.dataset.products
            );


          try{

            await apiPost({

              accion:
                "ordenar_productos",

              proveedor_id:
                proveedorId,

              ids

            });

            await cargarStock();

          }
          catch(error){

            alert(error.message);

            await cargarStock();

          }

        }
      );

    });

}

/* =========================================================
   PRODUCTO
========================================================= */

function abrirProducto(productoId=null, proveedorInicial=null){

  const producto =
    productoId
      ? productos.find(
          p =>
            Number(p.id) ===
            Number(productoId)
        )
      : null;


  $("modalTitle").textContent =
    producto
      ? "Editar producto"
      : "Nuevo producto";


  const proveedorSeleccionado =
    producto
      ? producto.proveedor_id
      : proveedorInicial ||
        (proveedores[0]?.id || "");


  $("modalBody").innerHTML = `

    <div class="field">

      <label>
        Proveedor
      </label>

      <select id="productoProveedor">

        ${
          proveedores
            .map(
              p => `

                <option
                  value="${p.id}"
                  ${
                    Number(p.id) ===
                    Number(proveedorSeleccionado)
                      ? "selected"
                      : ""
                  }
                >
                  ${escapeHTML(p.nombre)}
                </option>

              `
            )
            .join("")
        }

      </select>

    </div>


    <div class="field">

      <label>
        Producto
      </label>

      <input
        id="productoNombre"
        type="text"
        value="${escapeHTML(producto?.producto || "")}"
        placeholder="Ej: iPhone 15 Pro"
      >

    </div>


    <div class="field">

      <label>
        Capacidad
      </label>

      <select id="productoCapacidad">

        <option
          value="Ninguno"
          ${
            !producto ||
            producto.capacidad === "Ninguno"
              ? "selected"
              : ""
          }
        >
          Ninguno
        </option>

        <option
          value="128 GB"
          ${
            producto?.capacidad === "128 GB"
              ? "selected"
              : ""
          }
        >
          128 GB
        </option>

        <option
          value="256 GB"
          ${
            producto?.capacidad === "256 GB"
              ? "selected"
              : ""
          }
        >
          256 GB
        </option>

        <option
          value="512 GB"
          ${
            producto?.capacidad === "512 GB"
              ? "selected"
              : ""
          }
        >
          512 GB
        </option>

        <option
          value="1 TB"
          ${
            producto?.capacidad === "1 TB"
              ? "selected"
              : ""
          }
        >
          1 TB
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        Precio proveedor / costo
      </label>

      <input
        id="productoCosto"
        type="number"
        min="0"
        step="1"
        value="${producto?.costo ?? 0}"
      >

    </div>


    <div class="field">

      <label>
        Precio de venta
      </label>

      <input
        id="productoVenta"
        type="number"
        min="0"
        step="1"
        value="${producto?.venta ?? 0}"
      >

    </div>


    <div class="field">

      <label>
        Stock
      </label>

      <input
        id="productoCantidad"
        type="number"
        min="0"
        step="1"
        value="${producto?.cantidad ?? 0}"
      >

    </div>

  `;


  $("modalFooter").innerHTML = `

    <button
      class="btn"
      onclick="cerrarModal()"
    >
      Cancelar
    </button>

    <button
      class="btn btn-gold"
      onclick="guardarProducto(${productoId || "null"})"

  `;

}


async function guardarProducto(id){

  const proveedor_id =
    Number(
      $("productoProveedor")
        .value
    );


  const producto =
    $("productoNombre")
      .value
      .trim();


  const capacidad =
    $("productoCapacidad")
      .value;


  const costo =
    Number(
      $("productoCosto")
        .value
    ) || 0;


  const venta =
    Number(
      $("productoVenta")
        .value
    ) || 0;


  const cantidad =
    Math.max(
      0,
      Number(
        $("productoCantidad")
          .value
      ) || 0
    );


  if(!proveedor_id){

    alert(
      "Primero tenés que crear un proveedor."
    );

    return;

  }


  if(!producto){

    alert(
      "Ingresá el nombre del producto."
    );

    return;

  }


  try{

    if(id){

      await apiPost({

        accion:
          "editar_producto",

        id,

        proveedor_id,

        producto,

        capacidad,

        costo,

        venta,

        cantidad

      });

    }
    else{

      await apiPost({

        accion:
          "agregar_producto",

        proveedor_id,

        producto,

        capacidad,

        costo,

        venta,

        cantidad

      });

    }


    cerrarModal();

    await cargarStock();

  }
  catch(error){

    alert(error.message);

  }

}


async function eliminarProducto(id){

  const producto =
    productos.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!producto){
    return;
  }


  if(
    !confirm(
      `¿Eliminar "${producto.producto}"?`
    )
  ){
    return;
  }


  try{

    await apiPost({

      accion:
        "eliminar_producto",

      id

    });


    await cargarStock();

  }
  catch(error){

    alert(error.message);

  }

}


/* =========================================================
   STOCK
========================================================= */

async function cambiarStock(id, cambio){

  const producto =
    productos.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!producto){
    return;
  }


  const nuevaCantidad =
    Math.max(
      0,
      Number(producto.cantidad || 0) +
      Number(cambio)
    );


  try{

    await apiPost({

      accion:
        "cambiar_stock",

      id,

      cantidad:
        nuevaCantidad

    });


    producto.cantidad =
      nuevaCantidad;


    render();

  }
  catch(error){

    alert(error.message);

  }

}


/* =========================================================
   AJUSTAR PRECIOS
========================================================= */

async function ajustarPrecios(id){

  const proveedor =
    proveedores.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!proveedor){
    return;
  }


  const monto =
    prompt(
      `Modificar precios de ${proveedor.nombre}\n\n` +
      `Ingresá un monto. Ejemplo: 10000 para sumar $10.000 o -5000 para restar $5.000.`,
      "0"
    );


  if(monto === null){
    return;
  }


  const numero =
    Number(monto);


  if(!Number.isFinite(numero)){

    alert(
      "Monto inválido."
    );

    return;

  }


  const tipo =
    prompt(
      "Escribí:\n\n" +
      "COSTO → modificar costo\n" +
      "VENTA → modificar venta\n" +
      "AMBOS → modificar los dos",
      "VENTA"
    );


  if(tipo === null){
    return;
  }


  const valor =
    tipo
      .trim()
      .toUpperCase();


  const modificarCosto =
    valor === "COSTO" ||
    valor === "AMBOS";


  const modificarVenta =
    valor === "VENTA" ||
    valor === "AMBOS";


  if(
    !modificarCosto &&
    !modificarVenta
  ){

    alert(
      "Escribí COSTO, VENTA o AMBOS."
    );

    return;

  }


  try{

    await apiPost({

      accion:
        "ajustar_precios",

      proveedor_id:
        id,

      monto:
        numero,

      costo:
        modificarCosto,

      venta:
        modificarVenta

    });


    await cargarStock();

  }
  catch(error){

    alert(error.message);

  }

}

function abrirCalculadora(){

  $("modalTitle").textContent =

  $("modalBody").innerHTML = `

    <div class="calculator">

      <input
        id="calcDisplay"
        class="calc-display"
        readonly
        value="0"
      >

      <div class="calc-grid">

        <button onclick="calcClear()">
          C
        </button>

        <button onclick="calcInput('/')">
          ÷
        </button>

        <button onclick="calcInput('*')">
          ×
        </button>

        <button
          class="calc-gold"
          onclick="calcInput('-')"
        >
          −
        </button>

        <button onclick="calcInput('7')">
          7
        </button>

        <button onclick="calcInput('8')">
          8
        </button>

        <button onclick="calcInput('9')">
          9
        </button>

        <button
          class="calc-gold"
          onclick="calcInput('+')"
        >
          +
        </button>

        <button onclick="calcInput('4')">
          4
        </button>

        <button onclick="calcInput('5')">
          5
        </button>

        <button onclick="calcInput('6')">
          6
        </button>

        <button onclick="calcInput('.')">
          .
        </button>

        <button onclick="calcInput('1')">
          1
        </button>

        <button onclick="calcInput('2')">
          2
        </button>

        <button onclick="calcInput('3')">
          3
        </button>

        <button
          class="calc-gold"
          onclick="calcResult()"
        >
          =
        </button>

        <button onclick="calcInput('0')">
          0
        </button>

      </div>

    </div>

  `;


  $("modalFooter").innerHTML = "";

  abrirModal();

}


function calcInput(valor){

  const display =
    $("calcDisplay");


  if(
    display.value === "0" &&
    valor !== "."
  ){

    display.value =
      valor;

  }
  else{

    display.value +=
      valor;

  }

}


function calcClear(){

  $("calcDisplay")
    .value = "0";

}


function calcResult(){

  const display =
    $("calcDisplay");


  try{

    const resultado =
      Function(
        `"use strict";return (${display.value})`
      )();


    if(
      !Number.isFinite(resultado)
    ){

      throw new Error();

    }


    display.value =
      String(resultado);

  }
  catch{

    display.value =
      "Error";

  }

}


$("btnCalculadora")
  .addEventListener(
    "click",
    abrirCalculadora
  );

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Stock iPhone</title>

<style>
:root{
  --bg:#09090d;
  --panel:#111118;
  --panel2:#171720;
  --border:#292934;
  --text:#f5f5f7;
  --muted:#9696a3;
  --gold:#e7b93f;
  --gold2:#f1c84d;
  --violet:#8b5cf6;
  --violet2:#6d3de8;
  --danger:#ff5f6d;
  --green:#35d07f;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
   ========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(139,92,246,.20),
      transparent 38%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(231,185,63,.08),
      transparent 35%
    ),
    var(--bg);
}

.loginBox{
  width:100%;
  max-width:410px;
  padding:32px 26px;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(17,17,24,.96);
  box-shadow:
    0 25px 80px rgba(0,0,0,.55);
}

.loginLogo{
  text-align:center;
  color:var(--gold);
  font-size:28px;
  font-weight:900;
  letter-spacing:.5px;
}

.loginSub{
  text-align:center;
  color:var(--muted);
  margin-top:7px;
  margin-bottom:28px;
}

.loginBox input{
  display:block;
  width:100%;
  padding:14px 15px;
  margin-bottom:12px;

  border:1px solid var(--border);
  border-radius:12px;

  background:#0d0d13;
  color:var(--text);

  outline:none;
}

.loginBox input:focus{
  border-color:var(--violet);
}

.loginBtn{
  width:100%;
  padding:14px;

  border:0;
  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      var(--gold),
      #b88719
    );

  color:#111;
  font-weight:900;
}

.loginError{
  min-height:20px;
  margin-top:12px;
  color:#ff6868;
  text-align:center;
  font-size:14px;
}

/* =========================
   HEADER
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:50;

  border-bottom:1px solid var(--border);

  background:rgba(9,9,13,.92);
  backdrop-filter:blur(18px);
}

.headerInner{
  max-width:1450px;
  margin:auto;
  padding:14px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:900;
  color:var(--gold);
}

.logo span{
  color:white;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.userName{
  color:var(--muted);
  font-size:13px;
}

.logoutBtn{
  padding:8px 12px;

  border:1px solid var(--border);
  border-radius:9px;

  background:var(--panel2);
  color:white;
}

/* =========================
   MAIN
   ========================= */

main{
  width:100%;
  max-width:1450px;
  margin:auto;
  padding:22px 18px 100px;
}

.titleArea{
  margin-bottom:20px;
}

.titleArea h1{
  margin:0;
  font-size:29px;
}

.titleArea p{
  margin:6px 0 0;
  color:var(--muted);
}

/* =========================
   TOP CONTROLS
   ========================= */

.topControls{
  display:flex;
  gap:10px;
  margin-bottom:22px;
}

.searchBox{
  flex:1;
}

.searchBox input{
  width:100%;
  height:46px;
  padding:0 15px;

  border:1px solid var(--border);
  border-radius:12px;

  background:var(--panel);
  color:white;

  outline:none;
}

.searchBox input:focus{
  border-color:var(--violet);
}

.actionBtn{
  height:46px;
  padding:0 17px;

  border:0;
  border-radius:12px;

  color:white;
  font-weight:800;

  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--violet2)
    );
}

.providerBtn{
  background:
    linear-gradient(
      135deg,
      var(--gold),
      #ad7a15
    );

  color:#111;
}

/* =========================
   PROVIDER
   ========================= */

.provider{
  margin-bottom:22px;

  border:1px solid var(--border);
  border-radius:18px;

  overflow:hidden;

  background:var(--panel);
}

.providerHeader{
  padding:14px 16px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  border-bottom:1px solid var(--border);

  background:
    linear-gradient(
      90deg,
      rgba(139,92,246,.10),
      rgba(231,185,63,.04)
    );
}

.providerName{
  color:var(--gold);
  font-size:18px;
  font-weight:900;
}

.providerActions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.smallBtn{
  padding:7px 10px;

  border:1px solid var(--border);
  border-radius:9px;

  background:var(--panel2);
  color:white;

  font-size:12px;
}

.smallBtn:hover{
  border-color:var(--gold);
}

.danger{
  color:#ff7373;
}

/* =========================
   PRODUCTS
   ========================= */

.products{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fill,
      minmax(260px,1fr)
    );

  gap:12px;
  padding:12px;
}

.productCard{
  position:relative;

  padding:15px;

  border:1px solid var(--border);
  border-radius:15px;

  background:var(--panel2);

  transition:.15s;
}

.productCard:hover{
  border-color:#444450;
}

.productCard.dragging{
  opacity:.4;
}

.drag{
  position:absolute;
  top:10px;
  right:10px;

  color:#666;

  cursor:grab;
  user-select:none;
}

.productName{
  padding-right:30px;

  font-size:17px;
  font-weight:900;
}

.capacity{
  display:inline-block;

  margin-top:6px;
  padding:4px 8px;

  border-radius:7px;

  background:#25252e;
  color:var(--gold);

  font-size:12px;
  font-weight:700;
}

.prices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;

  margin-top:13px;
}

.priceBox{
  padding:9px;

  border:1px solid #24242d;
  border-radius:10px;

  background:#101016;
}

.priceLabel{
  color:var(--muted);
  font-size:11px;
}

.priceValue{
  margin-top:3px;
  font-size:16px;
  font-weight:900;
}

.stockRow{
  margin-top:13px;
  padding-top:12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-top:1px solid #25252d;
}

.stockLabel{
  color:var(--muted);
  font-size:13px;
}

.stockControls{
  display:flex;
  align-items:center;
  gap:8px;
}

.stockBtn{
  width:31px;
  height:31px;

  border:1px solid var(--border);
  border-radius:8px;

  background:#101016;
  color:white;

  font-size:18px;
}

.stockValue{
  min-width:25px;
  text-align:center;
  font-weight:900;
}

.cardActions{
  display:flex;
  gap:7px;

  margin-top:12px;
}

.cardActions button{
  flex:1;

  padding:8px;

  border:1px solid var(--border);
  border-radius:9px;

  background:#101016;
  color:white;

  font-size:12px;
}

/* =========================
   EMPTY
   ========================= */

.empty{
  padding:35px 15px;

  color:var(--muted);
  text-align:center;
}

/* =========================
   CALCULATOR
   ========================= */

.calcButton{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:70;

  width:58px;
  height:58px;

  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      var(--gold),
      #a9740d
    );

  color:#111;
  font-size:24px;
  font-weight:900;

  box-shadow:
    0 10px 35px rgba(0,0,0,.5);
}

.calculator{
  position:fixed;
  right:18px;
  bottom:88px;
  z-index:69;

  width:320px;
  max-width:calc(100vw - 36px);

  padding:16px;

  border:1px solid var(--border);
  border-radius:17px;

  background:#111118;

  box-shadow:
    0 20px 60px rgba(0,0,0,.6);
}

.calculator h3{
  margin:0 0 12px;
}

.calculator input{
  width:100%;
  padding:11px;
  margin-bottom:8px;

  border:1px solid var(--border);
  border-radius:10px;

  background:#0c0c11;
  color:white;

  outline:none;
}

.calcResult{
  padding:13px;

  border-radius:10px;

  background:#0c0c11;

  color:var(--gold);

  text-align:center;
  font-size:21px;
  font-weight:900;
}

/* =========================
   MODAL
   ========================= */

.modalOverlay{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px;

  background:rgba(0,0,0,.75);
}

.modal{
  width:100%;
  max-width:480px;
  max-height:90vh;

  overflow:auto;

  padding:22px;

  border:1px solid var(--border);
  border-radius:18px;

  background:var(--panel);
}

.modal h2{
  margin:0 0 17px;
}

.modal label{
  display:block;

  margin:12px 0 6px;

  color:var(--muted);
  font-size:13px;
}

.modal input,
.modal select{
  width:100%;
  padding:12px;

  border:1px solid var(--border);
  border-radius:10px;

  background:#0c0c11;
  color:white;

  outline:none;
}

.modalActions{
  display:flex;
  gap:9px;

  margin-top:18px;
}

.modalActions button{
  flex:1;

  padding:12px;

  border:1px solid var(--border);
  border-radius:10px;

  background:var(--panel2);
  color:white;
}

.modalActions .primary{
  border:0;

  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--violet2)
    );
}

/* =========================
   TOAST
   ========================= */

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:200;

  transform:
    translateX(-50%)
    translateY(20px);

  opacity:0;

  pointer-events:none;

  padding:12px 17px;

  border:1px solid var(--border);
  border-radius:12px;

  background:#181820;
  color:white;

  transition:.2s;
}

#toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   MOBILE
   ========================= */

@media(max-width:700px){

  .headerInner{
    padding:12px;
  }

  .userName{
    display:none;
  }

  main{
    padding:16px 12px 100px;
  }

  .topControls{
    flex-direction:column;
  }

  .actionBtn{
    width:100%;
  }

  .providerHeader{
    align-items:flex-start;
    flex-direction:column;
  }

  .providerActions{
    width:100%;
  }

  .providerActions button{
    flex:1;
  }

  .products{
    grid-template-columns:1fr;
  }

  .calculator{
    right:12px;
    bottom:84px;
    max-width:calc(100vw - 24px);
  }

  .calcButton{
    right:12px;
    bottom:12px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
     ========================= -->

<section id="loginScreen">

  <div class="loginBox">

    <div class="loginLogo">
      STOCK iPHONE
    </div>

    <div class="loginSub">
      Panel de administración
    </div>

    <form id="loginForm">

      <input
        id="loginUser"
        type="text"
        placeholder="Usuario"
        autocomplete="username"
        required
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      >

      <button
        class="loginBtn"
        type="submit">
        INGRESAR
      </button>

      <div
        id="loginError"
        class="loginError">
      </div>

    </form>

  </div>

</section>


<!-- =========================
     APP
     ========================= -->

<section id="app" class="hidden">

<header>

  <div class="headerInner">

    <div class="logo">
      Agustín <span>/ Stock iPhone</span>
    </div>

    <div class="headerRight">

      <span class="userName">
        Administrador
      </span>

      <button
        id="logoutBtn"
        class="logoutBtn">
        Salir
      </button>

    </div>

  </div>

</header>


<main>

  <div class="titleArea">

    <h1>
      Stock
    </h1>

    <p>
      Administrá proveedores, productos,
      precios y cantidades.
    </p>

  </div>


  <!-- CONTROLES -->

  <div class="topControls">

    <div class="searchBox">

      <input
        id="searchInput"
        type="search"
        placeholder="Buscar iPhone..."
      >

    </div>

    <button
      id="addProviderBtn"
      class="actionBtn providerBtn">
      ＋ Proveedor
    </button>

    <button
      id="addProductBtn"
      class="actionBtn">
      ＋ Producto
    </button>

  </div>


  <!-- PROVEEDORES -->

  <div id="providersContainer"></div>

</main>

</section>


<!-- =========================
     CALCULADORA
     ========================= -->

<button
  id="calcButton"
  class="calcButton">
  ⌗
</button>

<div
  id="calculator"
  class="calculator hidden">

  <h3>
    Calculadora
  </h3>

  <input
    id="calcPrecio"
    type="number"
    placeholder="Precio proveedor">

  <input
    id="calcMargen"
    type="number"
    placeholder="Margen %">

  <div
    id="calcResult"
    class="calcResult">
    $0
  </div>

</div>


<!-- =========================
     MODAL PRODUCTO
     ========================= -->

<div
  id="productModal"
  class="modalOverlay hidden">

  <div class="modal">

    <h2 id="productModalTitle">
      Agregar producto
    </h2>

    <form id="productForm">

      <input
        id="productId"
        type="hidden">

      <label>
        Proveedor
      </label>

      <select
        id="productProvider"
        required>
      </select>


      <label>
        Producto
      </label>

      <input
        id="productName"
        type="text"
        placeholder="Ej: iPhone 15 Pro"
        required>


      <label>
        Capacidad
      </label>

      <select id="productCapacity">

        <option value="Ninguno">
          Ninguno
        </option>

        <option value="128 GB">
          128 GB
        </option>

        <option value="256 GB">
          256 GB
        </option>

        <option value="512 GB">
          512 GB
        </option>

        <option value="1 TB">
          1 TB
        </option>

      </select>


      <label>
        Precio proveedor / Costo
      </label>

      <input
        id="productCost"
        type="number"
        min="0"
        step="0.01"
        placeholder="0">


      <label>
        Precio de venta
      </label>

      <input
        id="productSale"
        type="number"
        min="0"
        step="0.01"
        placeholder="0">


      <label>
        Stock
      </label>

      <input
        id="productStock"
        type="number"
        min="0"
        step="1"
        value="0">


      <div class="modalActions">

        <button
          type="button"
          id="cancelProduct">
          Cancelar
        </button>

        <button
          type="submit"
          class="primary">
          Guardar
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =========================
     MODAL PROVEEDOR
     ========================= -->

<div
  id="providerModal"
  class="modalOverlay hidden">

  <div class="modal">

    <h2>
      Agregar proveedor
    </h2>

    <form id="providerForm">

      <label>
        Nombre del proveedor
      </label>

      <input
        id="providerName"
        type="text"
        placeholder="Ej: Proveedor 1"
        required>

      <div class="modalActions">

        <button
          type="button"
          id="cancelProvider">
          Cancelar
        </button>

        <button
          type="submit"
          class="primary">
          Agregar
        </button>

      </div>

    </form>

  </div>

</div>


<div id="toast"></div>


<script>

/* ==================================================
   CONFIGURACIÓN
   ================================================== */

const API =
  "https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";


let proveedores = [];
let productos = [];


const $ = id =>
  document.getElementById(id);


/* ==================================================
   UTILIDADES
   ================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function dinero(value){

  return "$" +
    Number(value || 0)
      .toLocaleString("es-AR",{
        maximumFractionDigits:0
      });

}


function mostrarToast(texto){

  const toast =
    $("toast");

  toast.textContent =
    texto;

  toast.classList.add("show");

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },2200);

}


/* ==================================================
   API
   ================================================== */

async function apiPost(data){

  const response =
    await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":
          "application/json"
      },
      body:JSON.stringify(data)
    });

  let result;

  try{

    result =
      await response.json();

  }catch{

    throw new Error(
      "El servidor devolvió una respuesta inválida"
    );

  }

  if(
    !response.ok ||
    result.ok === false
  ){

    throw new Error(
      result.error ||
      "Error del servidor"
    );

  }

  return result;

}


async function cargarStock(){

  const response =
    await fetch(API + "/stock");

  const result =
    await response.json();

  if(
    !response.ok ||
    result.ok === false
  ){

    throw new Error(
      result.error ||
      "No se pudo cargar el stock"
    );

  }

  proveedores =
    result.proveedores || [];

  productos =
    result.productos || [];

  render();

}


/* ==================================================
   LOGIN
   ================================================== */

$("loginForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    $("loginError").textContent =
      "";

    try{

      const response =
        await fetch(
          API + "/login",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },
            body:JSON.stringify({

              usuario:
                $("loginUser")
                  .value
                  .trim(),

              password:
                $("loginPassword")
                  .value

            })
          }
        );

      const result =
        await response.json();

      if(
        !response.ok ||
        result.ok === false
      ){

        throw new Error(
          result.error ||
          "Usuario o contraseña incorrectos"
        );

      }

      $("loginScreen")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      await cargarStock();

    }catch(error){

      $("loginError")
        .textContent =
          error.message;

    }

  }
);


/* ==================================================
   LOGOUT
   ================================================== */

$("logoutBtn").onclick =
  () => {

    $("app")
      .classList
      .add("hidden");

    $("loginScreen")
      .classList
      .remove("hidden");

    $("loginPassword")
      .value = "";

  };


/* ==================================================
   RENDER
   ================================================== */

function render(){

  const container =
    $("providersContainer");

  const busqueda =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();

  container.innerHTML = "";


  if(!proveedores.length){

    container.innerHTML = `
      <div class="provider">
        <div class="empty">
          No hay proveedores.
        </div>
      </div>
    `;

    return;

  }


  proveedores.forEach(
    proveedor => {

      let lista =
        productos.filter(
          producto =>
            Number(
              producto.proveedor_id
            ) === Number(
              proveedor.id
            )
        );


      if(busqueda){

        lista =
          lista.filter(
            producto => {

              const nombre =
                String(
                  producto.producto ||
                  ""
                ).toLowerCase();

              const capacidad =
                String(
                  producto.capacidad ||
                  ""
                ).toLowerCase();

              return (
                nombre.includes(busqueda) ||
                capacidad.includes(busqueda)
              );

            }
          );

      }


      const section =
        document.createElement(
          "section"
        );

      section.className =
        "provider";

      section.dataset.provider =
        proveedor.id;


      section.innerHTML = `

        <div class="providerHeader">

          <div class="providerName">
            ${escapeHtml(
              proveedor.nombre
            )}
          </div>

          <div class="providerActions">

            <button
              class="smallBtn"
              data-action="renameProvider"
              data-id="${proveedor.id}">
              Renombrar
            </button>

            <button
              class="smallBtn"
              data-action="adjustPrices"
              data-id="${proveedor.id}">
              Ajustar precios
            </button>

            <button
              class="smallBtn danger"
              data-action="deleteProvider"
              data-id="${proveedor.id}">
              Eliminar
            </button>

          </div>

        </div>

        <div class="products"></div>

      `;


      const productsBox =
        section.querySelector(
          ".products"
        );


      if(!lista.length){

        productsBox.innerHTML = `
          <div class="empty">
            No hay productos.
          </div>
        `;

      }else{

        lista.forEach(
          producto => {

            productsBox.appendChild(
              crearProducto(
                producto
              )
            );

          }
        );

      }


      container.appendChild(
        section
      );

    }
  );


  activarDrag();

}


/* ==================================================
   TARJETA PRODUCTO
   ================================================== */

function crearProducto(p){

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "productCard";

  card.draggable = true;

  card.dataset.id =
    p.id;

  card.dataset.provider =
    p.proveedor_id;


  card.innerHTML = `

    <div class="drag">
      ⋮⋮
    </div>

    <div class="productName">
      ${escapeHtml(
        p.producto
      )}
    </div>

    <div class="capacity">
      ${escapeHtml(
        p.capacidad ||
        "Ninguno"
      )}
    </div>

    <div class="prices">

      <div class="priceBox">

        <div class="priceLabel">
          Costo
        </div>

        <div class="priceValue">
          ${dinero(p.costo)}
        </div>

      </div>

      <div class="priceBox">

        <div class="priceLabel">
          Venta
        </div>

        <div class="priceValue">
          ${dinero(p.venta)}
        </div>

      </div>

    </div>

    <div class="stockRow">

      <div class="stockLabel">
        Stock
      </div>

      <div class="stockControls">

        <button
          class="stockBtn"
          data-action="stockMinus"
          data-id="${p.id}">
          −
        </button>

        <div class="stockValue">
          ${Number(
            p.cantidad || 0
          )}
        </div>

        <button
          class="stockBtn"
          data-action="stockPlus"
          data-id="${p.id}">
          +
        </button>

      </div>

    </div>

    <div class="cardActions">

      <button
        data-action="editProduct"
        data-id="${p.id}">
        Editar
      </button>

      <button
        data-action="deleteProduct"
        data-id="${p.id}">
        Eliminar
      </button>

    </div>

  `;


  return card;

}


/* ==================================================
   ACCIONES
   ================================================== */

document.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-action]"
      );

    if(!button)return;


    const action =
      button.dataset.action;

    const id =
      Number(
        button.dataset.id
      );


    try{

      /* STOCK + */

      if(action === "stockPlus"){

        const p =
          productos.find(
            x =>
              Number(x.id) === id
          );

        if(!p)return;

        await apiPost({

          accion:
            "cambiar_stock",

          id:p.id,

          cantidad:
            Number(
              p.cantidad || 0
            ) + 1

        });

        await cargarStock();

        return;

      }


      /* STOCK - */

      if(action === "stockMinus"){

        const p =
          productos.find(
            x =>
              Number(x.id) === id
          );

        if(!p)return;

        await apiPost({

          accion:
            "cambiar_stock",

          id:p.id,

          cantidad:
            Math.max(
              0,
              Number(
                p.cantidad || 0
              ) - 1
            )

        });

        await cargarStock();

        return;

      }


      /* EDITAR */

      if(action === "editProduct"){

        const p =
          productos.find(
            x =>
              Number(x.id) === id
          );

        if(p){

          abrirProducto(p);

        }

        return;

      }


      /* ELIMINAR PRODUCTO */

      if(action === "deleteProduct"){

        if(
          !confirm(
            "¿Eliminar este producto?"
          )
        )return;

        await apiPost({

          accion:
            "eliminar_producto",

          id

        });

        mostrarToast(
          "Producto eliminado"
        );

        await cargarStock();

        return;

      }


      /* RENOMBRAR */

      if(action === "renameProvider"){

        const p =
          proveedores.find(
            x =>
              Number(x.id) === id
          );

        if(!p)return;

        const nombre =
          prompt(
            "Nuevo nombre:",
            p.nombre
          );

        if(
          nombre === null ||
          !nombre.trim()
        )return;

        await apiPost({

          accion:
            "renombrar_proveedor",

          id,

          nombre:
            nombre.trim()

        });

        mostrarToast(
          "Proveedor actualizado"
        );

        await cargarStock();

        return;

      }


      /* AJUSTAR PRECIOS */

      if(action === "adjustPrices"){

        const montoTexto =
          prompt(
            "Monto a sumar/restar:",
            "0"
          );

        if(montoTexto === null)return;

        const monto =
          Number(montoTexto);

        if(
          !Number.isFinite(monto)
        ){

          mostrarToast(
            "Monto inválido"
          );

          return;

        }


        const tipo =
          prompt(
            "¿Qué querés modificar?\n\n1 - Costo\n2 - Venta\n3 - Ambos"
          );

        if(!tipo)return;

        await apiPost({

          accion:
            "ajustar_precios",

          proveedor_id:
            id,

          monto,

          costo:
            tipo === "1" ||
            tipo === "3",

          venta:
            tipo === "2" ||
            tipo === "3"

        });

        mostrarToast(
          "Precios actualizados"
        );

        await cargarStock();

        return;

      }


      /* ELIMINAR PROVEEDOR */

      if(action === "deleteProvider"){

        const p =
          proveedores.find(
            x =>
              Number(x.id) === id
          );

        if(!p)return;

        if(
          !confirm(
            "¿Eliminar " +
            p.nombre +
            " y todos sus productos?"
          )
        )return;

        await apiPost({

          accion:
            "eliminar_proveedor",

          id

        });

        mostrarToast(
          "Proveedor eliminado"
        );

        await cargarStock();

        return;

      }

    }catch(error){

      mostrarToast(
        error.message
      );

    }

  }
);

/* ==================================================
   PRODUCTO
   ================================================== */

$("addProductBtn").onclick =

    if(!proveedores.length){

      mostrarToast(
        "Primero agregá un proveedor"
      );

      return;

function llenarProveedores(){

  const select =
    $("productProvider");

  select.innerHTML = "";

  proveedores.forEach(
    proveedor => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        proveedor.id;

      option.textContent =
        proveedor.nombre;

      select.appendChild(
        option
      );

    }
  );

}


function abrirProducto(producto=null){

  llenarProveedores();

  $("productModal")
    .classList
    .remove("hidden");


  $("productModalTitle")
    .textContent =
      producto
        ? "Editar producto"
        : "Agregar producto";


  $("productId").value =
    producto?.id || "";


  $("productName").value =
    producto?.producto || "";


  $("productCapacity").value =
    producto?.capacidad ||
    "Ninguno";


  $("productCost").value =
    producto?.costo ??
    "";


  $("productSale").value =
    producto?.venta ??
    "";


  $("productStock").value =
    producto?.cantidad ??
    0;


  if(producto){

    $("productProvider").value =
      producto.proveedor_id;

  }else{

    if(proveedores.length){

      $("productProvider").value =
        proveedores[0].id;

    }

  }

}


$("cancelProduct").onclick =
  () => {

    $("productModal")
      .classList
      .add("hidden");

  };


$("productForm").onsubmit =
  async event => {

    event.preventDefault();

    try{

      const id =
        $("productId").value;


      const datos = {

        accion:
          id
            ? "editar_producto"
            : "agregar_producto",

        proveedor_id:
          Number(
            $("productProvider").value
          ),

        producto:
          $("productName")
            .value
            .trim(),

        capacidad:
          $("productCapacity")
            .value,

        costo:
          Number(
            $("productCost").value
          ) || 0,

        venta:
          Number(
            $("productSale").value
          ) || 0,

        cantidad:
          Math.max(
            0,
            Number(
              $("productStock").value
            ) || 0
          )

      };


      if(id){

        datos.id =
          Number(id);

      }


      await apiPost(
        datos
      );


      $("productModal")
        .classList
        .add("hidden");


      mostrarToast(
        id
          ? "Producto actualizado"
          : "Producto agregado"
      );


      await cargarStock();

    }catch(error){

      mostrarToast(
        error.message
      );

    }

  };

/* ==================================================
   DRAG & DROP
   ================================================== */

function activarDrag(){

  document
    .querySelectorAll(
      ".productCard"
    )
    .forEach(card => {

      card.addEventListener(
        "dragstart",
        () => {

          card.classList.add(
            "dragging"
          );

        }
      );


      card.addEventListener(
        "dragend",
        async () => {

          card.classList.remove(
            "dragging"
          );

          await guardarOrden(
            card.dataset.provider
          );

        }
      );


      card.addEventListener(
        "dragover",
        event => {

          event.preventDefault();

          const dragging =
            document.querySelector(
              ".productCard.dragging"
            );

          if(
            !dragging ||
            dragging === card
          ){
            return;
          }


          const rect =
            card.getBoundingClientRect();

          const antes =
            event.clientY <
            rect.top +
            rect.height / 2;


          if(antes){

            card.parentNode
              .insertBefore(
                dragging,
                card
              );

          }else{

            card.parentNode
              .insertBefore(
                dragging,
                card.nextSibling
              );

          }

        }
      );

    });

}


async function guardarOrden(
  providerId
){

  const section =
    document.querySelector(
      `.provider[data-provider="${providerId}"]`
    );

  if(!section)return;


  const ids =
    [
      ...section.querySelectorAll(
        ".productCard"
      )
    ]
    .map(
      card =>
        Number(
          card.dataset.id
        )
    );


  if(!ids.length)return;


  try{

    await apiPost({

      accion:
        "ordenar_productos",

      proveedor_id:
        Number(providerId),

      ids

    });

  }catch(error){

    mostrarToast(
      error.message
    );

  }

}


/* ==================================================
   CALCULADORA
   ================================================== */

$("calcButton").onclick =
  () => {

    $("calculator")
      .classList
      .toggle("hidden");

  };


function calcular(){

  const precio =
    Number(
      $("calcPrecio").value
    ) || 0;

  const margen =
    Number(
      $("calcMargen").value
    ) || 0;


  const resultado =
    precio +
    (
      precio *
      margen /
      100
    );


  $("calcResult")
    .textContent =
      dinero(resultado);

}


$("calcPrecio")
  .addEventListener(
    "input",
    calcular
  );


$("calcMargen")
  .addEventListener(
    "input",
    calcular
  );

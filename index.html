<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock iPhone</title>

<style>

:root {
  --bg: #09070d;
  --panel: #120d1a;
  --panel2: #181121;
  --purple: #8b5cf6;
  --purple2: #6d28d9;
  --gold: #eabf55;
  --gold2: #f5d778;
  --white: #f5f3fa;
  --gray: #aaa2b5;
  --red: #ef4444;
  --green: #55d187;
  --border: #2c2239;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at top right, #25133d 0%, transparent 35%),
    radial-gradient(circle at bottom left, #170e27 0%, transparent 35%),
    var(--bg);
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* =========================
   LOGIN
========================= */

#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.loginBox {
  width: 100%;
  max-width: 390px;
  background: rgba(18, 13, 26, .96);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 30px 24px;
  box-shadow: 0 20px 70px rgba(0,0,0,.5);
}

.loginLogo {
  text-align: center;
  font-size: 42px;
  margin-bottom: 8px;
}

.loginTitle {
  text-align: center;
  font-size: 25px;
  font-weight: 800;
}

.loginSub {
  text-align: center;
  color: var(--gray);
  margin: 8px 0 25px;
}

.loginBox label {
  display: block;
  color: var(--gray);
  font-size: 13px;
  margin: 14px 0 6px;
}

.loginBox input {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #0d0a12;
  color: white;
  outline: none;
}

.loginBox input:focus {
  border-color: var(--purple);
}

.loginButton {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: 0;
  border-radius: 13px;
  color: white;
  font-weight: 800;
  background: linear-gradient(135deg, var(--purple), var(--purple2));
}

.loginError {
  color: #ff7070;
  text-align: center;
  margin-top: 13px;
  min-height: 20px;
}


/* =========================
   APP
========================= */

#app {
  min-height: 100vh;
}

header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(9,7,13,.94);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
  padding: 15px 18px;
}

.headerInside {
  max-width: 1050px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 20px;
  font-weight: 900;
}

.logo span {
  color: var(--purple);
}

.headerButtons {
  display: flex;
  gap: 8px;
}

.iconButton {
  width: 43px;
  height: 43px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--panel);
  color: white;
  position: relative;
}

.logoutButton {
  border-color: #43202a;
}

.badge {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 19px;
  height: 19px;
  border-radius: 50%;
  background: var(--red);
  color: white;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
}

main {
  width: 100%;
  max-width: 1050px;
  margin: auto;
  padding: 20px 15px 100px;
}


/* =========================
   FORM
========================= */

.panel {
  background: rgba(18,13,26,.9);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 15px;
}

.panelTitle {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 13px;
}

.formGrid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 9px;
}

input,
select {
  width: 100%;
  padding: 11px 12px;
  background: #0c0911;
  border: 1px solid var(--border);
  border-radius: 11px;
  color: white;
  outline: none;
}

input:focus,
select:focus {
  border-color: var(--purple);
}

.primary {
  border: 0;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--purple), var(--purple2));
  color: white;
  font-weight: 800;
  padding: 11px 14px;
}

.secondary {
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #17101f;
  color: white;
  padding: 11px 14px;
}

.providerCreate {
  display: flex;
  gap: 9px;
}

.providerCreate input {
  flex: 1;
}


/* =========================
   PROVIDERS
========================= */

.provider {
  background: rgba(18,13,26,.88);
  border: 1px solid var(--border);
  border-radius: 17px;
  overflow: hidden;
  margin-bottom: 12px;
}

.providerHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 15px;
  cursor: pointer;
}

.providerLeft {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.arrow {
  color: var(--purple);
  font-size: 14px;
}

.providerName {
  font-weight: 850;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.productCount {
  color: var(--gray);
  font-size: 12px;
}

.dots {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 10px;
  background: #1a1224;
  color: white;
  font-size: 20px;
}

.products {
  padding: 0 10px 10px;
}

.product {
  position: relative;
  border: 1px solid #2a2135;
  background: #100c16;
  border-radius: 14px;
  padding: 13px;
  margin-top: 8px;
}

.productTop {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.productName {
  font-size: 16px;
  font-weight: 800;
}

.capacity {
  color: var(--gold2);
  font-size: 16px;
  font-weight: 700;
  margin-top: 4px;
}

.cost {
  color: var(--gray);
  font-size: 13px;
  margin-top: 3px;
}

.sale {
  color: white;
  font-weight: 850;
  font-size: 16px;
}

.stockRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 13px;
}

.stock {
  flex: 1;
  text-align: center;
  color: var(--gold2);
  font-weight: 850;
  font-size: 14px;
}

.calcControls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.calcControls button {
  width: 35px;
  height: 35px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #191223;
  color: white;
  font-weight: 900;
}

.calcQty {
  min-width: 25px;
  text-align: center;
  font-weight: 800;
}

.productMenuButton {
  border: 0;
  background: transparent;
  color: var(--gray);
  font-size: 20px;
}


/* =========================
   CALCULATOR
========================= */

#calculatorPanel {
  position: fixed;
  top: 0;
  right: -430px;
  width: 430px;
  max-width: 100%;
  height: 100vh;
  z-index: 100;
  background: #0e0a13;
  border-left: 1px solid var(--border);
  transition: right .25s ease;
  display: flex;
  flex-direction: column;
}

#calculatorPanel.open {
  right: 0;
}

.calcHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 17px;
  border-bottom: 1px solid var(--border);
}

.calcHeader h2 {
  margin: 0;
}

.calcClose {
  border: 0;
  background: #1a1224;
  color: white;
  border-radius: 10px;
  width: 38px;
  height: 38px;
}

.calcItems {
  flex: 1;
  overflow: auto;
  padding: 12px;
}

.calcItem {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.calcItemName {
  font-weight: 800;
}

.calcItemInfo {
  color: var(--gray);
  font-size: 13px;
  margin-top: 3px;
}

.calcTotals {
  padding: 17px;
  border-top: 1px solid var(--border);
  background: #120d1a;
}

.totalLine {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.profit {
  color: var(--green);
  font-weight: 900;
}

.totalSale {
  font-size: 27px;
  font-weight: 950;
  color: var(--gold2);
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
}

.clearCalc {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border: 1px solid #51232e;
  border-radius: 11px;
  background: #211018;
  color: #ff8c9b;
}


/* =========================
   MODAL
========================= */

.modalBg {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,.7);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal {
  width: 100%;
  max-width: 430px;
  background: #120d1a;
  border: 1px solid var(--border);
  border-radius: 19px;
  padding: 20px;
}

.modal h3 {
  margin-top: 0;
}

.modalActions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.modalActions button {
  flex: 1;
}

.checkRow {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  margin-top: 8px;
}

.checkRow input {
  width: 20px;
  height: 20px;
  accent-color: var(--purple);
}


/* =========================
   TOAST
========================= */

#toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%) translateY(100px);
  background: #21182d;
  border: 1px solid var(--border);
  color: white;
  padding: 12px 18px;
  border-radius: 12px;
  z-index: 500;
  transition: .25s;
}

#toast.show {
  transform: translateX(-50%) translateY(0);
}


/* =========================
   LOADING
========================= */

#loading {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0,0,0,.75);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

  main {
    padding: 14px 10px 80px;
  }

  .formGrid {
    grid-template-columns: 1fr 1fr;
  }

  .formGrid .full {
    grid-column: 1 / -1;
  }

  #calculatorPanel {
    width: 100%;
  }

  .stockRow {
    gap: 5px;
  }

  .stock {
    font-size: 13px;
  }
}

@media(max-width:430px) {

  .formGrid {
    grid-template-columns: 1fr;
  }

  .formGrid .full {
    grid-column: auto;
  }

  .providerCreate {
    flex-direction: column;
  }

}

</style>
</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

  <form
    class="loginBox"
    id="loginForm"
    autocomplete="on"
  >

    <div class="loginLogo">📱</div>

    <div class="loginTitle">
      Stock iPhone
    </div>

    <div class="loginSub">
      Iniciá sesión para continuar
    </div>

    <label for="loginUser">
      Usuario
    </label>

    <input
      id="loginUser"
      name="username"
      type="text"
      autocomplete="username"
      required
    >

    <label for="loginPassword">
      Contraseña
    </label>

    <input
      id="loginPassword"
      name="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button
      class="loginButton"
      type="submit"
    >
      Iniciar sesión
    </button>

    <div
      id="loginError"
      class="loginError"
    ></div>

  </form>

</section>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

<header>

  <div class="headerInside">

    <div class="logo">
      📱 <span>Stock</span> iPhone
    </div>

    <div class="headerButtons">

      <button
        class="iconButton"
        id="calculatorButton"
        title="Calculadora"
      >
        🧮
        <span
          id="calcBadge"
          class="badge hidden"
        >0</span>
      </button>

      <button
        class="iconButton logoutButton"
        id="logoutButton"
        title="Cerrar sesión"
      >
        ⎋
      </button>

    </div>

  </div>

</header>


<main>


<!-- =========================
     CREAR PROVEEDOR
========================= -->

<section class="panel">

  </div>

  <div class="providerCreate">

    <input
      id="providerName"

    >

<!-- =========================
     AGREGAR PRODUCTO
========================= -->

<section class="panel">

  </div>

  <div class="formGrid">

    <input
      id="productName"

      placeholder="iPhone 13 Pro Max"
    >

    <select
      id="productProvider"
    >
      <option value="">

      </option>
    </select>

    <select
      id="productCapacity"
    >
      <option value="128 GB">128 GB</option>
      <option value="256 GB">256 GB</option>

<!-- =========================
     PRODUCTOS
========================= -->

<div id="providersContainer"></div>

</main>

</div>


<!-- =========================
     CALCULADORA
========================= -->

<aside id="calculatorPanel">

  <div class="calcHeader">

    <h2>
      🧮 Calculadora
    </h2>

    <button
      class="calcClose"
      id="closeCalculator"
    >
      ✕
    </button>

  </div>

  <div
    class="calcItems"
    id="calcItems"
  ></div>

  <div class="calcTotals">

    <div class="totalLine">
      <span>Ganancia</span>
      <strong
        class="profit"
        id="calcProfit"
      >
        $0
      </strong>
    </div>

    <div class="totalLine">
      <span>Total costo</span>
      <strong id="calcCost">
        $0
      </strong>
    </div>

    <div class="totalSale">
      <span>TOTAL DE VENTA</span>
      <span id="calcSale">
        $0
      </span>
    </div>

    <button
      class="clearCalc"
      id="clearCalculator"
    >
      Vaciar calculadora
    </button>

  </div>

</aside>


<!-- =========================
     MODAL
========================= -->

<div
  id="modalBg"
  class="modalBg hidden"
>

  <div class="modal">

    <h3 id="modalTitle">
      Opciones
    </h3>

    <div id="modalContent"></div>

    <div class="modalActions">

      <button
        class="secondary"
        id="modalCancel"
      >
        Cancelar
      </button>

      <button
        class="primary"
        id="modalConfirm"
      >
        Confirmar
      </button>

    </div>

  </div>

</div>


<div id="toast"></div>

<div id="loading" class="hidden">
  Cargando…
</div>


<script>

const API_URL =
  "https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";


let sessionToken =
  sessionStorage.getItem("stock_session") || "";

let proveedores = [];
let productos = [];

let calculator = {};

let modalAction = null;
let modalData = null;


/* =========================
   ELEMENTOS
========================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const loginError =
  document.getElementById("loginError");

const loading =
  document.getElementById("loading");


/* =========================
   HELPERS
========================= */

function money(value) {

  return "$" + Number(value || 0)
    .toLocaleString("es-AR", {
      maximumFractionDigits: 0
    });

}


function showLoading(show) {

  loading.classList.toggle(
    "hidden",
    !show
  );

}


function toast(message) {

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(() => {
    el.classList.remove("show");
  }, 2200);

}


/* =========================
   API
========================= */

async function api(path = "", options = {}) {

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (sessionToken) {
    headers.Authorization =
      "Bearer " + sessionToken;
  }

  const response =
    await fetch(
      API_URL + path,
      {
        ...options,
        headers
      }
    );

  const data =
    await response.json();

  if (response.status === 401) {

    sessionToken = "";

    sessionStorage.removeItem(
      "stock_session"
    );

    showLogin();

    throw new Error(
      data.mensaje || "Sesión vencida"
    );
  }

  if (!response.ok || data.ok === false) {

    throw new Error(
      data.mensaje || "Error"
    );
  }

  return data;
}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    loginError.textContent = "";

    const usuario =
      document.getElementById("loginUser").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    try {

      const response =
        await fetch(
          API_URL + "/login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              usuario,
              password
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok || !data.ok) {

        loginError.textContent =
          data.mensaje ||
          "Usuario o contraseña incorrectos";

        return;
      }

      sessionToken =
        data.token;

      sessionStorage.setItem(
        "stock_session",
        sessionToken
      );

      showApp();

      await loadData();

    } catch (error) {

      loginError.textContent =
        "No se pudo conectar con el servidor.";

    }

  }
);


/* =========================
   MOSTRAR APP
========================= */

function showApp() {

  loginScreen.classList.add(
    "hidden"
  );

  app.classList.remove(
    "hidden"
  );

}


function showLogin() {

  app.classList.add(
    "hidden"
  );

  loginScreen.classList.remove(
    "hidden"
  );

}


/* =========================
   CARGAR DATOS
========================= */

async function loadData() {

  try {

    showLoading(true);

    const data =
      await api();

    proveedores =
      data.proveedores || [];

    productos =
      data.productos || [];

    render();

  } catch (error) {

    toast(error.message);

  } finally {

    showLoading(false);

  }

}


/* =========================
   RENDER
========================= */

function render() {

  renderProviders();

  renderProviderSelect();

  renderCalculator();

}


/* =========================
   PROVEEDORES
========================= */

function renderProviderSelect() {

  const select =
    document.getElementById(
      "productProvider"
    );

  const current =
    select.value;

  select.innerHTML =
    `<option value="">
      Seleccionar proveedor
    </option>`;

  proveedores.forEach(provider => {

    const option =
      document.createElement("option");

    option.value =
      provider.id;

    option.textContent =
      provider.nombre;

    select.appendChild(option);

  });

  if (
    proveedores.some(
      p => String(p.id) === String(current)
    )
  ) {
    select.value = current;
  }

}


function renderProviders() {

  const container =
    document.getElementById(
      "providersContainer"
    );

  container.innerHTML = "";

  proveedores.forEach(provider => {

    const providerProducts =
      productos.filter(
        product =>
          Number(product.proveedor_id) ===
          Number(provider.id)
      );

    const providerEl =
      document.createElement("section");

    providerEl.className =
      "provider";

    const header =
      document.createElement("div");

    header.className =
      "providerHeader";

    header.innerHTML = `
      <div class="providerLeft">
        <span class="arrow">▼</span>
        <span class="providerName">
          ${escapeHtml(provider.nombre)}
        </span>
        <span class="productCount">
          ${providerProducts.length}
        </span>
      </div>

      <button
        class="dots"
        type="button"
      >
        ⋮
      </button>
    `;

    const productsEl =
      document.createElement("div");

    productsEl.className =
      "products";

    providerProducts.forEach(product => {

      productsEl.appendChild(
        createProductElement(product)
      );

    });

    header
      .querySelector(".dots")
      .addEventListener(
        "click",
        event => {

          event.stopPropagation();

          openProviderMenu(
            provider
          );

        }
      );

    header.addEventListener(
      "click",
      () => {

        productsEl.classList.toggle(
          "hidden"
        );

        const arrow =
          header.querySelector(".arrow");

        arrow.textContent =
          productsEl.classList.contains(
            "hidden"
          )
            ? "▶"
            : "▼";

      }
    );

    providerEl.appendChild(header);
    providerEl.appendChild(productsEl);

    container.appendChild(providerEl);

  });

}


/* =========================
   PRODUCTO
========================= */

function createProductElement(product) {

  const el =
    document.createElement("article");

  el.className =
    "product";

  const qty =
    calculator[product.id] || 0;

  el.innerHTML = `

    <div class="productTop">

      <div>

        <div class="productName">
          ${escapeHtml(product.producto)}
        </div>

        <div class="capacity">
          ${escapeHtml(product.capacidad || "128 GB")}
        </div>

        <div class="cost">
          Costo: ${money(product.costo)}
        </div>

      </div>

      <button
        class="productMenuButton"
        type="button"
      >
        ⋮
      </button>

    </div>

    <div class="stockRow">

      <div class="sale">
        ${money(product.venta)}
      </div>

      <div class="stock">
        STOCK: ${product.cantidad}
      </div>

      <div class="calcControls">

        <button
          type="button"
          class="minus"
        >
          −
        </button>

        <span class="calcQty">
          ${qty}
        </span>

        <button
          type="button"
          class="plus"
        >
          +
        </button>

      </div>

    </div>

  `;


  el.querySelector(
    ".productMenuButton"
  ).addEventListener(
    "click",
    event => {

      event.stopPropagation();

      openProductMenu(
        product
      );

    }
  );


  el.querySelector(
    ".minus"
  ).addEventListener(
    "click",
    () => {

      calculator[product.id] =
        Math.max(
          0,
          (calculator[product.id] || 0) - 1
        );

      if (
        calculator[product.id] === 0
      ) {
        delete calculator[product.id];
      }

      renderCalculator();
      renderProviders();

    }
  );


  el.querySelector(
    ".plus"
  ).addEventListener(
    "click",
    () => {

      calculator[product.id] =
        (calculator[product.id] || 0) + 1;

      renderCalculator();
      renderProviders();

    }
  );


  return el;

}

    document.getElementById(
      "modalConfirm"

    "Guardar";

    async () => {

      try {

        showLoading(true);

        await api("", {
          method: "POST",
          body: JSON.stringify({

            accion:
              "editar_producto",

            id:
              product.id,

            proveedor_id:
              document.getElementById(

            producto:

              Number(

                ).value

            costo:
              Number(
                document.getElementById(
                  "editCost"
                ).value
              ),

            cantidad:
              Number(

                  "editStock"
                ).value

          })

        await loadData();

        toast(
          "Producto actualizado"

        toast(error.message);

        showLoading(false);

function openAdjustProvider(provider) {

  document.getElementById(
    "modalTitle"
  ).textContent =
    "Ajustar precios";

  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <p style="color:#aaa2b5;font-size:13px">
      Podés aumentar o bajar hasta $1000.
      Elegí qué precios querés modificar.
    </p>

    <input
      id="adjustAmount"
      type="number"
      min="-1000"
      max="1000"
      placeholder="Ej: +20 o -20"
    >

    <label class="checkRow">
      <input
        type="checkbox"
        id="adjustCost"
        checked
      >
      <span>
        Proveedor / Costo
      </span>
    </label>

    <label class="checkRow">
      <input
        type="checkbox"
        id="adjustSale"
        checked
      >
      <span>
        Vendedor / Venta
      </span>
    </label>

  `;

  document.getElementById(
    "modalCancel"
  ).onclick =
    closeModal;

  const confirm =
    document.getElementById(
      "modalConfirm"
    );

  confirm.classList.remove(
    "hidden"
  );

  confirm.textContent =
    "Aplicar";

  confirm.onclick =
    async () => {

      const monto =
        Number(
          document.getElementById(
            "adjustAmount"
          ).value
        );

      const costo =
        document.getElementById(
          "adjustCost"
        ).checked;

      const venta =
        document.getElementById(
          "adjustSale"
        ).checked;

      if (
        !Number.isFinite(monto) ||
        monto < -1000 ||
        monto > 1000
      ) {

        toast(
          "El monto debe estar entre -1000 y 1000"
        );

        return;

      }

      if (!costo && !venta) {

        toast(
          "Seleccioná costo, venta o ambos"
        );

        return;

      }

      try {

        showLoading(true);

        await api("", {
          method: "POST",
          body: JSON.stringify({

            accion:
              "ajustar_precios",

            proveedor_id:
              provider.id,

            monto,

            costo,

            venta

          })
        });

        closeModal();

        await loadData();

        toast(
          "Precios actualizados"
        );

      } catch (error) {

        toast(error.message);

      } finally {

        showLoading(false);

      }

    };


  document.getElementById(
    "modalBg"
  ).classList.remove(
    "hidden"
  );

}

function renderCalculator() {

  const container =
    document.getElementById(
      "calcItems"
    );

  container.innerHTML = "";

  let totalCost = 0;
  let totalSale = 0;
  let totalItems = 0;

  Object.entries(
    calculator
  ).forEach(
    ([id, qty]) => {

      const product =
        productos.find(
          p =>
            Number(p.id) ===
            Number(id)
        );

      if (!product || qty <= 0) {
        return;
      }

      totalItems += qty;

      totalCost +=
        Number(product.costo) *
        qty;

      totalSale +=
        Number(product.venta) *
        qty;

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "calcItem";

      item.innerHTML = `

        <div class="calcItemName">
          ${escapeHtml(product.producto)}
          · ${escapeHtml(product.capacidad || "128 GB")}
        </div>

        <div class="calcItemInfo">
          ${qty} × ${money(product.venta)}
          =
          ${money(product.venta * qty)}
        </div>

      `;

      container.appendChild(item);

    }
  );


  if (!totalItems) {

    container.innerHTML = `
      <div style="
        text-align:center;
        color:#aaa2b5;
        padding:35px 10px
      ">
        Todavía no agregaste productos.
      </div>
    `;

  }


  const profit =
    totalSale - totalCost;

  document.getElementById(
    "calcProfit"
  ).textContent =
    money(profit);

  document.getElementById(
    "calcCost"
  ).textContent =
    money(totalCost);

  document.getElementById(
    "calcSale"
  ).textContent =
    money(totalSale);


  const badge =
    document.getElementById(
      "calcBadge"
    );

  badge.textContent =
    totalItems;

  badge.classList.toggle(
    "hidden",
    totalItems === 0
  );

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttr(value) {

  return escapeHtml(value);

}


/* =========================
   INICIO
========================= */

if (sessionToken) {

  showApp();

  loadData();

} else {

  showLogin();

}

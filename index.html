.calcBtn{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;border:1px solid #3b3b47;background:#171720;color:white;font-size:22px;z-index:100}.badge{position:absolute;right:-3px;top:-3px;min-width:20px;height:20px;border-radius:10px;background:#ef4444;color:white;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 5px}.sideCalc{position:fixed;right:0;top:0;height:100%;width:min(390px,100%);background:#0e0e14;border-left:1px solid var(--border);z-index:200;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}.sideCalc.open{transform:translateX(0)}.calcHead{display:flex;align-items:center;justify-content:space-between;padding:18px;border-bottom:1px solid var(--border)}.calcHead h2{margin:0;font-size:18px}.calcClose,.clearCalc{border:0;background:transparent;color:var(--muted);padding:7px}.calcItems{flex:1;overflow:auto;padding:12px 18px}.calcItem{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #20202a;font-size:13px}.calcTotals{padding:15px 18px;border-top:1px solid var(--border)}.totalLine,.totalSale{display:flex;justify-content:space-between}.totalLine{margin:7px 0;color:var(--muted)}.totalLine strong{color:white}.totalSale{align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:18px;font-weight:950}.totalSale span:last-child{color:var(--gold2);font-size:24px}

<body>
<div id="loginScreen"><form class="loginBox" id="loginForm"><div class="loginTitle"><span>Stock</span> iPhone</div><div class="field"><label>Usuario</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="primary">Ingresar</button><div id="loginError" class="error"></div></form></div>
<main class="app hidden" id="app"><header class="topbar"><div class="brand"><div class="brandUser">Agustín</div><div class="brandName"><span>Stock</span> iPhone</div></div><button class="logout" id="logoutBtn">Salir</button></header><div class="searchRow"><input class="search" id="search" placeholder="Buscar producto..."><button class="addBtn" id="addProductBtn">＋ Agregar producto</button></div><section id="providers"></section></main>
<button class="calcBtn" id="calcBtn">🧮<span class="badge" id="calcBadge">0</span></button><div class="overlay" id="overlay"></div><aside class="sideCalc" id="sideCalc"><div class="calcHead"><h2>Calculadora</h2><button class="calcClose" id="calcClose">✕</button></div><div class="calcItems" id="calcItems"></div><div class="calcTotals"><div class="totalLine"><span>Ganancia</span><strong id="calcProfit">$0</strong></div><div class="totalLine"><span>Total costo</span><strong id="calcCost">$0</strong></div><div class="totalSale"><span>TOTAL DE VENTA</span><span id="calcSale">$0</span></div><button class="clearCalc" id="clearCalc">Vaciar calculadora</button></div></aside><div class="modal" id="modal"></div><div class="toast" id="toast"></div>
<script>
const API_URL="https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";let token=localStorage.getItem("stock_token")||"",proveedores=[],productos=[],calc={};const $=id=>document.getElementById(id);function money(n){return "$"+Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:0})}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function toast(m){let t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}function headers(){return{"Content-Type":"application/json",Authorization:"Bearer "+token}}async function api(b){let r=await fetch(API_URL,{method:"POST",headers:headers(),body:JSON.stringify(b)}),d=await r.json();if(r.status===401){logout(false);throw Error("Sesión expirada")}if(!r.ok||d.ok===false)throw Error(d.error||"Error");return d}async function load(){let r=await fetch(API_URL,{headers:{Authorization:"Bearer "+token}}),d=await r.json();if(r.status===401||!d.ok)return logout(false);proveedores=d.proveedores||[];productos=d.productos||[];render()}function loginShow(){$("loginScreen").classList.remove("hidden");$("app").classList.add("hidden")}function appShow(){$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden")}function logout(server=true){if(server&&token)fetch(API_URL,{method:"POST",headers:headers(),body:JSON.stringify({accion:"logout"})}).catch(()=>{});token="";localStorage.removeItem("stock_token");loginShow()}$("loginForm").onsubmit=async e=>{e.preventDefault();try{let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usuario:$('loginUser').value,password:$('loginPassword').value})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Usuario o contraseña incorrectos");token=d.token;localStorage.setItem("stock_token",token);appShow();load()}catch(e){$("loginError").textContent=e.message}};$('logoutBtn').onclick=()=>logout();
function render(){let q=$("search").value.trim().toLowerCase(),root=$("providers");root.innerHTML="";proveedores.forEach(p=>{let list=productos.filter(x=>Number(x.proveedor_id)===Number(p.id)&&(!q||String(x.producto).toLowerCase().includes(q)||String(x.capacidad||"").toLowerCase().includes(q)));let box=document.createElement("section");box.className="provider";box.innerHTML=`<div class="providerHead"><button class="providerToggle">⌄</button><div class="providerName">${esc(p.nombre)}</div><div class="providerTools"><button class="smallBtn rename">Renombrar</button><button class="smallBtn adjust">Precios</button></div><button class="providerMenu">⋮</button></div><div class="products"></div>`;let pe=box.querySelector(".products");list.forEach(x=>pe.appendChild(productEl(x)));if(!list.length)pe.innerHTML='<div class="empty">Sin productos.</div>';else{let h=document.createElement("div");h.className="dragHint";h.textContent="Mantén presionado y arrastra para cambiar el orden";pe.appendChild(h);setupDrag(pe,p.id)}box.querySelector(".providerToggle").onclick=()=>{pe.classList.toggle("hidden");box.querySelector(".providerToggle").textContent=pe.classList.contains("hidden")?"›":"⌄"};box.querySelector(".rename").onclick=()=>renameProvider(p);box.querySelector(".adjust").onclick=()=>adjustProvider(p);box.querySelector(".providerMenu").onclick=()=>deleteProvider(p);root.appendChild(box)});updateCalc()}
function productEl(p){let el=document.createElement("article"),cap=p.capacidad&&p.capacidad!=="Ninguno"?`<div class="capacity">${esc(p.capacidad)}</div>`:"",q=calc[p.id]||0;el.className="product";el.dataset.id=p.id;el.innerHTML=`<div class="productInfo"><div class="productName">${esc(p.producto)}</div>${cap}<div class="cost">Costo: ${money(p.costo)}</div><div class="sale">${money(p.venta)}</div></div><div class="productRight"><div class="stockText">STOCK: <span class="stockNumber">${Number(p.cantidad)}</span></div><div class="calcControls"><button class="minus">−</button><div class="calcQty">${q}</div><button class="plus">+</button></div></div><div class="productMenu"><button>⋮</button><div class="menuBox hidden"><button class="edit">Editar</button><button class="delete danger">Eliminar</button></div></div>`;el.querySelector(".plus").onclick=()=>changeCalc(p,1);el.querySelector(".minus").onclick=()=>changeCalc(p,-1);let m=el.querySelector(".menuBox");el.querySelector(".productMenu>button").onclick=e=>{e.stopPropagation();m.classList.toggle("hidden")};el.querySelector(".edit").onclick=()=>editProduct(p);el.querySelector(".delete").onclick=()=>deleteProduct(p);return el}function changeCalc(p,d){let n=Math.max(0,Math.min(Number(p.cantidad)||0,(calc[p.id]||0)+d));if(n)calc[p.id]=n;else delete calc[p.id];render()}function updateCalc(){let ids=Object.keys(calc),cost=0,sale=0,items=$("calcItems");items.innerHTML="";ids.forEach(id=>{let p=productos.find(x=>String(x.id)===String(id));if(!p)return;let q=calc[id];cost+=q*p.costo;sale+=q*p.venta;let r=document.createElement("div");r.className="calcItem";r.innerHTML=`<span>${esc(p.producto)} × ${q}</span><strong>${money(q*p.venta)}</strong>`;items.appendChild(r)});$("calcCost").textContent=money(cost);$("calcSale").textContent=money(sale);$("calcProfit").textContent=money(sale-cost);$("calcBadge").textContent=ids.reduce((a,id)=>a+calc[id],0)}
function openModal(title,html,fn){$("modal").innerHTML=`<h3>${title}</h3>${html}<div class="modalActions"><button class="cancel">Cancelar</button><button class="confirm">Guardar</button></div>`;$("overlay").classList.add("show");$("modal").classList.add("show");$("modal .cancel").onclick=closeModal;$("modal .confirm").onclick=async()=>{try{await fn();closeModal();await load()}catch(e){toast(e.message)}}}function closeModal(){$("overlay").classList.remove("show");$("modal").classList.remove("show")}$("overlay").onclick=closeModal;
function renameProvider(p){openModal("Renombrar proveedor",`<div class="field"><label>Nombre</label><input id="mName" value="${esc(p.nombre)}"></div>`,()=>api({accion:"renombrar_proveedor",id:p.id,nombre:$("mName").value}))}function adjustProvider(p){openModal("Ajustar precios",`<div class="field"><label>Monto</label><input id="mAmount" type="number" min="-1000" max="1000" value="0"></div><div class="checks"><label><input id="mCost" type="checkbox"> Proveedor / Costo</label><label><input id="mSale" type="checkbox"> Vendedor / Venta</label></div>`,()=>{let m=Math.max(-1000,Math.min(1000,Number($("mAmount").value)||0)),c=$("mCost").checked,s=$("mSale").checked;if(!c&&!s)throw Error("Seleccioná Costo, Venta o ambos.");return api({accion:"ajustar_precios",proveedor_id:p.id,monto:m,costo:c,venta:s})})}async function deleteProvider(p){if(confirm(`¿Eliminar el proveedor "${p.nombre}" y todos sus productos?`))try{await api({accion:"eliminar_proveedor",id:p.id});load()}catch(e){toast(e.message)}}function productForm(p=null){let opts=proveedores.map(x=>`<option value="${x.id}" ${p&&+p.proveedor_id===+x.id?"selected":""}>${esc(x.nombre)}</option>`).join("");return `<div class="field"><label>Producto</label><input id="mProduct" value="${p?esc(p.producto):""}"></div><div class="field"><label>Proveedor</label><select id="mProvider">${opts}</select></div><div class="field"><label>Capacidad</label><select id="mCapacity">${["Ninguno","128 GB","256 GB","512 GB","1 TB"].map(x=>`<option ${p?.capacidad===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Precio de venta</label><input id="mSalePrice" type="number" min="0" value="${p?.venta||0}"></div><div class="field"><label>Costo</label><input id="mCostPrice" type="number" min="0" value="${p?.costo||0}"></div><div class="field"><label>Stock</label><input id="mStock" type="number" min="0" value="${p?.cantidad||0}"></div>`}function addProduct(){if(!proveedores.length)return toast("Primero agregá un proveedor.");openModal("Agregar producto",productForm(),()=>api({accion:"agregar_producto",proveedor_id:+$("mProvider").value,producto:$("mProduct").value,capacidad:$("mCapacity").value,venta:+$("mSalePrice").value||0,costo:+$("mCostPrice").value||0,cantidad:+$("mStock").value||0}))}function editProduct(p){openModal("Editar producto",productForm(p),()=>api({accion:"editar_producto",id:p.id,proveedor_id:+$("mProvider").value,producto:$("mProduct").value,capacidad:$("mCapacity").value,venta:+$("mSalePrice").value||0,costo:+$("mCostPrice").value||0,cantidad:+$("mStock").value||0}))}async function deleteProduct(p){if(confirm(`¿Eliminar "${p.producto}"?`))try{delete calc[p.id];await api({accion:"eliminar_producto",id:p.id});load()}catch(e){toast(e.message)}}
$("addProductBtn").onclick=addProduct;$("search").oninput=render;$("calcBtn").onclick=()=>{$("sideCalc").classList.add("open");$("overlay").classList.add("show")};$("calcClose").onclick=()=>{$("sideCalc").classList.remove("open");$("overlay").classList.remove("show")};$("clearCalc").onclick=()=>{calc={};updateCalc();render()};
function setupDrag(container,providerId){let active=null,moved=false,startX=0,startY=0,pressTimer=null,pointerId=null;const cards=[...container.querySelectorAll(".product")];cards.forEach(card=>{card.draggable=true;card.addEventListener("dragstart",e=>{active=card;card.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",card.dataset.id)});card.addEventListener("dragover",e=>{e.preventDefault();if(!active||active===card)return;card.classList.add("dropTarget");const r=card.getBoundingClientRect();container.insertBefore(active,e.clientY<r.top+r.height/2?card:card.nextSibling)});card.addEventListener("dragend",async()=>{if(active)active.classList.remove("dragging");cards.forEach(c=>c.classList.remove("dropTarget"));if(active)await saveDomOrder(container,providerId);active=null});card.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")return;if(e.target.closest("button"))return;pointerId=e.pointerId;active=card;startX=e.clientX;startY=e.clientY;moved=false;card.setPointerCapture?.(pointerId);clearTimeout(pressTimer);pressTimer=setTimeout(()=>{moved=true;card.classList.add("dragging")},220)});card.addEventListener("pointermove",e=>{if(e.pointerType!=="touch"||pointerId!==e.pointerId||active!==card)return;if(!moved){if(Math.hypot(e.clientX-startX,e.clientY-startY)>8){clearTimeout(pressTimer);active=null}return}e.preventDefault();const target=cards.find(c=>c!==card&&(()=>{const r=c.getBoundingClientRect();return e.clientY>=r.top&&e.clientY<=r.bottom})());if(target){cards.forEach(c=>c.classList.remove("dropTarget"));target.classList.add("dropTarget");const r=target.getBoundingClientRect();container.insertBefore(card,e.clientY<r.top+r.height/2?target:target.nextSibling)}},{passive:false});card.addEventListener("pointerup",async e=>{if(e.pointerType!=="touch"||pointerId!==e.pointerId)return;clearTimeout(pressTimer);if(moved){card.classList.remove("dragging");cards.forEach(c=>c.classList.remove("dropTarget"));await saveDomOrder(container,providerId)}active=null;moved=false;pointerId=null});card.addEventListener("pointercancel",()=>{clearTimeout(pressTimer);card.classList.remove("dragging");cards.forEach(c=>c.classList.remove("dropTarget"));active=null;moved=false;pointerId=null})})}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Stock iPhone</title>

<style>
:root{
  --bg:#09090d;
  --panel:#111118;
  --panel2:#171720;
  --border:#292934;
  --text:#f5f5f7;
  --muted:#9696a3;
  --gold:#e7b93f;
  --gold2:#f1c84d;
  --violet:#8b5cf6;
  --violet2:#6d3de8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 15%,rgba(139,92,246,.18),transparent 35%),
    radial-gradient(circle at 50% 90%,rgba(231,185,63,.08),transparent 35%),
    var(--bg);
}

.loginBox{
  width:100%;
  max-width:420px;
  padding:32px 26px;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(17,17,24,.94);
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.loginLogo{
  text-align:center;
  font-size:28px;
  font-weight:900;
  margin-bottom:6px;
  color:var(--gold);
}

.loginSub{
  text-align:center;
  color:var(--muted);
  margin-bottom:28px;
}

.loginBox input{
  width:100%;
  padding:14px 15px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0d0d13;
  color:var(--text);
  outline:none;
}

.loginBox input:focus{
  border-color:var(--violet);
}

.loginBtn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,var(--gold),#b98618);
  color:#111;
  font-weight:900;
}

.loginError{
  min-height:20px;
  margin-top:12px;
  text-align:center;
  color:#ff6868;
  font-size:14px;
}

/* APP */

#app{
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(9,9,13,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

.headerInner{
  max-width:1400px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-weight:900;
  font-size:20px;
  color:var(--gold);
}

.logo span{
  color:white;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.userName{
  color:var(--muted);
  font-size:14px;
}

.logoutBtn{
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:9px 12px;
}

main{
  max-width:1400px;
  margin:auto;
  padding:20px 18px 100px;
}

.topTitle{
  margin-bottom:18px;
}

.topTitle h1{
  margin:0;
  font-size:28px;
}

.topTitle p{
  margin:5px 0 0;
  color:var(--muted);
}

/* SEARCH */

.searchRow{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.searchWrap{
  position:relative;
  flex:1;
}

.searchWrap input{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--panel);
  color:var(--text);
  outline:none;
}

.searchWrap input:focus{
  border-color:var(--violet);
}

.addBtn{
  border:0;
  border-radius:13px;
  padding:0 18px;
  background:linear-gradient(135deg,var(--violet),var(--violet2));
  color:white;
  font-weight:800;
}

/* PROVIDERS */

.provider{
  margin-bottom:22px;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  background:var(--panel);
}

.providerHeader{
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(90deg,rgba(139,92,246,.10),rgba(231,185,63,.04));
  border-bottom:1px solid var(--border);
}

.providerTitle{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.providerName{
  font-size:18px;
  font-weight:900;
  color:var(--gold);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.providerActions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.smallBtn{
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:9px;
  padding:7px 10px;
  font-size:12px;
}

.smallBtn:hover{
  border-color:var(--gold);
}

.danger{
  color:#ff7272;
}

/* PRODUCTS */

.products{
  padding:12px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:12px;
}

.productCard{
  position:relative;
  padding:15px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--panel2);
  transition:.15s;
}

.productCard.dragging{
  opacity:.45;
}

.productCard:hover{
  border-color:#3c3c4c;
}

.dragHandle{
  position:absolute;
  top:10px;
  right:10px;
  color:#666;
  cursor:grab;
  user-select:none;
}

.productName{
  font-weight:900;
  font-size:17px;
  padding-right:30px;
}

.capacity{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border-radius:7px;
  background:#25252e;
  color:var(--gold);
  font-size:12px;
  font-weight:700;
}

.priceGrid{
  margin-top:13px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.priceBox{
  padding:9px;
  border-radius:10px;
  background:#101016;
  border:1px solid #22222b;
}

.priceLabel{
  font-size:11px;
  color:var(--muted);
}

.priceValue{
  margin-top:3px;
  font-size:16px;
  font-weight:900;
}

.stockRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:13px;
  padding-top:12px;
  border-top:1px solid #25252d;
}

.stockLabel{
  color:var(--muted);
  font-size:13px;
}

.stockControls{
  display:flex;
  align-items:center;
  gap:8px;
}

.stockBtn{
  width:30px;
  height:30px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#101016;
  color:white;
  font-size:18px;
}

.stockValue{
  min-width:25px;
  text-align:center;
  font-weight:900;
}

.cardActions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.cardActions button{
  flex:1;
  border:1px solid var(--border);
  background:#101016;
  color:var(--text);
  border-radius:9px;
  padding:8px;
  font-size:12px;
}

/* CALCULATOR */

.calcFloat{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:50;
  width:58px;
  height:58px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  background:linear-gradient(135deg,var(--gold),#a9740d);
  color:#111;
  font-size:24px;
  font-weight:900;
  box-shadow:0 10px 35px rgba(0,0,0,.45);
}

.calcPanel{
  position:fixed;
  right:18px;
  bottom:88px;
  z-index:49;
  width:320px;
  max-width:calc(100vw - 36px);
  padding:15px;
  border:1px solid var(--border);
  border-radius:17px;
  background:#111118;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.calcPanel h3{
  margin:0 0 12px;
}

.calcPanel input{
  width:100%;
  padding:12px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#0c0c11;
  color:white;
  outline:none;
}

.calcResult{
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#0c0c11;
  color:var(--gold);
  font-size:20px;
  font-weight:900;
  text-align:center;
}

/* MODAL */

.modalBg{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.72);
}

.modal{
  width:100%;
  max-width:480px;
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel);
}

.modal h2{
  margin:0 0 17px;
}

.modal label{
  display:block;
  margin:12px 0 6px;
  color:var(--muted);
  font-size:13px;
}

.modal input,
.modal select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#0c0c11;
  color:white;
  outline:none;
}

.modalActions{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.modalActions button{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:white;
}

.modalActions .primary{
  border:0;
  background:linear-gradient(135deg,var(--violet),var(--violet2));
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  z-index:200;
  opacity:0;
  pointer-events:none;
  padding:12px 17px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#181820;
  color:white;
  transition:.2s;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:650px){
  .headerInner{
    padding:12px 13px;
  }

  .userName{
    display:none;
  }

  main{
    padding:15px 12px 100px;
  }

  .searchRow{
    flex-direction:column;
  }

  .addBtn{
    min-height:45px;
  }

  .products{
    grid-template-columns:1fr;
    padding:10px;
  }

  .providerHeader{
    align-items:flex-start;
    flex-direction:column;
  }

  .providerActions{
    width:100%;
  }

  .providerActions button{
    flex:1;
  }

  .calcPanel{
    right:12px;
    bottom:85px;
    max-width:calc(100vw - 24px);
  }

  .calcFloat{
    right:12px;
    bottom:12px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">
  <div class="loginBox">
    <div class="loginLogo">STOCK iPHONE</div>
    <div class="loginSub">Panel de administración</div>

    <form id="loginForm">
      <input
        id="loginUser"
        type="text"
        placeholder="Usuario"
        autocomplete="username"
        required
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
        required
      >

      <button class="loginBtn" type="submit">
        INGRESAR
      </button>

      <div id="loginError" class="loginError"></div>
    </form>
  </div>
</section>

<!-- APP -->

<section id="app" class="hidden">

<header>
  <div class="headerInner">

    <div class="logo">
      Agustín <span>/ Stock iPhone</span>
    </div>

    <div class="headerRight">
      <span class="userName">Administrador</span>
      <button id="logoutBtn" class="logoutBtn">
        Salir
      </button>
    </div>

  </div>
</header>

<main>

  <div class="topTitle">
    <h1>Stock</h1>
    <p>Administrá productos, proveedores, costos y precios.</p>
  </div>

  <div class="searchRow">

    <div class="searchWrap">
      <input
        id="searchInput"
        type="search"
        placeholder="Buscar iPhone..."
      >
    </div>

    <button id="addProductBtn" class="addBtn">
      ＋ Agregar producto
    </button>

  </div>

  <div id="providersContainer"></div>

</main>

</section>

<!-- CALCULADORA -->

<button id="calcFloat" class="calcFloat">⌗</button>

<div id="calcPanel" class="calcPanel hidden">

  <h3>Calculadora</h3>

  <input
    id="calcPrecio"
    type="number"
    placeholder="Precio proveedor"
  >

  <input
    id="calcMargen"
    type="number"
    placeholder="Margen / ganancia"
  >

  <div id="calcResult" class="calcResult">
    $0
  </div>

</div>

<!-- MODAL -->

<div id="modalBg" class="modalBg hidden">

  <div class="modal">

    <h2 id="modalTitle">Agregar producto</h2>

    <form id="productForm">

      <input id="productId" type="hidden">

      <label>Proveedor</label>
      <select id="productProveedor" required></select>

      <label>Producto</label>
      <input
        id="productNombre"
        type="text"
        placeholder="Ej: iPhone 15 Pro"
        required
      >

      <label>Capacidad</label>
      <select id="productCapacidad">
        <option value="Ninguno">Ninguno</option>
        <option value="128 GB">128 GB</option>
        <option value="256 GB">256 GB</option>
        <option value="512 GB">512 GB</option>
        <option value="1 TB">1 TB</option>
      </select>

      <label>Precio proveedor / Costo</label>
      <input
        id="productCosto"
        type="number"
        min="0"
        step="0.01"
        placeholder="0"
      >

      <label>Precio de venta</label>
      <input
        id="productVenta"
        type="number"
        min="0"
        step="0.01"
        placeholder="0"
      >

      <label>Stock inicial</label>
      <input
        id="productCantidad"
        type="number"
        min="0"
        step="1"
        value="0"
      >

      <div class="modalActions">

        <button type="button" id="modalCancel">
          Cancelar
        </button>

        <button type="submit" class="primary">
          Guardar
        </button>

      </div>

    </form>

  </div>

</div>

<div id="toast"></div>

<script>
const API_URL="https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";

let proveedores=[];
let productos=[];
let calc={};

const $=id=>document.getElementById(id);

function money(n){
  return "$"+Number(n||0).toLocaleString("es-AR",{
    maximumFractionDigits:0
  });
}

function toast(msg){
  const el=$("toast");
  el.textContent=msg;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

async function api(body){

  const r=await fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(body)
  });

  let d={};

  try{
    d=await r.json();
  }catch(e){
    throw Error("Respuesta inválida del servidor");
  }

  if(!r.ok || d.ok===false){
    throw Error(d.error || "Error");
  }

  return d;
}

async function load(){

  const r=await fetch(API_URL);

  const d=await r.json();

  if(!r.ok || !d.ok){
    throw Error(d.error || "Error cargando datos");
  }

  proveedores=d.proveedores || [];
  productos=d.productos || [];

  render();
}

function loginShow(){
  $("loginScreen").classList.remove("hidden");
  $("app").classList.add("hidden");
}

function appShow(){
  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
}

function logout(){

  loginShow();

  $("loginPassword").value="";
  $("loginError").textContent="";
}

$("loginForm").onsubmit=async e=>{

  e.preventDefault();

  const loginError=$("loginError");

  loginError.textContent="";

  try{

    const r=await fetch(API_URL+"/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        usuario:$("loginUser").value.trim(),
        password:$("loginPassword").value
      })
    });

    const d=await r.json();

    if(!r.ok || !d.ok){
      throw Error(
        d.error ||
        "Usuario o contraseña incorrectos"
      );
    }

    appShow();

    await load();

  }catch(err){

    loginError.textContent=err.message;

  }

};

$("logoutBtn").onclick=logout;

function render(){

  const container=$("providersContainer");

  const search=($("searchInput").value||"")
    .trim()
    .toLowerCase();

  container.innerHTML="";

  if(!proveedores.length){

    container.innerHTML=`
      <div class="provider">
        <div class="empty">
          No hay proveedores cargados.
        </div>
      </div>
    `;

    return;
  }

  proveedores.forEach(proveedor=>{

    let list=productos.filter(
      p=>Number(p.proveedor_id)===Number(proveedor.id)
    );

    if(search){

      list=list.filter(p=>
        String(p.producto||"")
          .toLowerCase()
          .includes(search)
        ||
        String(p.capacidad||"")
          .toLowerCase()
          .includes(search)
      );

    }

    const section=document.createElement("section");

    section.className="provider";

    section.dataset.providerId=proveedor.id;

    section.innerHTML=`

      <div class="providerHeader">

        <div class="providerTitle">

          <div class="providerName">
            ${escapeHtml(proveedor.nombre)}
          </div>

        </div>

        <div class="providerActions">

          <button
            class="smallBtn"
            data-action="rename-provider"
            data-id="${proveedor.id}">
            Renombrar
          </button>

          <button
            class="smallBtn"
            data-action="adjust-provider"
            data-id="${proveedor.id}">
            Ajustar precios
          </button>

          <button
            class="smallBtn danger"
            data-action="delete-provider"
            data-id="${proveedor.id}">
            Eliminar
          </button>

        </div>

      </div>

      <div class="products"></div>

    `;

    const productsBox=section.querySelector(".products");

    if(!list.length){

      productsBox.innerHTML=`
        <div class="empty">
          No hay productos en este proveedor.
        </div>
      `;

    }else{

      list.forEach(producto=>{
        productsBox.appendChild(
          createProductCard(producto)
        );
      });

    }

    container.appendChild(section);

  });

  setupDrag();
}

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function createProductCard(p){

  const card=document.createElement("div");

  card.className="productCard";

  card.draggable=true;

  card.dataset.id=p.id;

  card.dataset.providerId=p.proveedor_id;

  card.innerHTML=`

    <div class="dragHandle">
      ⋮⋮
    </div>

    <div class="productName">
      ${escapeHtml(p.producto)}
    </div>

    <div class="capacity">
      ${escapeHtml(p.capacidad || "Ninguno")}
    </div>

    <div class="priceGrid">

      <div class="priceBox">
        <div class="priceLabel">
          Costo
        </div>
        <div class="priceValue">
          ${money(p.costo)}
        </div>
      </div>

      <div class="priceBox">
        <div class="priceLabel">
          Venta
        </div>
        <div class="priceValue">
          ${money(p.venta)}
        </div>
      </div>

    </div>

    <div class="stockRow">

      <div class="stockLabel">
        Stock
      </div>

      <div class="stockControls">

        <button
          class="stockBtn"
          data-action="stock-minus"
          data-id="${p.id}">
          −
        </button>

        <div class="stockValue">
          ${Number(p.cantidad||0)}
        </div>

        <button
          class="stockBtn"
          data-action="stock-plus"
          data-id="${p.id}">
          +
        </button>

      </div>

    </div>

    <div class="cardActions">

      <button
        data-action="edit-product"
        data-id="${p.id}">
        Editar
      </button>

      <button
        data-action="delete-product"
        data-id="${p.id}">
        Eliminar
      </button>

    </div>

  `;

  return card;
}

document.addEventListener("click",async e=>{

  const btn=e.target.closest("[data-action]");

  if(!btn)return;

  const action=btn.dataset.action;
  const id=Number(btn.dataset.id);

  try{

    if(action==="stock-plus"){

      const p=productos.find(x=>Number(x.id)===id);

      if(!p)return;

      await api({
        accion:"editar_producto",
        id:p.id,
        proveedor_id:p.proveedor_id,
        producto:p.producto,
        capacidad:p.capacidad,
        venta:p.venta,
        costo:p.costo,
        cantidad:Number(p.cantidad||0)+1
      });

      await load();

      return;
    }

    if(action==="stock-minus"){

      const p=productos.find(x=>Number(x.id)===id);

      if(!p)return;

      const cantidad=Math.max(
        0,
        Number(p.cantidad||0)-1
      );

      await api({
        accion:"editar_producto",
        id:p.id,
        proveedor_id:p.proveedor_id,
        producto:p.producto,
        capacidad:p.capacidad,
        venta:p.venta,
        costo:p.costo,
        cantidad
      });

      await load();

      return;
    }

    if(action==="edit-product"){

      const p=productos.find(
        x=>Number(x.id)===id
      );

      if(!p)return;

      openProductModal(p);

      return;
    }

    if(action==="delete-product"){

      if(!confirm(
        "¿Eliminar este producto?"
      ))return;

      await api({
        accion:"eliminar_producto",
        id
      });

      toast("Producto eliminado");

      await load();

      return;
    }

    if(action==="rename-provider"){

      const p=proveedores.find(
        x=>Number(x.id)===id
      );

      if(!p)return;

      const nombre=prompt(
        "Nuevo nombre del proveedor:",
        p.nombre
      );

      if(!nombre || !nombre.trim())return;

      await api({
        accion:"renombrar_proveedor",
        id,
        nombre:nombre.trim()
      });

      toast("Proveedor renombrado");

      await load();

      return;
    }

    if(action==="adjust-provider"){

      const monto=prompt(
        "Monto a sumar/restar:",
        "0"
      );

      if(monto===null)return;

      const numero=Number(monto);

      if(!Number.isFinite(numero)){
        toast("Monto inválido");
        return;
      }

      const tipo=prompt(
        "Escribí:\n\n1 = Costo\n2 = Venta\n3 = Ambos"
      );

      if(!tipo)return;

      await api({
        accion:"ajustar_precios",
        proveedor_id:id,
        monto:numero,
        costo:tipo==="1" || tipo==="3",
        venta:tipo==="2" || tipo==="3"
      });

      toast("Precios actualizados");

      await load();

      return;
    }

    if(action==="delete-provider"){

      const p=proveedores.find(
        x=>Number(x.id)===id
      );

      if(!p)return;

      if(!confirm(
        `¿Eliminar "${p.nombre}" y todos sus productos?`
      ))return;

      await api({
        accion:"eliminar_proveedor",
        id
      });

      toast("Proveedor eliminado");

      await load();

      return;
    }

  }catch(err){

    toast(err.message);

  }

});

$("addProductBtn").onclick=()=>{

  if(!proveedores.length){

    toast("Primero agregá un proveedor");

    return;
  }

  openProductModal();

};

function openProductModal(product=null){

  $("modalBg").classList.remove("hidden");

  $("modalTitle").textContent=
    product
      ? "Editar producto"
      : "Agregar producto";

  $("productId").value=
    product?.id || "";

  $("productNombre").value=
    product?.producto || "";

  $("productCapacidad").value=
    product?.capacidad || "Ninguno";

  $("productCosto").value=
    product?.costo ?? "";

  $("productVenta").value=
    product?.venta ?? "";

  $("productCantidad").value=
    product?.cantidad ?? 0;

  const select=$("productProveedor");

  select.innerHTML="";

  proveedores.forEach(p=>{

    const option=document.createElement("option");

    option.value=p.id;

    option.textContent=p.nombre;

    select.appendChild(option);

  });

  if(product){

    select.value=product.proveedor_id;

  }else if(proveedores.length){

    select.value=proveedores[0].id;

  }

}

function closeModal(){

  $("modalBg").classList.add("hidden");

}

$("modalCancel").onclick=closeModal;

$("modalBg").addEventListener("click",e=>{

  if(e.target===$("modalBg")){
    closeModal();
  }

});

$("productForm").onsubmit=async e=>{

  e.preventDefault();

  try{

    const id=$("productId").value;

    const body={

      accion:id
        ? "editar_producto"
        : "agregar_producto",

      proveedor_id:Number(
        $("productProveedor").value
      ),

      producto:$("productNombre").value.trim(),

      capacidad:$("productCapacidad").value,

      costo:Number(
        $("productCosto").value
      )||0,

      venta:Number(
        $("productVenta").value
      )||0,

      cantidad:Math.max(
        0,
        Number($("productCantidad").value)||0
      )

    };

    if(id){
      body.id=Number(id);
    }

    await api(body);

    closeModal();

    toast(
      id
        ? "Producto actualizado"
        : "Producto agregado"
    );

    await load();

  }catch(err){

    toast(err.message);

  }

};

$("searchInput").addEventListener(
  "input",
  render
);

/* DRAG & DROP */

function setupDrag(){

  document
    .querySelectorAll(".productCard")
    .forEach(card=>{

      card.addEventListener(
        "dragstart",
        ()=>{
          card.classList.add("dragging");
        }
      );

      card.addEventListener(
        "dragend",
        async ()=>{
          card.classList.remove("dragging");
          await saveDomOrder(card.dataset.providerId);
        }
      );

      card.addEventListener(
        "dragover",
        e=>{

          e.preventDefault();

          const dragging=
            document.querySelector(
              ".productCard.dragging"
            );

          if(!dragging || dragging===card)return;

          const box=card.getBoundingClientRect();

          const before=
            e.clientY <
            box.top+box.height/2;

          const parent=card.parentNode;

          if(before){
            parent.insertBefore(
              dragging,
              card
            );
          }else{
            parent.insertBefore(
              dragging,
              card.nextSibling
            );
          }

        }
      );

    });

}

async function saveDomOrder(providerId){

  const section=
    document.querySelector(
      `.provider[data-provider-id="${providerId}"]`
    );

  if(!section)return;

  const ids=[
    ...section.querySelectorAll(".productCard")
  ].map(el=>Number(el.dataset.id));

  if(!ids.length)return;

  try{

    await api({
      accion:"reordenar_productos",
      proveedor_id:Number(providerId),
      ids
    });

  }catch(err){

    toast(err.message);

  }

}

/* CALCULADORA */

$("calcFloat").onclick=()=>{

  $("calcPanel").classList.toggle("hidden");

};

function updateCalc(){

  const precio=
    Number($("calcPrecio").value)||0;

  const margen=
    Number($("calcMargen").value)||0;

  const resultado=
    precio+(precio*margen/100);

  $("calcResult").textContent=
    money(resultado);

}

$("calcPrecio").addEventListener(
  "input",
  updateCalc
);

$("calcMargen").addEventListener(
  "input",
  updateCalc
);

loginShow();

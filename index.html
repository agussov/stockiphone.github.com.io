<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Stock iPhone</title>
<style>
:root{
  --bg:#09090d;
  --panel:#111118;
  --panel2:#171720;
  --border:#292934;
  --text:#f5f5f7;
  --muted:#9999a8;
  --accent:#007aff;
  --danger:#ff453a;
  --green:#30d158;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select{
  font:inherit;
}
button{
  cursor:pointer;
}
.hidden{
  display:none!important;
}
/* LOGIN */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.loginBox{
  width:100%;
  max-width:380px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:22px;
  padding:30px;
  box-shadow:0 20px 60px #0008;
}
.loginTitle{
  font-size:28px;
  font-weight:800;
  margin-bottom:6px;
}
.loginSub{
  color:var(--muted);
  margin-bottom:25px;
}
.field{
  margin-bottom:15px;
}
.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}
input,select{
  width:100%;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 13px;
  outline:none;
}
input:focus,select:focus{
  border-color:var(--accent);
}
.primary{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:var(--accent);
  color:white;
  font-weight:700;
}
.error{
  color:var(--danger);
  font-size:13px;
  margin-top:12px;
}
/* APP */
.app{
  min-height:100vh;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 20px;
  background:#09090df2;
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.brandUser{
  font-size:12px;
  color:var(--muted);
}
.brandName{
  font-size:22px;
  font-weight:800;
}
.brandName span{
  color:var(--accent);
}
.logout{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:9px 14px;
  border-radius:10px;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.toolbar button{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:10px 14px;
  border-radius:10px;
}
.section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:18px;
  overflow:hidden;
}
.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:15px 18px;
  border-bottom:1px solid var(--border);
}
.sectionTitle{
  font-weight:800;
  font-size:18px;
}
.sectionBody{
  padding:15px;
}
.provider{
  margin-bottom:15px;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
}
.providerHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 15px;
  background:var(--panel2);
}
.providerName{
  font-weight:800;
}
.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.actions button{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:7px 10px;
  border-radius:8px;
  font-size:12px;
}
.products{
  padding:10px;
}
.product{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  padding:12px;
  border-bottom:1px solid var(--border);
}
.product:last-child{
  border-bottom:0;
}
.productName{
  font-weight:700;
}
.productInfo{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}
.productPrices{
  text-align:right;
}
.sale{
  font-weight:800;
  color:var(--green);
}
.cost{
  color:var(--muted);
  font-size:12px;
}
.stock{
  color:var(--muted);
  font-size:12px;
}
.empty{
  color:var(--muted);
  text-align:center;
  padding:25px;
}
.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000b;
}
.modalBox{
  width:100%;
  max-width:430px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
}
.modalTitle{
  font-size:20px;
  font-weight:800;
  margin-bottom:18px;
}
.modalActions{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.modalActions button{
  flex:1;
  padding:11px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
}
.modalActions .confirm{
  background:var(--accent);
  border-color:var(--accent);
}
@media(max-width:600px){
  .product{
    grid-template-columns:1fr;
  }
  .productPrices{
    text-align:left;
  }
}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="loginScreen">
  <form class="loginBox" id="loginForm">
    <div class="loginTitle">
      Stock <span style="color:#007aff">iPhone</span>
    </div>
    <div class="loginSub">
      Ingresá para administrar el stock
    </div>
    <div class="field">
      <label>Usuario</label>
      <input
        id="loginUser"
        autocomplete="username"
        required
      >
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        required
      >
    </div>
    <button
      class="primary"
      id="loginButton"
      type="submit"
    >
      Ingresar
    </button>
    <div
      id="loginError"
      class="error"
    ></div>
  </form>
</div>
<!-- APP -->
<main
  class="app hidden"
  id="app"
>
<header class="topbar">
  <div>
    <div class="brandUser">Agustín</div>
    <div class="brandName">
      <span>Stock</span> iPhone
    </div>
  </div>
  <button
    class="logout"
    id="logoutBtn"
    type="button"
  >
    Salir
  </button>
</header>
<div class="container">
  <div class="toolbar">
    <button id="addProviderBtn">
      + Proveedor
    </button>
    <button id="refreshBtn">
      Actualizar
    </button>
  </div>
  <section class="section">
    <div class="sectionHead">
      <div class="sectionTitle">
        Stock
      </div>
    </div>
    <div
      class="sectionBody"
      id="stock"
    >
      <div class="empty">
        Cargando...
      </div>
    </div>
  </section>
</div>
</main>
<!-- MODAL -->
<div
  class="modal hidden"
  id="modal"
>
  <div class="modalBox">
    <div
      class="modalTitle"
      id="modalTitle"
    ></div>
    <div id="modalContent"></div>
    <div class="modalActions">
      <button id="modalCancel">
        Cancelar
      </button>
      <button
        class="confirm"
        id="modalConfirm"
      >
        Guardar
      </button>
    </div>
  </div>
</div>
<script>
const API_URL =
  "https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";
const TOKEN_KEY =
  "stock_iphone_session";
let token = "";
const $ = id =>
  document.getElementById(id);
/* =========================
   SESIÓN
   SIN EXPIRACIÓN
========================= */
function saveToken(newToken){
  token = String(newToken || "").trim();
  if(token){
    localStorage.setItem(
      TOKEN_KEY,
      token
    );
  }
}
function getStoredToken(){
  return (
    localStorage.getItem(TOKEN_KEY) || ""
  ).trim();
}
function clearSession(){
  token = "";
  localStorage.removeItem(
    TOKEN_KEY
  );
  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
}
function authHeaders(){
  return {
    "Content-Type":"application/json",
    "Accept":"application/json",
    "Authorization":
      "Bearer " + token
  };
}
/* =========================
   LOGIN
========================= */
async function login(usuario,password){
  const response =
    await fetch(
      API_URL + "/login",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json",
          "Accept":
            "application/json"
        },
        body:JSON.stringify({
          usuario,
          password
        }),
        cache:"no-store"
      }
    );
  let data;
  try{
    data = await response.json();
  }catch{
    throw new Error(
      "El servidor devolvió una respuesta inválida."
    );
  }
  if(
    !response.ok ||
    !data.ok ||
    !data.token
  ){
    throw new Error(
      data.error ||
      "No se pudo iniciar sesión."
    );
  }
  saveToken(data.token);
  return true;
}
/* =========================
   API
========================= */
async function api(body){
  const response =
    await fetch(
      API_URL,
      {
        method:"POST",
        headers:authHeaders(),
        body:JSON.stringify(body),
        cache:"no-store"
      }
    );
  let data;
  try{
    data = await response.json();
  }catch{
    throw new Error(
      "Respuesta inválida del servidor."
    );
  }
  if(response.status === 401){
    clearSession();
    throw new Error(
      "Sesión inválida. Volvé a iniciar sesión."
    );
  }
  if(!response.ok || !data.ok){
    throw new Error(
      data.error ||
      "Error del servidor."
    );
  }
  return data;
}
/* =========================
   CARGAR
========================= */
async function load(){
  try{
    const response =
      await fetch(
        API_URL,
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json",
            "Authorization":
              "Bearer " + token
          },
          cache:"no-store"
        }
      );
    let data;
    try{
      data = await response.json();
    }catch{
      throw new Error(
        "Respuesta inválida del servidor."
      );
    }
    if(response.status === 401){
      clearSession();
      throw new Error(
        "Sesión inválida."
      );
    }
    if(!response.ok || !data.ok){
      throw new Error(
        data.error ||
        "No se pudieron cargar los datos."
      );
    }
    render(
      data.proveedores || [],
      data.productos || []
    );
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    return true;
  }catch(error){
    console.error(error);
    $("stock").innerHTML =
      `<div class="empty">
        ${escapeHtml(error.message)}
      </div>`;
    return false;
  }
}
/* =========================
   ESCAPE
========================= */
function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
/* =========================
   RENDER
========================= */
function render(proveedores,productos){
  const stock =
    $("stock");
  if(!proveedores.length){
    stock.innerHTML =
      `<div class="empty">
        No hay proveedores cargados.
      </div>`;
    return;
  }
  stock.innerHTML = "";
  for(const proveedor of proveedores){
    const productosProveedor =
      productos.filter(
        p =>
          Number(p.proveedor_id) ===
          Number(proveedor.id)
      );
    const box =
      document.createElement("div");
    box.className =
      "provider";
    box.innerHTML = `
      <div class="providerHead">
        <div class="providerName">
          ${escapeHtml(proveedor.nombre)}
        </div>
        <div class="actions">
          <button
            data-action="add"
            data-id="${proveedor.id}"
          >
            + Producto
          </button>
          <button
            data-action="rename"
            data-id="${proveedor.id}"
          >
            Renombrar
          </button>
          <button
            data-action="price"
            data-id="${proveedor.id}"
          >
            Ajustar precios
          </button>
          <button
            data-action="delete-provider"
            data-id="${proveedor.id}"
          >
            Eliminar
          </button>
        </div>
      </div>
      <div class="products">
        ${
          productosProveedor.length
          ? productosProveedor.map(p => `
            <div class="product">
              <div>
                <div class="productName">
                  ${escapeHtml(p.producto)}
                </div>
                <div class="productInfo">
                  ${escapeHtml(p.capacidad)}
                  · Stock: ${Number(p.cantidad || 0)}
                </div>
              </div>
              <div class="productPrices">
                <div class="sale">
                  Venta: $${Number(p.venta || 0).toLocaleString("es-AR")}
                </div>
                <div class="cost">
                  Costo: $${Number(p.costo || 0).toLocaleString("es-AR")}
                </div>
                <div class="actions">
                  <button
                    data-action="edit"
                    data-id="${p.id}"
                  >
                    Editar
                  </button>
                  <button
                    data-action="delete-product"
                    data-id="${p.id}"
                  >
                    Eliminar
                  </button>
                </div>
              </div>
            </div>
          `).join("")
          :
          `<div class="empty">
            No hay productos.
          </div>`
        }
      </div>
    `;
    stock.appendChild(box);
  }
  stock
    .querySelectorAll("button[data-action]")
    .forEach(button => {
      button.onclick =
        () => handleAction(
          button.dataset.action,
          Number(button.dataset.id)
        );
    });
}
/* =========================
   MODAL
========================= */
function openModal(title,content,onConfirm){
  $("modalTitle").textContent =
    title;
  $("modalContent").innerHTML =
    content;
  $("modal").classList.remove(
    "hidden"
  );
  $("modalConfirm").onclick =
    async () => {
      try{
        await onConfirm();
        closeModal();
        await load();
      }catch(error){
        alert(error.message);
      }
    };
}
function closeModal(){
  $("modal").classList.add(
    "hidden"
  );
  $("modalConfirm").onclick =
    null;
}
$("modalCancel").onclick =
  closeModal;
/* =========================
   ACCIONES
========================= */
async function handleAction(action,id){
  if(action === "add"){
    openModal(
      "Agregar producto",
      `
        <div class="field">
          <label>Producto</label>
          <input id="mProducto">
        </div>
        <div class="field">
          <label>Capacidad</label>
          <select id="mCapacidad">
            <option>Ninguno</option>
            <option>128 GB</option>
            <option>256 GB</option>
            <option>512 GB</option>
            <option>1 TB</option>
          </select>
        </div>
        <div class="field">
          <label>Precio venta</label>
          <input id="mVenta" type="number">
        </div>
        <div class="field">
          <label>Precio costo</label>
          <input id="mCosto" type="number">
        </div>
        <div class="field">
          <label>Cantidad</label>
          <input id="mCantidad" type="number" value="0">
        </div>
      `,
      () =>
        api({
          accion:"agregar_producto",
          proveedor_id:id,
          producto:$("mProducto").value,
          capacidad:$("mCapacidad").value,
          venta:Number($("mVenta").value) || 0,
          costo:Number($("mCosto").value) || 0,
          cantidad:Number($("mCantidad").value) || 0
        })
    );
    return;
  }
  if(action === "rename"){
    openModal(
      "Renombrar proveedor",
      `
        <div class="field">
          <label>Nuevo nombre</label>
          <input id="mNombre">
        </div>
      `,
      () =>
        api({
          accion:"renombrar_proveedor",
          id,
          nombre:$("mNombre").value
        })
    );
    return;
  }
  if(action === "price"){
    openModal(
      "Ajustar precios",
      `
        <div class="field">
          <label>Monto a sumar/restar</label>
          <input id="mMonto" type="number" value="0">
        </div>
      `,
      () =>
        api({
          accion:"ajustar_precios",
          proveedor_id:id,
          monto:Number($("mMonto").value) || 0
        })
    );
    return;
  }
  if(action === "delete-provider"){
    if(
      !confirm(
        "¿Eliminar este proveedor y todos sus productos?"
      )
    ) return;
    await api({
      accion:"eliminar_proveedor",
      id
    });
    await load();
    return;
  }
  if(action === "delete-product"){
    if(
      !confirm(
        "¿Eliminar este producto?"
      )
    ) return;
    await api({
      accion:"eliminar_producto",
      id
    });
    await load();
    return;
  }
  if(action === "edit"){
    openModal(
      "Editar producto",
      `
        <div class="field">
          <label>Producto</label>
          <input id="mProducto">
        </div>
        <div class="field">
          <label>Capacidad</label>
          <select id="mCapacidad">
            <option>Ninguno</option>
            <option>128 GB</option>
            <option>256 GB</option>
            <option>512 GB</option>
            <option>1 TB</option>
          </select>
        </div>
        <div class="field">
          <label>Precio venta</label>
          <input id="mVenta" type="number">
        </div>
        <div class="field">
          <label>Precio costo</label>
          <input id="mCosto" type="number">
        </div>
        <div class="field">
          <label>Cantidad</label>
          <input id="mCantidad" type="number">
        </div>
      `,
      () =>
        api({
          accion:"editar_producto",
          id,
          producto:$("mProducto").value,
          capacidad:$("mCapacidad").value,
          venta:Number($("mVenta").value) || 0,
          costo:Number($("mCosto").value) || 0,
          cantidad:Number($("mCantidad").value) || 0
        })
    );
  }
}
/* =========================
   NUEVO PROVEEDOR
========================= */
$("addProviderBtn").onclick =
  () => {
    openModal(
      "Nuevo proveedor",
      `
        <div class="field">
          <label>Nombre</label>
          <input id="mNombre">
        </div>
      `,
      () =>
        api({
          accion:"crear_proveedor",
          nombre:$("mNombre").value
        })
    );
  };
/* =========================
   ACTUALIZAR
========================= */
$("refreshBtn").onclick =
  async () => {
    if(!token) return;
    await load();
  };
/* =========================
   LOGOUT
========================= */
$("logoutBtn").onclick =
  async () => {
    try{
      if(token){
        await fetch(
          API_URL,
          {
            method:"POST",
            headers:authHeaders(),
            body:JSON.stringify({
              accion:"logout"
            }),
            cache:"no-store"
          }
        );
      }
    }catch(error){
      console.error(error);
    }
    clearSession();
  };
/* =========================
   LOGIN FORM
========================= */
$("loginForm").onsubmit =
  async event => {
    event.preventDefault();
    const button =
      $("loginButton");
    const error =
      $("loginError");
    button.disabled = true;
    button.textContent =
      "Ingresando...";
    error.textContent = "";
    try{
      await login(
        $("loginUser").value.trim(),
        $("loginPassword").value
      );
      const ok =
        await load();
      if(!ok){
        clearSession();
        throw new Error(
          "El servidor aceptó el login pero rechazó la sesión."
        );
      }
    }catch(error){
      clearSession();
      $("loginError").textContent =
        error.message;
    }finally{
      button.disabled = false;
      button.textContent =
        "Ingresar";
    }
  };
/* =========================
   INICIO
========================= */
(async function init(){
  token =
    getStoredToken();
  if(!token){
    $("loginScreen")
      .classList.remove("hidden");
    $("app")
      .classList.add("hidden");
    return;
  }
  const ok =
    await load();
  if(!ok){
    clearSession();
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock iPhone</title>

<style>
:root{
  --black:#08080b;
  --black2:#101014;
  --purple:#7c3aed;
  --purple2:#a855f7;
  --gold:#f5c542;
  --gold2:#ffd95a;
  --white:#ffffff;
  --gray:#a8a8b3;
  --gray2:#1b1b22;
  --red:#ef4444;
  --green:#22c55e;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top right, rgba(124,58,237,.18), transparent 30%),
    linear-gradient(180deg,#070709,#0c0c10);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:390px;
  background:rgba(16,16,20,.96);
  border:1px solid rgba(168,85,247,.35);
  border-radius:22px;
  padding:30px;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.loginTitle{
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
}

.loginSubtitle{
  color:var(--gray);
  margin-bottom:25px;
}

.loginBox label{
  display:block;
  font-size:13px;
  color:var(--gray);
  margin:14px 0 7px;
}

.loginBox input{
  width:100%;
  border:1px solid #292933;
  background:#0a0a0d;
  color:white;
  border-radius:12px;
  padding:14px;
  outline:none;
}

.loginBox input:focus{
  border-color:var(--purple2);
}

.loginButton{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:var(--purple);
  color:white;
  font-weight:800;
}

.loginError{
  color:#ff6b6b;
  font-size:13px;
  margin-top:12px;
}

/* =========================
   APP
========================= */

#app{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(8,8,11,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #202028;
}

.topbarInner{
  max-width:1100px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  font-size:21px;
  font-weight:900;
}

.brand span{
  color:var(--gold);
}

.topActions{
  display:flex;
  align-items:center;
  gap:8px;
}

.iconButton{
  position:relative;
  width:43px;
  height:43px;
  border:1px solid #2a2a34;
  border-radius:12px;
  background:#121218;
  color:white;
  font-size:19px;
}

.logoutButton{
  border:1px solid #30202a;
  background:#171116;
  color:#ff8b8b;
  border-radius:10px;
  padding:10px 12px;
}

.badge{
  position:absolute;
  right:-5px;
  top:-5px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--red);
  color:white;
  border-radius:99px;
  font-size:10px;
  font-weight:900;
}

/* =========================
   CONTENT
========================= */

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 18px 60px;
}

.sectionTitle{
  font-size:22px;
  font-weight:900;
  margin:10px 0 15px;
}

.card{
  background:rgba(16,16,20,.94);
  border:1px solid #24242d;
  border-radius:17px;
  padding:16px;
  margin-bottom:16px;
}

.formGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.formGroup label{
  display:block;
  color:var(--gray);
  font-size:12px;
  margin-bottom:6px;
}

.formGroup input,
.formGroup select{
  width:100%;
  background:#09090c;
  border:1px solid #292933;
  color:white;
  border-radius:10px;
  padding:12px;
  outline:none;
}

.formGroup input:focus,
.formGroup select:focus{
  border-color:var(--purple2);
}

.full{
  grid-column:1/-1;
}

.primaryButton{
  border:0;
  border-radius:11px;
  padding:12px 15px;
  background:var(--purple);
  color:white;
  font-weight:800;
}

.primaryButton:hover{
  background:var(--purple2);
}

.goldButton{
  background:var(--gold);
  color:#111;
}

/* =========================
   PROVIDERS
========================= */

.provider{
  border:1px solid #272731;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:13px;
  background:#101015;
}

.providerHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:15px;
  background:#13131a;
}

.providerLeft{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.providerArrow{
  color:var(--gold);
  font-size:15px;
  width:20px;
}

.providerName{
  font-size:18px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.providerActions{
  display:flex;
  gap:6px;
}

.smallButton{
  width:36px;
  height:36px;
  border-radius:9px;
  border:1px solid #30303a;
  background:#191920;
  color:white;
}

.products{
  padding:10px;
}

/* =========================
   PRODUCT
========================= */

.product{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  padding:14px;
  margin-bottom:8px;
  border-radius:13px;
  background:#0c0c10;
  border:1px solid #202028;
  touch-action:none;
  user-select:none;
  cursor:grab;
  transition:
    transform .18s ease,
    opacity .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.product:last-child{
  margin-bottom:0;
}

.product.dragging{
  opacity:.45;
  transform:scale(1.025);
  border-color:var(--purple2);
  cursor:grabbing;
}

.product.dragOver{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(245,197,66,.25);
}

.productMain{
  min-width:0;
}

.productName{
  font-size:16px;
  font-weight:800;
  line-height:1.2;
}

.capacity{
  color:var(--gold2);
  font-size:16px;
  font-weight:700;
  margin-top:4px;
}

.cost{
  color:var(--gray);
  font-size:13px;
  margin-top:3px;
}

.productBottom{
  margin-top:11px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.sale{
  color:white;
  font-size:20px;
  font-weight:900;
}

.stock{
  color:var(--gold2);
  font-size:13px;
  font-weight:900;
}

.calcControls{
  display:flex;
  align-items:center;
  gap:6px;
}

.calcControls button{
  width:30px;
  height:30px;
  border:1px solid #33333d;
  border-radius:8px;
  background:#17171d;
  color:white;
  font-size:18px;
}

.calcQty{
  min-width:20px;
  text-align:center;
  font-weight:800;
}

.productMenuButton{
  width:35px;
  height:35px;
  border:1px solid #30303a;
  border-radius:9px;
  background:#15151b;
  color:white;
  font-size:18px;
}

.productMenu{
  position:absolute;
  right:10px;
  top:50px;
  z-index:20;
  min-width:145px;
  background:#191920;
  border:1px solid #353540;
  border-radius:11px;
  padding:5px;
  box-shadow:0 15px 35px rgba(0,0,0,.5);
}

.productMenu button{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  color:white;
  text-align:left;
  padding:11px;
  border-radius:8px;
}

.productMenu button:hover{
  background:#25252d;
}

.productMenu .danger{
  color:#ff7777;
}

/* =========================
   MODALS
========================= */

.modalBackdrop{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.68);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal{
  width:100%;
  max-width:450px;
  background:#111116;
  border:1px solid #32323d;
  border-radius:18px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modalTitle{
  font-size:20px;
  font-weight:900;
  margin-bottom:15px;
}

.modalActions{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.modalActions button{
  flex:1;
}

.secondaryButton{
  border:1px solid #34343e;
  background:#191920;
  color:white;
  border-radius:11px;
  padding:12px;
}

.checkRow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  background:#18181f;
  border-radius:10px;
  margin-bottom:8px;
}

.checkRow input{
  width:18px;
  height:18px;
}

/* =========================
   CALCULATOR
========================= */

.calculator{
  position:fixed;
  right:0;
  top:0;
  height:100%;
  width:390px;
  max-width:100%;
  z-index:200;
  background:#0c0c10;
  border-left:1px solid #2a2a35;
  box-shadow:-20px 0 60px rgba(0,0,0,.5);
  transform:translateX(100%);
  transition:transform .25s ease;
  display:flex;
  flex-direction:column;
}

.calculator.open{
  transform:translateX(0);
}

.calcHeader{
  padding:18px;
  border-bottom:1px solid #292933;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.calcTitle{
  font-size:20px;
  font-weight:900;
}

.calcItems{
  flex:1;
  overflow:auto;
  padding:15px;
}

.calcItem{
  padding:12px;
  border:1px solid #25252e;
  border-radius:11px;
  margin-bottom:8px;
}

.calcItemName{
  font-weight:800;
}

.calcItemInfo{
  color:var(--gray);
  font-size:13px;
  margin-top:4px;
}

.calcFooter{
  border-top:1px solid #292933;
  padding:17px;
}

.calcLine{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
  color:var(--gray);
}

.calcProfit{
  color:var(--green);
  font-weight:900;
}

.calcTotalCost{
  color:white;
}

.calcTotalSale{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:15px 0;
  font-size:21px;
  font-weight:900;
}

.calcTotalSale strong{
  color:var(--gold);
}

.clearCalc{
  width:100%;
  border:1px solid #42252a;
  background:#211216;
  color:#ff7777;
  padding:12px;
  border-radius:11px;
  font-weight:800;
}

/* =========================
   EMPTY
========================= */

.empty{
  color:var(--gray);
  text-align:center;
  padding:25px 10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .topbarInner{
    padding:12px;
  }

  .brand{
    font-size:18px;
  }

  .logoutButton{
    padding:9px;
    font-size:12px;
  }

  .container{
    padding:15px 12px 50px;
  }

  .formGrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .product{
    grid-template-columns:minmax(0,1fr) auto;
  }

  .productBottom{
    gap:8px;
  }

  .sale{
    font-size:18px;
  }

  .calculator{
    width:100%;
  }
}
</style>
</head>

<body>

<section id="loginScreen">

  <div class="loginBox">

    <div class="loginTitle">
      Stock <span style="color:#f5c542;">iPhone</span>
    </div>

    <div class="loginSubtitle">
      Iniciá sesión para administrar el stock.
    </div>

    <form id="loginForm">

      <label for="loginUser">
        Usuario
      </label>

      <input
        id="loginUser"
        type="text"
        autocomplete="username"
        required
      >

      <label for="loginPassword">
        Contraseña
      </label>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        required
      >

      <button
        class="loginButton"
        type="submit"
      >
        Iniciar sesión
      </button>

      <div
        id="loginError"
        class="loginError hidden"
      ></div>

    </form>

  </div>

</section>


<section id="app" class="hidden">

  <header class="topbar">

    <div class="topbarInner">

      <div class="brand">
        Stock <span>iPhone</span>
      </div>

      <div class="topActions">

        <button
          class="iconButton"
          id="calculatorButton"
          type="button"
          aria-label="Calculadora"
        >
          🧮
          <span
            id="calculatorBadge"
            class="badge hidden"
          >
            0
          </span>
        </button>

        <button
          id="logoutButton"
          class="logoutButton"
          type="button"
        >
          Salir
        </button>

      </div>

    </div>

  </header>


  <main class="container">

    <div class="sectionTitle">
      Proveedores
    </div>

    <div class="card">

      <form id="providerForm">

        <div class="formGrid">

          <div class="formGroup full">

            <label>
              Nombre del proveedor
            </label>

            <input
              id="providerName"
              type="text"
              placeholder="Ej: Proveedor USA"
              required
            >

          </div>

        </div>

        <button
          class="primaryButton"
          type="submit"
        >
          + Agregar proveedor
        </button>

      </form>

    </div>


    <div class="sectionTitle">
      Agregar producto
    </div>

    <div class="card">

      <form id="productForm">

        <div class="formGrid">

          <div class="formGroup">

            <label>
              Producto
            </label>

            <input
              id="productName"
              type="text"
              placeholder="Ej: iPhone 15 Pro"
              required
            >

          </div>


          <div class="formGroup">

            <label>
              Proveedor
            </label>

            <select
              id="productProvider"
              required
            ></select>

          </div>


          <div class="formGroup">

            <label>
              Capacidad
            </label>

            <select id="productCapacity">

              <option value="Ninguno">
                Ninguno
              </option>

              <option value="128 GB">
                128 GB
              </option>

              <option value="256 GB">
                256 GB
              </option>

              <option value="512 GB">
                512 GB
              </option>

              <option value="1 TB">
                1 TB
              </option>

            </select>

          </div>


          <div class="formGroup">

            <label>
              Precio de venta
            </label>

            <input
              id="productSale"
              type="number"
              min="0"
              step="0.01"
              placeholder="0"
              required
            >

          </div>


          <div class="formGroup">

            <label>
              Costo
            </label>

            <input
              id="productCost"
              type="number"
              min="0"
              step="0.01"
              placeholder="0"
              required
            >

          </div>


          <div class="formGroup">

            <label>
              Stock
            </label>

            <input
              id="productStock"
              type="number"
              min="0"
              step="1"
              value="0"
              required
            >

          </div>

        </div>

        <br>

        <button
          class="primaryButton goldButton"
          type="submit"
        >
          + Agregar producto
        </button>

      </form>

    </div>


    <div class="sectionTitle">
      Stock
    </div>

    <div id="providersContainer"></div>

  </main>

</section>


<aside
  id="calculator"
  class="calculator"
>

  <div class="calcHeader">

    <div class="calcTitle">
      Calculadora
    </div>

    <button
      id="closeCalculator"
      class="smallButton"
      type="button"
    >
      ×
    </button>

  </div>

  <div
    id="calculatorItems"
    class="calcItems"
  ></div>

  <div class="calcFooter">

    <div class="calcLine">
      <span>Ganancia</span>
      <strong
        id="calcProfit"
        class="calcProfit"
      >
        $0
      </strong>
    </div>

    <div class="calcLine">
      <span>Total costo</span>
      <strong
        id="calcCost"
        class="calcTotalCost"
      >
        $0
      </strong>
    </div>

    <div class="calcTotalSale">
      <span>TOTAL DE VENTA</span>
      <strong id="calcSale">
        $0
      </strong>
    </div>

    <button
      id="clearCalculator"
      class="clearCalc"
      type="button"
    >
      Vaciar calculadora
    </button>

  </div>

</aside>


<div
  id="modalBackdrop"
  class="modalBackdrop hidden"
>

  <div
    id="modal"
    class="modal"
  ></div>

</div>


<script>

const API_URL =
  "https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";

let proveedores = [];
let productos = [];

let calculator = {};

let collapsedProviders =
  JSON.parse(
    localStorage.getItem("collapsedProviders") || "{}"
  );


// =====================================
// UTILIDADES
// =====================================

function money(value){

  const numero =
    Number(value) || 0;

  return "$" + numero.toLocaleString(
    "es-AR",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );
}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


// =====================================
// API SIN SESIÓN / SIN TOKEN
// =====================================

async function apiFetch(){

  const response =
    await fetch(API_URL);

  if(!response.ok){

    throw new Error(
      "Error HTTP " + response.status
    );
  }

  return response.json();
}


async function apiPost(data){

  const response =
    await fetch(API_URL,{
      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify(data)
    });

  if(!response.ok){

    throw new Error(
      "Error HTTP " + response.status
    );
  }

  return response.json();
}


// =====================================
// LOGIN
// =====================================

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();

      const usuario =
        document
          .getElementById("loginUser")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const error =
        document.getElementById(
          "loginError"
        );

      error.classList.add("hidden");

      try{

        const response =
          await fetch(
            API_URL + "/login",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({
                usuario,
                password
              })
            }
          );

        const data =
          await response.json();

        if(!data.ok){

          error.textContent =
            data.error ||
            "Usuario o contraseña incorrectos";

          error.classList.remove(
            "hidden"
          );

          return;
        }

        showApp();

        await cargarDatos();

      }catch(err){

        console.error(err);

        error.textContent =
          "No se pudo conectar con el servidor.";

        error.classList.remove(
          "hidden"
        );
      }

    }
  );


// =====================================
// MOSTRAR APP
// =====================================

function showLogin(){

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");
}


function showApp(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");
}


// =====================================
// CARGAR DATOS
// =====================================

async function cargarDatos(){

  const data =
    await apiFetch();

  if(!data.ok){

    throw new Error(
      data.error || "Error"
    );
  }

  proveedores =
    data.proveedores || [];

  productos =
    data.productos || [];

  renderProviders();

  renderProviderSelect();

  renderCalculator();
}


// =====================================
// SELECT PROVEEDORES
// =====================================

function renderProviderSelect(){

  const select =
    document.getElementById(
      "productProvider"
    );

  select.innerHTML = "";

  if(!proveedores.length){

    const option =
      document.createElement("option");

    option.value = "";

    option.textContent =
      "Primero agregá un proveedor";

    select.appendChild(option);

    return;
  }

  proveedores.forEach(provider => {

    const option =
      document.createElement("option");

    option.value =
      provider.id;

    option.textContent =
      provider.nombre;

    select.appendChild(option);

  });
}


// =====================================
// RENDER PROVEEDORES
// =====================================

function renderProviders(){

  const container =
    document.getElementById(
      "providersContainer"
    );

  container.innerHTML = "";

  if(!proveedores.length){

    container.innerHTML =
      `<div class="card empty">
        Todavía no hay proveedores.
      </div>`;

    return;
  }

  proveedores.forEach(provider => {

    const providerDiv =
      document.createElement("div");

    providerDiv.className =
      "provider";

    const collapsed =
      !!collapsedProviders[
        provider.id
      ];

    providerDiv.innerHTML = `

      <div class="providerHeader">

        <div
          class="providerLeft"
          data-provider-toggle="${provider.id}"
        >

          <div class="providerArrow">
            ${collapsed ? "▶" : "▼"}
          </div>

          <div class="providerName">
            ${escapeHtml(provider.nombre)}
          </div>

        </div>

        <div class="providerActions">

          <button
            class="smallButton"
            type="button"
            data-action="provider-menu"
            data-id="${provider.id}"
          >
            ⋮
          </button>

        </div>

      </div>

      <div
        class="products ${collapsed ? "hidden" : ""}"
        id="products-${provider.id}"
      ></div>
    `;

    container.appendChild(
      providerDiv
    );

    const productsContainer =
      providerDiv.querySelector(
        `#products-${provider.id}`
      );

    const providerProducts =
      productos
        .filter(
          p =>
            Number(p.proveedor_id) ===
            Number(provider.id)
        )
        .sort(
          (a,b) =>
            Number(a.orden) -
              Number(b.orden) ||
            Number(b.id) -
              Number(a.id)
        );

    if(!providerProducts.length){

      productsContainer.innerHTML =
        `<div class="empty">
          No hay productos.
        </div>`;

    }else{

      providerProducts.forEach(
        product => {

          productsContainer.appendChild(
            createProductElement(
              product
            )
          );

        }
      );

      activarArrastre(
        productsContainer,
        provider.id
      );
    }

  });
}

// =====================================
// ARRASTRAR PRODUCTOS
// =====================================

function activarArrastre(
  container,
  proveedorId
){

  let dragged = null;

  let pointerId = null;

  let startY = 0;

  let isDragging = false;

  container
    .querySelectorAll(".product")
    .forEach(product => {

      product.addEventListener(
        "dragstart",
        e => {

          dragged = product;

          product.classList.add(
            "dragging"
          );

          e.dataTransfer.effectAllowed =
            "move";

          e.dataTransfer.setData(
            "text/plain",
            product.dataset.productId
          );
        }
      );

      product.addEventListener(
        "dragend",
        async () => {

          if(!dragged) return;

          product.classList.remove(
            "dragging"
          );

          container
            .querySelectorAll(".product")
            .forEach(p =>
              p.classList.remove(
                "dragOver"
              )
            );

          const ids =
            Array.from(
              container.querySelectorAll(
                ".product"
              )
            ).map(
              p =>
                Number(
                  p.dataset.productId
                )
            );

          dragged = null;

          await guardarOrden(
            proveedorId,
            ids
          );
        }
      );

      product.addEventListener(
        "dragover",
        e => {

          e.preventDefault();

          if(
            !dragged ||
            dragged === product
          ) return;

          const rect =
            product.getBoundingClientRect();

          const middle =
            rect.top +
            rect.height / 2;

          product.classList.add(
            "dragOver"
          );

          if(
            e.clientY < middle
          ){

            container.insertBefore(
              dragged,
              product
            );

          }else{

            container.insertBefore(
              dragged,
              product.nextSibling
            );

          }
        }
      );

      product.addEventListener(
        "pointerdown",
        e => {

          if(
            e.pointerType !== "touch"
          ) return;

          pointerId =
            e.pointerId;

          startY =
            e.clientY;

          isDragging = false;

          product.setPointerCapture(
            pointerId
          );
        }
      );

      product.addEventListener(
        "pointermove",
        e => {

          if(
            e.pointerType !== "touch" ||
            e.pointerId !== pointerId
          ) return;

          const distance =
            Math.abs(
              e.clientY - startY
            );

          if(
            distance < 8 &&
            !isDragging
          ) return;

          if(!isDragging){

            isDragging = true;

            dragged = product;

            product.classList.add(
              "dragging"
            );
          }

          const target =
            document.elementFromPoint(
              e.clientX,
              e.clientY
            );

          const targetProduct =
            target?.closest(
              ".product"
            );

          if(
            !targetProduct ||
            targetProduct === product ||
            !container.contains(
              targetProduct
            )
          ) return;

          const rect =
            targetProduct
              .getBoundingClientRect();

          const middle =
            rect.top +
            rect.height / 2;

          targetProduct.classList.add(
            "dragOver"
          );

          if(
            e.clientY < middle
          ){

            container.insertBefore(
              product,
              targetProduct
            );

          }else{

            container.insertBefore(
              product,
              targetProduct.nextSibling
            );
          }

          e.preventDefault();
        }
      );

      product.addEventListener(
        "pointerup",
        async e => {

          if(
            e.pointerType !== "touch" ||
            e.pointerId !== pointerId
          ) return;

          if(isDragging){

            product.classList.remove(
              "dragging"
            );

            container
              .querySelectorAll(".product")
              .forEach(p =>
                p.classList.remove(
                  "dragOver"
                )
              );

            const ids =
              Array.from(
                container.querySelectorAll(
                  ".product"
                )
              ).map(
                p =>
                  Number(
                    p.dataset.productId
                  )
              );

            dragged = null;

            isDragging = false;

            await guardarOrden(
              proveedorId,
              ids
            );
          }

          pointerId = null;
        }
      );

    });
}

// =====================================
// CLICK GENERAL
// =====================================

document.addEventListener(
  "click",
  async e => {

    const toggle =
      e.target.closest(
        "[data-provider-toggle]"
      );

    if(toggle){

      const id =
        toggle.dataset.providerToggle;

      collapsedProviders[id] =
        !collapsedProviders[id];

      localStorage.setItem(
        "collapsedProviders",
        JSON.stringify(
          collapsedProviders
        )
      );

      renderProviders();

      return;
    }


    const providerMenu =
      e.target.closest(
        "[data-action='provider-menu']"
      );

    if(providerMenu){

      const id =
        Number(
          providerMenu.dataset.id
        );

      abrirMenuProveedor(id);

      return;
    }


    const productMenu =
      e.target.closest(
        "[data-product-menu]"
      );

    if(productMenu){

      const id =
        productMenu.dataset.productMenu;

      const menu =
        document.getElementById(
          "product-menu-" + id
        );

      menu.classList.toggle(
        "hidden"
      );

      return;
    }


    const editProduct =
      e.target.closest(
        "[data-edit-product]"
      );

    if(editProduct){

      abrirEditarProducto(
        Number(
          editProduct.dataset.editProduct
        )
      );

      return;
    }


    const deleteProduct =
      e.target.closest(
        "[data-delete-product]"
      );

    if(deleteProduct){

      const id =
        Number(
          deleteProduct.dataset.deleteProduct
        );

      if(
        !confirm(
          "¿Eliminar este producto?"
        )
      ) return;

      try{

        const data =
          await apiPost({
            accion:
              "eliminar_producto",

            id
          });

        if(!data.ok){

          alert(
            data.error ||
            "No se pudo eliminar."
          );

          return;
        }

        delete calculator[id];

        await cargarDatos();

      }catch(error){

        alert(
          "Error al eliminar."
        );

        console.error(error);
      }

      return;
    }


    const plus =
      e.target.closest(
        "[data-calc-plus]"
      );

    if(plus){

      const id =
        Number(
          plus.dataset.calcPlus
        );

      calculator[id] =
        Number(
          calculator[id] || 0
        ) + 1;

      renderProviders();

      renderCalculator();

      return;
    }


    const minus =
      e.target.closest(
        "[data-calc-minus]"
      );

    if(minus){

      const id =
        Number(
          minus.dataset.calcMinus
        );

      calculator[id] =
        Math.max(
          0,
          Number(
            calculator[id] || 0
          ) - 1
        );

      if(calculator[id] === 0){

        delete calculator[id];
      }

      renderProviders();

      renderCalculator();

      return;
    }

  }
);

function openModal(html){

  document
    .getElementById(
      "modal"
    )
    .innerHTML =
      html;

  document
    .getElementById(
      "modalBackdrop"
    )
    .classList.remove(
      "hidden"
    );
}


function closeModal(){

  document
    .getElementById(
      "modalBackdrop"
    )
    .classList.add(
      "hidden"
    );
}


// =====================================
// CALCULADORA
// =====================================

function renderCalculator(){

  const container =
    document.getElementById(
      "calculatorItems"
    );

  container.innerHTML = "";

  let totalCost = 0;
  let totalSale = 0;
  let totalItems = 0;

  Object.entries(
    calculator
  ).forEach(
    ([id, quantity]) => {

      const product =
        productos.find(
          p =>
            Number(p.id) ===
            Number(id)
        );

      if(!product) return;

      const qty =
        Number(quantity) || 0;

      if(qty <= 0) return;

      totalItems += qty;

      totalCost +=
        Number(product.costo) *
        qty;

      totalSale +=
        Number(product.venta) *
        qty;

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "calcItem";

      const capacity =
        product.capacidad !==
          "Ninguno"
          ? " · " +
            product.capacidad
          : "";

      item.innerHTML = `

        <div class="calcItemName">
          ${escapeHtml(product.producto)}
          ${escapeHtml(capacity)}
        </div>

        <div class="calcItemInfo">
          ${qty} × ${money(product.venta)}
        </div>

      `;

      container.appendChild(
        item
      );
    }
  );

  if(!totalItems){

    container.innerHTML =
      `<div class="empty">
        No hay productos seleccionados.
      </div>`;
  }

  const profit =
    totalSale -
    totalCost;

  document
    .getElementById(
      "calcProfit"
    )
    .textContent =
      money(profit);

  document
    .getElementById(
      "calcCost"
    )
    .textContent =
      money(totalCost);

  document
    .getElementById(
      "calcSale"
    )
    .textContent =
      money(totalSale);

  const badge =
    document.getElementById(
      "calculatorBadge"
    );

  if(totalItems > 0){

    badge.textContent =
      totalItems;

    badge.classList.remove(
      "hidden"
    );

  }else{

    badge.classList.add(
      "hidden"
    );
  }
}


// =====================================
// ABRIR CALCULADORA
// =====================================

document
  .getElementById(
    "calculatorButton"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "calculator"
        )
        .classList.add(
          "open"
        );

    }
  );


document
  .getElementById(
    "closeCalculator"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "calculator"
        )
        .classList.remove(
          "open"
        );

    }
  );


// =====================================
// VACIAR CALCULADORA
// =====================================

document
  .getElementById(
    "clearCalculator"
  )
  .addEventListener(
    "click",
    () => {

      calculator = {};

      renderProviders();

      renderCalculator();
    }
  );


// =====================================
// LOGOUT
// =====================================

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    () => {

      calculator = {};

      showLogin();

      document
        .getElementById(
          "loginPassword"
        )
        .value = "";

    }
  );


// =====================================
// CERRAR MODAL AFUERA
// =====================================

document
  .getElementById(
    "modalBackdrop"
  )
  .addEventListener(
    "click",
    e => {

      if(
        e.target.id ===
        "modalBackdrop"
      ){

        closeModal();

      }
    }
  );


// =====================================
// INICIO
// =====================================

showLogin();

</script>

</body>
</html>

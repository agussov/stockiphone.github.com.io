<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock iPhone</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
:root{
  --black:#07070a;
  --black2:#101016;
  --black3:#15151d;

  --purple:#7c3aed;
  --purple2:#a855f7;
  --purple3:#c084fc;

  --gold:#f5c542;
  --gold2:#ffd95a;

  --white:#ffffff;
  --gray:#aaaab7;
  --gray2:#24242e;

  --red:#ef4444;
  --green:#22c55e;

  --border:rgba(255,255,255,.08);
  --glass:rgba(17,17,23,.82);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  min-height:100%;
  background:#060609;
}

body{
  margin:0;
  min-height:100vh;
  width:100%;

  background:
    radial-gradient(
      ellipse 70% 45% at 50% -5%,
      rgba(124,58,237,.42),
      transparent 65%
    ),
    radial-gradient(
      ellipse 55% 40% at 100% 30%,
      rgba(168,85,247,.17),
      transparent 70%
    ),
    radial-gradient(
      ellipse 50% 35% at 0% 80%,
      rgba(76,29,149,.13),
      transparent 70%
    ),
    linear-gradient(
      145deg,
      #060609 0%,
      #100b18 45%,
      #08080c 100%
    );

  background-attachment:fixed;
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:#060609;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================================================
   LOGIN
========================================================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:390px;

  background:
    linear-gradient(
      145deg,
      rgba(25,20,34,.94),
      rgba(12,12,17,.96)
    );

  border:1px solid rgba(168,85,247,.32);
  border-radius:24px;
  padding:31px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.55),
    0 0 60px rgba(124,58,237,.10);

  backdrop-filter:blur(18px);
}

.loginTitle{
  font-size:29px;
  font-weight:900;
  margin-bottom:8px;
}

.loginSubtitle{
  color:var(--gray);
  margin-bottom:25px;
}

.loginBox label{
  display:block;
  font-size:13px;
  color:var(--gray);
  margin:14px 0 7px;
}

.loginBox input{
  width:100%;
  border:1px solid #292933;
  background:#09090d;
  color:white;
  border-radius:12px;
  padding:14px;
  outline:none;
  transition:.2s;
}

.loginBox input:focus{
  border-color:var(--purple2);
  box-shadow:0 0 0 3px rgba(168,85,247,.10);
}

.loginButton{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--purple2)
    );

  color:white;
  font-weight:800;

  box-shadow:
    0 8px 25px rgba(124,58,237,.25);
}

.loginButton:hover{
  filter:brightness(1.1);
}

.loginError{
  color:#ff7777;
  font-size:13px;
  margin-top:12px;
}


/* =========================================================
   APP / TOPBAR
========================================================= */

#app{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;

  background:rgba(7,7,10,.78);
  backdrop-filter:blur(20px);

  border-bottom:1px solid rgba(168,85,247,.15);

  box-shadow:
    0 10px 35px rgba(0,0,0,.25);
}

.topbarInner{
  max-width:1100px;
  margin:auto;

  padding:14px 18px;

  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
}

.brand{
  grid-column:1;
  justify-self:start;

  font-size:21px;
  font-weight:900;
  letter-spacing:-.4px;
}

.brand span{
  color:var(--gold);
}

.centerBrand{
  grid-column:2;
  justify-self:center;

  font-family:"Permanent Marker","Brush Script MT","Segoe Print",cursive;
  font-size:25px;
  font-weight:400;
  letter-spacing:1px;

  color:#fff;

  text-shadow:
    0 0 10px rgba(168,85,247,.55),
    2px 2px 0 rgba(124,58,237,.35);

  transform:rotate(-2deg);
}

.topActions{
  grid-column:3;
  justify-self:end;

  display:flex;
  align-items:center;
  gap:8px;
}

.iconButton{
  position:relative;

  width:43px;
  height:43px;

  border:1px solid #30303a;
  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #191920,
      #101016
    );

  color:white;
  font-size:19px;

  transition:.2s;
}

.iconButton:hover{
  border-color:rgba(168,85,247,.65);
  transform:translateY(-1px);
}

.logoutButton{
  border:1px solid #30202a;
  background:#171116;
  color:#ff8b8b;
  border-radius:10px;
  padding:10px 12px;
}

.badge{
  position:absolute;
  right:-5px;
  top:-5px;

  min-width:19px;
  height:19px;

  padding:0 5px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--red);
  color:white;

  border-radius:99px;

  font-size:10px;
  font-weight:900;

  box-shadow:0 3px 10px rgba(239,68,68,.35);
}



/* GESTION */
.managementDrawer{position:fixed;top:0;right:0;height:100vh;width:440px;max-width:calc(100vw - 18px);z-index:230;padding:18px;overflow-y:auto;background:linear-gradient(145deg,#111117,#09090d);border-left:1px solid #2a2a35;box-shadow:-20px 0 60px rgba(0,0,0,.55);transform:translateX(105%);transition:transform .25s ease;}
.managementDrawer.open{transform:translateX(0);}
.managementHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #292933;}
.managementTitle{font-size:20px;font-weight:900;}
.managementSection{margin-bottom:22px;}
.managementSection .sectionTitle{margin-top:0;}
.managementDrawer .card{width:100%;max-width:none;}
.managementBackdrop{position:fixed;inset:0;z-index:220;background:rgba(0,0,0,.38);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s ease;}
.managementBackdrop.open{opacity:1;pointer-events:auto;}
@media(max-width:560px){.managementDrawer{width:100%;max-width:100%;padding:15px;}}

/* =========================================================
   CONTENT
========================================================= */

.container{
  max-width:1100px;
  margin:auto;
  padding:22px 18px 70px;
}

.sectionTitle{
  font-size:22px;
  font-weight:900;
  margin:12px 0 15px;

  letter-spacing:-.3px;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(20,20,27,.92),
      rgba(12,12,17,.88)
    );

  border:1px solid var(--border);
  border-radius:18px;

  padding:17px;
  margin-bottom:18px;

  box-shadow:
    0 14px 38px rgba(0,0,0,.15);

  backdrop-filter:blur(10px);
}


/* PROVEEDOR */

.providerAddCard{
  padding:11px;
  width:70%;
  max-width:770px;
}

.providerAddCard .primaryButton{
  padding:9px 12px;
  font-size:13px;
}

.providerAddCard .formGroup input{
  padding:9px 11px;
}

.providerAddCard .formGroup label{
  font-size:11px;
  margin-bottom:4px;
}


/* FORM */

.formGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.formGroup label{
  display:block;
  color:var(--gray);
  font-size:12px;
  margin-bottom:6px;
}

.formGroup input,
.formGroup select{
  width:100%;

  background:#09090d;
  border:1px solid #292933;

  color:white;

  border-radius:11px;
  padding:12px;

  outline:none;

  transition:.2s;
}

.formGroup input:focus,
.formGroup select:focus{
  border-color:var(--purple2);

  box-shadow:
    0 0 0 3px rgba(168,85,247,.08);
}

.full{
  grid-column:1/-1;
}

.primaryButton{
  border:0;
  border-radius:11px;

  padding:12px 15px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--purple2)
    );

  color:white;
  font-weight:800;

  box-shadow:
    0 7px 20px rgba(124,58,237,.18);

  transition:.2s;
}

.primaryButton:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.goldButton{
  background:
    linear-gradient(
      135deg,
      var(--gold),
      var(--gold2)
    );

  color:#111;

  box-shadow:
    0 7px 20px rgba(245,197,66,.12);
}


/* =========================================================
   PROVIDERS
========================================================= */

.provider{
  border:1px solid #272731;
  border-radius:17px;
  overflow:hidden;

  margin-bottom:14px;

  background:
    linear-gradient(
      145deg,
      #111117,
      #0d0d12
    );

  box-shadow:
    0 10px 30px rgba(0,0,0,.14);
}

.providerHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:15px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.025),
      rgba(124,58,237,.035)
    );
}

.providerLeft{
  display:flex;
  align-items:center;
  gap:10px;

  min-width:0;

  cursor:pointer;
}

.providerArrow{
  color:var(--gold);
  font-size:15px;
  width:20px;
  text-align:center;
}

.providerName{
  font-size:18px;
  font-weight:900;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.providerActions{
  display:flex;
  gap:6px;
}

.smallButton{
  width:36px;
  height:36px;

  border-radius:9px;

  border:1px solid #30303a;

  background:
    linear-gradient(
      145deg,
      #1c1c24,
      #15151b
    );

  color:white;

  transition:.2s;
}

.smallButton:hover{
  border-color:#50505d;
}

.products{
  padding:10px;
}


/* =========================================================
   PRODUCT
========================================================= */

.product{
  position:relative;

  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;

  padding:14px;
  margin-bottom:8px;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #0e0e13,
      #0a0a0e
    );

  border:1px solid #202028;

  touch-action:pan-y;
  user-select:none;
  cursor:default;

  transition:
    transform .18s ease,
    opacity .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.product[draggable="true"]{
  -webkit-user-drag:none;
}

.product:last-child{
  margin-bottom:0;
}

.product.dragging{
  opacity:.45;
  transform:scale(1.025);

  border-color:var(--purple2);

  cursor:grabbing;

  box-shadow:
    0 10px 35px rgba(124,58,237,.20);
}

/* Controles de orden manual: solo aparecen al activar "Movimiento" */
.moveControls{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:3px;
  z-index:4;
}
.moveControls button{
  width:24px;
  height:22px;
  padding:0;
  border:1px solid #34343e;
  border-radius:6px;
  background:#17171f;
  color:#d8d8df;
  font-size:13px;
  font-weight:900;
  line-height:1;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.moveControls button:hover{
  border-color:var(--gold);
  color:var(--gold);
}
.moveControls button:disabled{
  opacity:.28;
  cursor:default;
}

.product.dragOver{
  border-color:var(--gold);

  box-shadow:
    0 0 0 2px rgba(245,197,66,.25);
}

.productMain{
  min-width:0;
}

.productNameRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-width:0;
}

.productName{
  font-size:16px;
  font-weight:800;
  line-height:1.2;
  min-width:0;
}

.capacity{
  color:var(--gold2);
  font-size:16px;
  font-weight:700;
  margin:0;
  flex:0 0 auto;
  white-space:nowrap;
}

.cost{
  color:var(--gray);
  font-size:13px;
  margin-top:3px;
}

.productBottom{
  margin-top:11px;

  display:flex;
  align-items:center;

  gap:10px;

  flex-wrap:wrap;
}

.sale{
  color:white;
  font-size:20px;
  font-weight:900;
}

.stock{
  color:var(--gold2);
  font-size:13px;
  font-weight:900;
}

.calcControls{
  display:flex;
  align-items:center;
  gap:5px;
}

.calcControls button{
  width:30px;
  height:30px;

  border:1px solid #33333d;
  border-radius:8px;

  background:#17171d;
  color:white;

  font-size:18px;
}

.calcControls button:hover{
  border-color:var(--purple2);
  background:#20202a;
}

.calcQty{
  min-width:20px;
  text-align:center;
  font-weight:800;
}


/* PEDIR */

.orderButton{
  height:30px;

  border:1px solid rgba(245,197,66,.35);
  border-radius:8px;

  background:
    rgba(245,197,66,.08);

  color:var(--gold2);

  padding:0 11px;

  font-size:12px;
  font-weight:900;

  transition:.2s;
}

.orderButton:hover{
  background:rgba(245,197,66,.16);
  border-color:var(--gold);
}


/* MENU PRODUCTO */

.productMenuButton{
  width:35px;
  height:35px;

  border:1px solid #30303a;
  border-radius:9px;

  background:#15151b;
  color:white;

  font-size:18px;
}

.productMenu{
  position:absolute;

  right:10px;
  top:50px;

  z-index:20;

  min-width:145px;

  background:#191920;
  border:1px solid #353540;

  border-radius:11px;
  padding:5px;

  box-shadow:
    0 15px 35px rgba(0,0,0,.5);
}

.productMenu button{
  display:block;
  width:100%;

  border:0;
  background:transparent;

  color:white;

  text-align:left;

  padding:11px;

  border-radius:8px;
}

.productMenu button:hover{
  background:#25252d;
}

.productMenu .danger{
  color:#ff7777;
}


/* =========================================================
   MODALS
========================================================= */

.modalBackdrop{
  position:fixed;
  inset:0;

  z-index:100;

  background:rgba(0,0,0,.72);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px;

  backdrop-filter:blur(4px);
}

.modal{
  width:100%;
  max-width:450px;

  background:
    linear-gradient(
      145deg,
      #15151d,
      #0e0e13
    );

  border:1px solid #32323d;
  border-radius:19px;

  padding:20px;

  max-height:90vh;
  overflow:auto;

  box-shadow:
    0 25px 80px rgba(0,0,0,.55);
}

.modalTitle{
  font-size:20px;
  font-weight:900;
  margin-bottom:15px;
}

.modalActions{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.modalActions button{
  flex:1;
}

.secondaryButton{
  border:1px solid #34343e;
  background:#191920;
  color:white;

  border-radius:11px;
  padding:12px;
}

.checkRow{
  display:flex;
  align-items:center;
  gap:10px;

  padding:11px;

  background:#18181f;

  border-radius:10px;
  margin-bottom:8px;
}

.checkRow input{
  width:18px;
  height:18px;
}


/* =========================================================
   DRAWERS
========================================================= */

.calculator{
  position:fixed;

  right:0;
  top:0;

  height:100%;

  width:390px;
  max-width:100%;

  z-index:200;

  background:
    linear-gradient(
      145deg,
      #111117,
      #09090d
    );

  border-left:1px solid #2a2a35;

  box-shadow:
    -20px 0 60px rgba(0,0,0,.55);

  transform:translateX(100%);

  transition:
    transform .25s ease;

  display:flex;
  flex-direction:column;
}

.calculator.open{
  transform:translateX(0);
}

.calcHeader{
  padding:18px;

  border-bottom:1px solid #292933;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.calcTitle{
  font-size:20px;
  font-weight:900;
}

.calcItems{
  flex:1;
  overflow:auto;
  padding:15px;
}

.calcItem{
  padding:12px;

  border:1px solid #25252e;

  border-radius:11px;

  margin-bottom:8px;

  background:rgba(255,255,255,.015);
}

.calcItemName{
  font-weight:800;
}

.calcItemInfo{
  color:var(--gray);
  font-size:13px;
  margin-top:4px;
}

.calcFooter{
  border-top:1px solid #292933;
  padding:17px;
}

.calcLine{
  display:flex;
  justify-content:space-between;

  margin-bottom:9px;

  color:var(--gray);
}

.calcProfit{
  color:var(--green);
  font-weight:900;
}

.calcTotalCost{
  color:white;
}

.calcTotalSale{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin:15px 0;

  font-size:21px;
  font-weight:900;
}

.calcTotalSale strong{
  color:var(--gold);
}


/* BOTONES DE CALCULADORA */

.calcActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}

.soldButton{
  width:100%;

  border:0;
  border-radius:11px;

  padding:12px;

  background:
    linear-gradient(
      135deg,
      #16a34a,
      #22c55e
    );

  color:white;
  font-weight:900;

  box-shadow:
    0 8px 20px rgba(34,197,94,.13);
}

.clearCalc{
  width:100%;

  border:1px solid #42252a;
  background:#211216;

  color:#ff7777;

  padding:12px;

  border-radius:11px;

  font-weight:800;
}


/* =========================================================
   PEDIDOS
========================================================= */

.orderDrawer{
  position:fixed;

  right:0;
  top:0;

  height:100%;

  width:390px;
  max-width:100%;

  z-index:210;

  background:
    linear-gradient(
      145deg,
      #111117,
      #09090d
    );

  border-left:1px solid #2a2a35;

  box-shadow:
    -20px 0 60px rgba(0,0,0,.55);

  transform:translateX(100%);

  transition:
    transform .25s ease;

  display:flex;
  flex-direction:column;
}

.orderDrawer.open{
  transform:translateX(0);
}

.orderHeader{
  padding:18px;

  border-bottom:1px solid #292933;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.orderTitle{
  font-size:20px;
  font-weight:900;
}

.orderItems{
  flex:1;
  overflow:auto;
  padding:15px;
}

.orderItem{
  padding:13px;

  border:1px solid #292932;

  border-radius:13px;

  margin-bottom:9px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(124,58,237,.025)
    );
}

.orderItemTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.orderItemName{
  font-weight:900;
}

.orderItemCapacity{
  color:var(--gold2);
  font-size:13px;
  margin-top:3px;
}

.orderItemInfo{
  color:var(--gray);
  font-size:13px;
  margin-top:6px;
}

.orderActionRow{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:11px;
}

.addOrderButton{
  flex:1;
  border:1px solid rgba(250,204,21,.72);
  border-radius:10px;
  padding:10px 11px;
  background:rgba(250,204,21,.09);
  color:var(--gold);
  font-weight:900;
  cursor:pointer;
}

.addOrderButton:hover{
  background:rgba(250,204,21,.15);
}

.addOrderButton.ready{
  border-color:#666673;
  background:#3a3a42;
  color:#d7d7dd;
}

.addOrderButton.ready:hover{
  background:#45454e;
}

.removeOrderButton{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border:1px solid rgba(239,68,68,.35);
  border-radius:8px;
  background:rgba(239,68,68,.08);
  color:#ff6b6b;
  font-weight:900;
  cursor:pointer;
}

.removeOrderButton:hover{
  background:rgba(239,68,68,.18);
}

.orderCalculator{
  flex:0 0 auto;
  border-top:1px solid #292933;
  padding:12px 15px 15px;

<script>

const API_URL =
  "https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";


let sessionToken =
  sessionStorage.getItem("stock_session");


let proveedores = [];

let productos = [];

let calculator = {};


// =========================================================
// PEDIDOS
// =========================================================

let pedidos =
  JSON.parse(
    localStorage.getItem("stock_pedidos") || "[]"
  );


function guardarPedidos(){

  localStorage.setItem(
    "stock_pedidos",
    JSON.stringify(pedidos)
  );

}


// =========================================================
// PROVEEDORES
// =========================================================
//
// IMPORTANTE:
// Al entrar a la página todos comienzan cerrados.
// Después se respeta exactamente lo que el usuario
// haga manualmente.
// =========================================================

let collapsedProviders = {};
let movementModeProviders = {};

let providersInitialized = false;


// =========================================================
// UTILIDADES
// =========================================================

function money(value){

  const numero =
    Number(value) || 0;

  return "$" +
    numero.toLocaleString(
      "es-AR",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );
}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


// =========================================================
// API
// =========================================================

async function apiFetch(){

  const response =
    await fetch(
      API_URL,
      {
        headers:{
          Authorization:
            "Bearer " + sessionToken
        }
      }
    );

  if(response.status === 401){

    sessionStorage.removeItem(
      "stock_session"
    );

    sessionToken = null;

    showLogin();

    throw new Error(
      "Sesión expirada"
    );
  }

  return response.json();
}


async function apiPost(data){

  const response =
    await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          Authorization:
            "Bearer " + sessionToken
        },

        body:JSON.stringify(data)
      }
    );

  if(response.status === 401){

    sessionStorage.removeItem(
      "stock_session"
    );

    sessionToken = null;

    showLogin();

    throw new Error(
      "Sesión expirada"
    );
  }

  return response.json();
}


// =========================================================
// LOGIN
// =========================================================

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();

      const usuario =
        document
          .getElementById("loginUser")
          .value;

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const error =
        document.getElementById(
          "loginError"
        );

      error.classList.add(
        "hidden"
      );

      try{

        const response =
          await fetch(
            API_URL + "/login",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({
                usuario,
                password
              })
            }
          );

        const data =
          await response.json();

        if(!data.ok){

          error.textContent =
            data.error ||
            "Usuario o contraseña incorrectos";

          error.classList.remove(
            "hidden"
          );

          return;
        }

        sessionToken =
          data.token;

        sessionStorage.setItem(
          "stock_session",
          sessionToken
        );

        showApp();

        await cargarDatos();

      }catch(error){

        document.getElementById(
          "loginError"
        ).textContent =
          "No se pudo conectar con el servidor.";

        document.getElementById(
          "loginError"
        ).classList.remove(
          "hidden"
        );
      }

    }
  );


// =========================================================
// MOSTRAR APP
// =========================================================

function showLogin(){

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("app")
    .classList.add("hidden");

}


function showApp(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

}


// =========================================================
// CARGAR DATOS
// =========================================================

async function cargarDatos(){

  const data =
    await apiFetch();

  if(!data.ok){

    throw new Error(
      data.error || "Error"
    );
  }

  proveedores =
    data.proveedores || [];

  productos =
    data.productos || [];


  // -----------------------------------------
  // Primera carga:
  // TODOS LOS PROVEEDORES CERRADOS.
  // -----------------------------------------

  if(!providersInitialized){

    collapsedProviders = {};

    proveedores.forEach(
      provider => {

        collapsedProviders[
          provider.id
        ] = true;

      }
    );

    providersInitialized = true;
  }


  renderProviders();

  renderProviderSelect();

  renderCalculator();

  renderOrders();

}


// =========================================================
// SELECT PROVEEDORES
// =========================================================

function renderProviderSelect(){

  const select =
    document.getElementById(
      "productProvider"
    );

  select.innerHTML = "";

  if(!proveedores.length){

    const option =
      document.createElement(
        "option"
      );

    option.value = "";

    option.textContent =
      "Primero agregá un proveedor";

    select.appendChild(option);

    return;
  }

  proveedores.forEach(
    provider => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        provider.id;

      option.textContent =
        provider.nombre;

      select.appendChild(
        option
      );

    }
  );
}


// =========================================================
// RENDER PROVEEDORES
// =========================================================

function renderProviders(){

  const container =
    document.getElementById(
      "providersContainer"
    );

  container.innerHTML = "";

  if(!proveedores.length){

    container.innerHTML =
      `<div class="card empty">
        Todavía no hay proveedores.
      </div>`;

    return;
  }


  proveedores.forEach(
    provider => {

      const providerDiv =
        document.createElement(
          "div"
        );

      providerDiv.className =
        "provider";


      const collapsed =
        collapsedProviders[
          provider.id
        ] !== false;


      const movementMode =
        movementModeProviders[provider.id] === true;


      providerDiv.innerHTML = `

        <div class="providerHeader">

          <div
            class="providerLeft"
            data-provider-toggle="${provider.id}"
          >

            <div class="providerArrow">
              ${collapsed ? "▶" : "▼"}
            </div>

            <div class="providerName">
              ${escapeHtml(provider.nombre)}
            </div>

          </div>

          <div class="providerActions">

            <button
              class="smallButton"
              type="button"
              data-action="provider-menu"
              data-id="${provider.id}"
            >
              ⋮
            </button>

          </div>

        </div>


        <div
          class="products ${collapsed ? "hidden" : ""}"
          id="products-${provider.id}"
        ></div>

      `;


      container.appendChild(
        providerDiv
      );


      const productsContainer =
        providerDiv.querySelector(
          `#products-${provider.id}`
        );


      const providerProducts =
        productos
          .filter(
            p =>
              Number(p.proveedor_id) ===
              Number(provider.id)
          )
          .sort(
            (a,b) =>
              Number(a.orden) -
                Number(b.orden) ||
              Number(b.id) -
                Number(a.id)
          );


      if(!providerProducts.length){

        productsContainer.innerHTML =
          `<div class="empty">
            No hay productos.
          </div>`;

      }else{

        providerProducts.forEach(
          product => {

            productsContainer.appendChild(
              createProductElement(
                product,
                movementMode
              )
            );

          }
        );

        activarArrastre(
          productsContainer,
          provider.id
        );
      }

    }
  );
}


// =========================================================
// CREAR PRODUCTO
// =========================================================

function createProductElement(product, movementMode = false){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "product";

  div.draggable = false;

  div.dataset.productId =
    product.id;


  const qty =
    Number(
      calculator[
        product.id
      ] || 0
    );


  const capacity =
    product.capacidad &&
    product.capacidad !== "Ninguno"
      ? `
        <div class="capacity">
          ${escapeHtml(product.capacidad)}
        </div>
      `
      : "";


  div.innerHTML = `

    <div class="productMain">

      <div class="productNameRow">
        <div class="productName">
          ${escapeHtml(product.producto)}
        </div>
        ${capacity}
      </div>

      <div class="cost">
        Costo: ${money(product.costo)}
      </div>

      <div class="productBottom">

        <div class="sale">
          ${money(product.venta)}
        </div>

        <div class="stock">
          STOCK: ${product.cantidad}
        </div>


        <div class="calcControls">

          <button
            type="button"
            data-calc-minus="${product.id}"
          >
            −
          </button>

          <span class="calcQty">
            ${qty}
          </span>

          <button
            type="button"
            data-calc-plus="${product.id}"
          >
            +
          </button>

        </div>


        <button
          class="orderButton"
          type="button"
          data-order-product="${product.id}"
        >
          📦 Pedir
        </button>

      </div>

    </div>


    <div>

      <button
        class="productMenuButton"
        type="button"
        data-product-menu="${product.id}"
      >
        ⋮
      </button>

    </div>


    ${movementMode ? `
      <div class="moveControls" aria-label="Mover producto">
        <button type="button" data-move-product="${product.id}" data-direction="up" title="Mover arriba">↑</button>
        <button type="button" data-move-product="${product.id}" data-direction="down" title="Mover abajo">↓</button>
      </div>
    ` : ""}


    <div
      class="productMenu hidden"
      id="product-menu-${product.id}"
    >

      <button
        type="button"
        data-edit-product="${product.id}"
      >
        Editar
      </button>

      <button
        type="button"
        class="danger"
        data-delete-product="${product.id}"
      >
        Eliminar
      </button>

    </div>

  `;


  return div;
}


// =========================================================
// ARRASTRAR PRODUCTOS
// =========================================================

function activarArrastre(container, proveedorId){
  // El arrastre manual queda desactivado a propósito, especialmente en móvil.
  // El orden se modifica con las flechas ↑ ↓ o desde el menú ⋮ de cada producto.
  container.querySelectorAll(".product").forEach(product => {
    product.draggable = false;
  });
}


async function moverProducto(productId, direction){

  const product = productos.find(p => Number(p.id) === Number(productId));
  if(!product) return;

  const providerId = Number(product.proveedor_id);
  const list = productos
    .filter(p => Number(p.proveedor_id) === providerId)
    .sort((a,b) => Number(a.orden) - Number(b.orden) || Number(b.id) - Number(a.id));

  const index = list.findIndex(p => Number(p.id) === Number(productId));
  if(index < 0) return;

  const targetIndex = direction === "up" ? index - 1 : index + 1;
  if(targetIndex < 0 || targetIndex >= list.length) return;

  const other = list[targetIndex];
  const tmp = Number(product.orden);
  product.orden = Number(other.orden);
  other.orden = tmp;

  // Reasignamos un orden limpio para evitar empates.
  list.sort((a,b) => Number(a.orden) - Number(b.orden) || Number(b.id) - Number(a.id));
  const ids = list.map(p => Number(p.id));
  list.forEach((p,i) => p.orden = i + 1);

  renderProviders();
  await guardarOrden(providerId, ids);
}


// =========================================================
// GUARDAR ORDEN
// =========================================================

async function guardarOrden(
  proveedorId,
  ids
){

  try{

    const data =
      await apiPost({

        accion:
          "reordenar_productos",

        proveedor_id:
          proveedorId,

        ids

      });


    if(!data.ok){

      console.error(
        data.error
      );

    }

  }catch(error){

    console.error(
      "Error guardando orden:",
      error
    );

  }
}


// =========================================================
// AGREGAR PROVEEDOR
// =========================================================

document
  .getElementById("providerForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      const input =
        document.getElementById(
          "providerName"
        );


      const nombre =
        input.value.trim();


      if(!nombre) return;


      const data =
        await apiPost({

          accion:
            "crear_proveedor",

          nombre

        });


      if(!data.ok){

        alert(
          data.error ||
          "No se pudo crear"
        );

        return;
      }


      input.value = "";


      await cargarDatos();

    }
  );


// =========================================================
// AGREGAR PRODUCTO
// =========================================================

document
  .getElementById("productForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      const producto =
        document
          .getElementById(
            "productName"
          )
          .value
          .trim();


      const proveedor_id =
        Number(
          document
            .getElementById(
              "productProvider"
            )
            .value
        );


      const capacidad =
        document
          .getElementById(
            "productCapacity"
          )
          .value;


      const venta =
        Number(
          document
            .getElementById(
              "productSale"
            )
            .value
        );


      const costo =
        Number(
          document
            .getElementById(
              "productCost"
            )
            .value
        );


      const cantidad =
        Number(
          document
            .getElementById(
              "productStock"
            )
            .value
        );


      if(!producto){

        alert(
          "Escribí el nombre del producto."
        );

        return;

// =========================================================
// CLICK GENERAL
// =========================================================

document.addEventListener(
  "click",
  async e => {


    // -----------------------------------------
    // ABRIR / CERRAR PROVEEDOR
    // -----------------------------------------

    const toggle =
      e.target.closest(
        "[data-provider-toggle]"
      );


    if(toggle){

      const id =
        toggle.dataset.providerToggle;


      collapsedProviders[id] =
        collapsedProviders[id] === false;


      renderProviders();

      return;
    }


    // -----------------------------------------
    // MENU PROVEEDOR
    // -----------------------------------------

    const providerMenu =
      e.target.closest(
        "[data-action='provider-menu']"
      );


    if(providerMenu){

      const id =
        Number(
          providerMenu.dataset.id
        );

      abrirMenuProveedor(id);

      return;
    }


    // -----------------------------------------
    // MENU PRODUCTO
    // -----------------------------------------

    const productMenu =
      e.target.closest(
        "[data-product-menu]"
      );


    if(productMenu){

      const id =
        productMenu.dataset.productMenu;


      const menu =
        document.getElementById(
          "product-menu-" + id
        );


      menu.classList.toggle(
        "hidden"
      );

      return;
    }


    // -----------------------------------------
    // MOVER PRODUCTO CON FLECHAS
    // -----------------------------------------

    const moveProduct = e.target.closest("[data-move-product]");

    if(moveProduct){
      e.preventDefault();
      e.stopPropagation();
      await moverProducto(
        Number(moveProduct.dataset.moveProduct),
        moveProduct.dataset.direction
      );
      return;
    }


    // -----------------------------------------
    // EDITAR PRODUCTO
    // -----------------------------------------

    const editProduct =
      e.target.closest(
        "[data-edit-product]"
      );


    if(editProduct){

      abrirEditarProducto(
        Number(
          editProduct.dataset.editProduct
        )
      );

      return;
    }


    // -----------------------------------------
    // ELIMINAR PRODUCTO
    // -----------------------------------------

    const deleteProduct =
      e.target.closest(
        "[data-delete-product]"
      );


    if(deleteProduct){

      const id =
        Number(
          deleteProduct.dataset.deleteProduct
        );


      if(
        !confirm(
          "¿Eliminar este producto?"
        )
      ) return;


      const data =
        await apiPost({

          accion:
            "eliminar_producto",

          id

        });


      if(!data.ok){

        alert(
          data.error ||
          "No se pudo eliminar."
        );

        return;
      }


      delete calculator[id];


      pedidos =
        pedidos.filter(
          p =>
            Number(p.productId) !==
            Number(id)
        );


      guardarPedidos();


      await cargarDatos();

      return;
    }


    // -----------------------------------------
    // CALCULADORA +
    // -----------------------------------------

    const plus =
      e.target.closest(
        "[data-calc-plus]"
      );


    if(plus){

      const id =
        Number(
          plus.dataset.calcPlus
        );


      calculator[id] =
        Number(
          calculator[id] || 0
        ) + 1;


      renderProviders();

      renderCalculator();

      return;
    }


    // -----------------------------------------
    // CALCULADORA -
    // -----------------------------------------

    const minus =
      e.target.closest(
        "[data-calc-minus]"
      );


    if(minus){

      const id =
        Number(
          minus.dataset.calcMinus
        );


      calculator[id] =
        Math.max(
          0,
          Number(
            calculator[id] || 0
          ) - 1
        );


      if(
        calculator[id] === 0
      ){

        delete calculator[id];

      }


      renderProviders();

      renderCalculator();

      return;
    }


    // -----------------------------------------
    // PEDIR
    // -----------------------------------------

    const orderProduct =
      e.target.closest(
        "[data-order-product]"
      );


    if(orderProduct){

      const id =
        Number(
          orderProduct.dataset.orderProduct
        );


      agregarPedido(id);

      return;
    }

  }
);


// =========================================================
// PEDIR PRODUCTO
// =========================================================

function agregarPedido(productId){

  const product =
    productos.find(
      p =>
        Number(p.id) ===
        Number(productId)
    );


  if(!product) return;


  // Cada pedido queda en su propia tarjeta, incluso si es el mismo producto.
  pedidos.push({
    productId:Number(productId),
    quantity:1,
    realizado:false
  });


  guardarPedidos();

  renderOrders();

}


// =========================================================
// RENDER PEDIDOS
// =========================================================

function renderOrders(){

  const container =
    document.getElementById("orderItems");

  container.innerHTML = "";

  // Eliminamos pedidos cuyo producto ya no existe.
  pedidos = pedidos.filter(order =>
    productos.some(product =>
      Number(product.id) === Number(order.productId)
    )
  );

  guardarPedidos();

  let total = 0;
  let totalCost = 0;
  let totalSale = 0;

  pedidos.forEach((order, index) => {

    const product = productos.find(p =>
      Number(p.id) === Number(order.productId)
    );

    if(!product) return;

    const quantity = Number(order.quantity) || 1;
    total += quantity;
    totalCost += Number(product.costo || 0) * quantity;
    totalSale += Number(product.venta || 0) * quantity;

    const capacity =
      product.capacidad && product.capacidad !== "Ninguno"
        ? `<div class="orderItemCapacity">${escapeHtml(product.capacidad)}</div>`
        : "";

    const ready = Boolean(order.realizado);

    const item = document.createElement("div");
    item.className = "orderItem";

    item.innerHTML = `
      <div class="orderItemTop">
        <div>
          <div class="orderItemName">${escapeHtml(product.producto)}</div>
          ${capacity}
        </div>
        <strong>× ${quantity}</strong>
      </div>

      <div class="orderItemInfo">
        ${ready ? "Pedido realizado · Listo para ingresar al stock" : "Pendiente de realizar"}
      </div>

      <div class="orderActionRow">
        <button
          class="addOrderButton ${ready ? "ready" : ""}"
          type="button"
          data-order-action="${index}"
        >
          ${ready ? "📦 Agregar al stock" : "📦 Realizar pedido"}
        </button>

        <button
          class="removeOrderButton"
          type="button"
          title="Eliminar pedido"
          aria-label="Eliminar pedido"
          data-remove-order="${index}"
        >
          −
        </button>
      </div>
    `;

    container.appendChild(item);
  });

  if(!pedidos.length){
    container.innerHTML = `<div class="empty">No tenés pedidos pendientes.</div>`;
  }

  document.getElementById("orderCalcProfit").textContent = money(totalSale - totalCost);
  document.getElementById("orderCalcCost").textContent = money(totalCost);
  document.getElementById("orderCalcSale").textContent = money(totalSale);

  const badge = document.getElementById("ordersBadge");

  if(total > 0){
    badge.textContent = total;
    badge.classList.remove("hidden");
  }else{
    badge.classList.add("hidden");
  }

}

// =========================================================
// AGREGAR PEDIDO AL STOCK
// =========================================================

document.addEventListener(
  "click",
  async e => {

    const actionButton = e.target.closest("[data-order-action]");

    if(actionButton){

      const index = Number(actionButton.dataset.orderAction);
      const order = pedidos[index];

      if(!order) return;

      // Primer toque: marcar como pedido realizado.
      if(!order.realizado){
        order.realizado = true;
        guardarPedidos();
        renderOrders();
        return;
      }

      // Segundo toque: recién ahora se permite agregar al stock.
      const productId = Number(order.productId);
      const product = productos.find(p => Number(p.id) === productId);
      const quantity = Number(order.quantity) || 0;

      if(!product || quantity <= 0) return;

      const nuevoStock = Number(product.cantidad) + quantity;

      actionButton.disabled = true;
      actionButton.textContent = "Agregando...";

      try{

        const data = await apiPost({
          accion:"editar_producto",
          id:product.id,
          proveedor_id:Number(product.proveedor_id),
          producto:product.producto,
          capacidad:product.capacidad,
          venta:Number(product.venta),
          costo:Number(product.costo),
          cantidad:nuevoStock
        });

        if(!data.ok){
          throw new Error(data.error || "No se pudo agregar al stock.");
        }

        pedidos.splice(index, 1);
        guardarPedidos();
        await cargarDatos();
        renderOrders();

      }catch(error){
        console.error(error);
        actionButton.disabled = false;
        alert(error.message || "No se pudo actualizar el stock.");
      }

      return;
    }

    const removeButton = e.target.closest("[data-remove-order]");

    if(removeButton){

      const index = Number(removeButton.dataset.removeOrder);

      if(!Number.isInteger(index) || !pedidos[index]) return;

      pedidos.splice(index, 1);
      guardarPedidos();
      renderOrders();

      return;
    }

  }
);

function renderCalculator(){

  const container =
    document.getElementById(
      "calculatorItems"
    );


  container.innerHTML = "";


  let totalCost = 0;

  let totalSale = 0;

  let totalItems = 0;


  Object.entries(
    calculator
  ).forEach(
    ([id, quantity]) => {

      const product =
        productos.find(
          p =>
            Number(p.id) ===
            Number(id)
        );


      if(!product) return;


      const qty =
        Number(quantity) || 0;


      if(qty <= 0) return;


      totalItems += qty;


      totalCost +=
        Number(product.costo) *
        qty;


      totalSale +=
        Number(product.venta) *
        qty;


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "calcItem";


      const capacity =
        product.capacidad !==
          "Ninguno"
          ? " · " +
            product.capacidad
          : "";


      item.innerHTML = `

        <div class="calcItemName">

          ${escapeHtml(product.producto)}
          ${escapeHtml(capacity)}

        </div>


        <div class="calcItemInfo">

          ${qty} × ${money(product.venta)}

        </div>

      `;


      container.appendChild(
        item
      );

    }
  );


  if(!totalItems){

    container.innerHTML =
      `<div class="empty">
        No hay productos seleccionados.
      </div>`;

  }


  const profit =
    totalSale -
    totalCost;


  document
    .getElementById(
      "calcProfit"
    )
    .textContent =
      money(profit);


  document
    .getElementById(
      "calcCost"
    )
    .textContent =
      money(totalCost);


  document
    .getElementById(
      "calcSale"
    )
    .textContent =
      money(totalSale);


  const badge =
    document.getElementById(
      "calculatorBadge"
    );


  if(totalItems > 0){

    badge.textContent =
      totalItems;

    badge.classList.remove(
      "hidden"
    );

  }else{

    badge.classList.add(
      "hidden"
    );

  }

}


// =========================================================
// VENDIDO
// =========================================================
//
// Toma todo lo que está seleccionado en la calculadora,
// verifica que haya stock suficiente y descuenta.
// =========================================================

document
  .getElementById(
    "soldCalculator"
  )
  .addEventListener(
    "click",
    async () => {


      const selected =
        Object.entries(
          calculator
        )
        .filter(
          ([id,qty]) =>
            Number(qty) > 0
        );


      if(!selected.length){

        alert(
          "No hay productos seleccionados en la calculadora."
        );

        return;
      }


      // -----------------------------------------
      // PRIMERO VERIFICAMOS TODO
      // -----------------------------------------

      for(
        const [id,qty] of selected
      ){

        const product =
          productos.find(
            p =>
              Number(p.id) ===
              Number(id)
          );


        if(!product){

          alert(
            "Uno de los productos seleccionados ya no existe."
          );

          return;
        }


        const cantidad =
          Number(qty);


        const stock =
          Number(
            product.cantidad
          );


        if(cantidad > stock){

          alert(
            `No hay suficiente stock de ${product.producto}. Stock disponible: ${stock}.`
          );

          return;
        }

      }


      // -----------------------------------------
      // CONFIRMACIÓN
      // -----------------------------------------

      const total =
        selected.reduce(
          (sum,[id,qty]) => {

            const product =
              productos.find(
                p =>
                  Number(p.id) ===
                  Number(id)
              );

            return sum +
              Number(product.venta) *
              Number(qty);

          },
          0
        );


      if(
        !confirm(
          `¿Confirmar venta por ${money(total)}?`
        )
      ){

        return;
      }


      const button =
        document.getElementById(
          "soldCalculator"
        );


      button.disabled =
        true;

      button.textContent =
        "Guardando...";


      try{

        // -----------------------------------------
        // ACTUALIZAR CADA PRODUCTO
        // -----------------------------------------

        for(
          const [id,qty] of selected
        ){

          const product =
            productos.find(
              p =>
                Number(p.id) ===
                Number(id)
            );


          const nuevoStock =
            Number(
              product.cantidad
            ) -
            Number(qty);


          const data =
            await apiPost({

              accion:
                "editar_producto",

              id:
                product.id,

              proveedor_id:
                Number(
                  product.proveedor_id
                ),

              producto:
                product.producto,

              capacidad:
                product.capacidad,

              venta:
                Number(
                  product.venta
                ),

              costo:
                Number(
                  product.costo
                ),

              cantidad:
                nuevoStock

            });


          if(!data.ok){

            throw new Error(
              data.error ||
              "No se pudo actualizar un producto."
            );

          }

        }


        // -----------------------------------------
        // LIMPIAR CALCULADORA
        // -----------------------------------------

        calculator = {};


        await cargarDatos();


        document
          .getElementById(
            "calculator"
          )
          .classList.remove(
            "open"
          );


        alert(
          "Venta registrada correctamente."
        );


      }catch(error){

        console.error(error);

        alert(
          error.message ||
          "No se pudo registrar la venta."
        );

        await cargarDatos();

      }finally{

        button.disabled =
          false;

        button.textContent =
          "✓ Vendido";

      }

    }
  );


// =========================================================
// GESTIÓN
// =========================================================
function cerrarPaneles(){
  document.getElementById("calculator").classList.remove("open");
  document.getElementById("orderDrawer").classList.remove("open");
}
function abrirGestion(){
  cerrarPaneles();
  document.getElementById("managementDrawer").classList.add("open");
  document.getElementById("managementBackdrop").classList.add("open");
}
function cerrarGestion(){
  document.getElementById("managementDrawer").classList.remove("open");
  document.getElementById("managementBackdrop").classList.remove("open");
}
document.getElementById("managementButton").addEventListener("click", abrirGestion);
document.getElementById("closeManagement").addEventListener("click", cerrarGestion);
document.getElementById("managementBackdrop").addEventListener("click", cerrarGestion);

// =========================================================
// ABRIR CALCULADORA
// =========================================================

document
  .getElementById(
    "calculatorButton"
  )
  .addEventListener(
    "click",
    () => {

      cerrarGestion();

      document
        .getElementById(
          "orderDrawer"
        )
        .classList.remove(
          "open"
        );


      document
        .getElementById(
          "calculator"
        )
        .classList.add(
          "open"
        );

    }
  );


document
  .getElementById(
    "closeCalculator"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "calculator"
        )
        .classList.remove(
          "open"
        );

    }
  );


// =========================================================
// ABRIR PEDIDOS
// =========================================================

document
  .getElementById(
    "ordersButton"
  )
  .addEventListener(
    "click",
    () => {

      cerrarGestion();

      document
        .getElementById(
          "calculator"
        )
        .classList.remove(
          "open"
        );


      renderOrders();


      document
        .getElementById(
          "orderDrawer"
        )
        .classList.add(
          "open"
        );

    }
  );


document
  .getElementById(
    "closeOrders"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "orderDrawer"
        )
        .classList.remove(
          "open"
        );

    }
  );


// =========================================================
// VACIAR CALCULADORA
// =========================================================

document
  .getElementById(
    "clearCalculator"
  )
  .addEventListener(
    "click",
    () => {

      calculator = {};

      renderProviders();

      renderCalculator();

    }
  );


// =========================================================
// LOGOUT
// =========================================================

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async () => {

      try{

        if(sessionToken){

          await apiPost({
            accion:"logout"
          });

        }

      }catch(error){

        console.error(error);

      }


      sessionStorage.removeItem(
        "stock_session"
      );


      sessionToken = null;


      showLogin();

    }
  );


// =========================================================
// CERRAR MODAL TOCANDO AFUERA
// =========================================================

document
  .getElementById(
    "modalBackdrop"
  )
  .addEventListener(
    "click",
    e => {

      if(
        e.target.id ===
        "modalBackdrop"
      ){

        closeModal();

      }

    }
  );


// =========================================================
// INICIO
// =========================================================

if(sessionToken){

  showApp();

  cargarDatos()
    .catch(
      () => showLogin()
    );

}else{

  showLogin();

}

</script>

</body>
</html>

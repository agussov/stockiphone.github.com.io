<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Stock - iPhone Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0f051d;
      --bg-card: #1a0b2e;
      --accent-purple: #7928ca;
      --gold-primary: #ffd700;
      --gold-secondary: #ff9d00;
      --text-white: #ffffff;
      --text-muted: #a093b5;
      --border-purple: #2d1847;
      --success-green: #00e676;
      --danger-red: #ff3366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-white); padding-bottom: 110px; }
    .container { max-width: 1300px; margin: 0 auto; padding: 20px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 0; border-bottom: 1px solid var(--border-purple); margin-bottom: 20px;
    }
    .brand { font-size: 1.6rem; font-weight: 800; color: var(--gold-primary); display: flex; align-items: center; gap: 10px; }
    
    .btn {
      padding: 10px 16px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem;
    }
    .btn-gold { background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary)); color: #000; }
    .btn-purple { background: var(--accent-purple); color: #fff; }
    .btn-danger { background: rgba(255, 51, 102, 0.2); color: var(--danger-red); border: 1px solid var(--danger-red); }

    .accordion {
      background: var(--bg-card); border: 1px solid var(--border-purple);
      border-radius: 12px; margin-bottom: 20px; overflow: hidden;
    }
    .accordion-header {
      padding: 16px; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; background: rgba(255, 255, 255, 0.02); color: var(--gold-primary); font-weight: 700;
    }
    .accordion-content { padding: 20px; display: none; border-top: 1px solid var(--border-purple); }
    .accordion.active .accordion-content { display: block; }

    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); }
    .form-control {
      background: #000; border: 1px solid var(--border-purple); border-radius: 6px;
      padding: 10px; color: #fff; outline: none;
    }
    .form-control:focus { border-color: var(--gold-primary); }

    .gb-group { display: flex; gap: 6px; }
    .gb-btn {
      flex: 1; padding: 8px; background: #000; border: 1px solid var(--border-purple);
      color: var(--text-muted); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem;
    }
    .gb-btn.active { background: var(--gold-primary); color: #000; border-color: var(--gold-primary); }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border-purple); border-radius: 12px; padding: 16px;
    }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-title { font-weight: 700; font-size: 1.1rem; }
    .card-sub { font-size: 0.8rem; color: var(--text-muted); }
    .badge-gb { background: rgba(255, 215, 0, 0.15); color: var(--gold-primary); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }

    .card-body { border-top: 1px dashed var(--border-purple); border-bottom: 1px dashed var(--border-purple); padding: 10px 0; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
    .stock-tag { background: rgba(255, 215, 0, 0.1); color: var(--gold-primary); font-weight: 800; padding: 2px 6px; border-radius: 4px; }

    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #080210;
      border-top: 2px solid var(--gold-primary); padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-title { font-size: 1.2rem; font-weight: 800; color: var(--gold-primary); }
    .footer-stats { display: flex; gap: 20px; }
    .stat-box { text-align: right; }
    .stat-box small { display: block; font-size: 0.7rem; color: var(--text-muted); }
    .stat-box strong { font-size: 1.1rem; color: var(--gold-primary); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand"><i class="fa-brands fa-apple"></i> iPhone Control</div>
    </header>

    <!-- PROVEEDORES -->
    <div class="accordion" id="accProv">
      <div class="accordion-header" onclick="toggleAcc('accProv')">
        <span><i class="fa-solid fa-truck"></i> 1. Desplegar / Crear Proveedores</span>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
      <div class="accordion-content">
        <form onsubmit="addProv(event)">
          <div class="grid-form">
            <div class="form-group">
              <label>Nombre Proveedor</label>
              <input type="text" id="provName" class="form-control" placeholder="Ej: Apple Directo" required>
            </div>
          </div>
          <button type="submit" class="btn btn-gold">+ Agregar Proveedor</button>
        </form>
      </div>
    </div>

    <!-- AGREGAR PRODUCTO -->
    <div class="accordion active" id="accProd">
      <div class="accordion-header" onclick="toggleAcc('accProd')">
        <span><i class="fa-solid fa-mobile"></i> 2. Ingresar iPhone / Equipo</span>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
      <div class="accordion-content">
        <form onsubmit="addProd(event)">
          <div class="grid-form">
            <div class="form-group">
              <label>Equipo / Modelo</label>
              <input type="text" id="pName" class="form-control" placeholder="Ej: iPhone 13 Pro Max" required>
            </div>
            <div class="form-group">
              <label>Proveedor</label>
              <select id="pProv" class="form-control" required></select>
            </div>
            <div class="form-group">
              <label>Capacidad</label>
              <div class="gb-group">
                <button type="button" class="gb-btn active" onclick="setGB(this, '128 GB')">128</button>
                <button type="button" class="gb-btn" onclick="setGB(this, '256 GB')">256</button>
                <button type="button" class="gb-btn" onclick="setGB(this, '512 GB')">512</button>
                <button type="button" class="gb-btn" onclick="setGB(this, '1 TB')">1TB</button>
              </div>
            </div>
            <div class="form-group">
              <label>Costo ($)</label>
              <input type="number" id="pCost" class="form-control" placeholder="0" required>
            </div>
            <div class="form-group">
              <label>Precio Venta ($)</label>
              <input type="number" id="pPrice" class="form-control" placeholder="0" required>
            </div>
            <div class="form-group">
              <label>Cantidad</label>
              <input type="number" id="pStock" class="form-control" value="1" min="1" required>
            </div>
          </div>
          <button type="submit" class="btn btn-purple">+ Cargar al Inventario</button>
        </form>
      </div>
    </div>

    <!-- TARJETAS -->
    <h3 style="color: var(--gold-primary); margin-bottom: 12px;"><i class="fa-solid fa-layer-group"></i> Inventario Actual</h3>
    <div class="products-grid" id="grid"></div>
  </div>

  <!-- BARRA INFERIOR -->
  <div class="footer-bar">
    <div class="footer-title">TOTAL DE VENTA</div>
    <div class="footer-stats">
      <div class="stat-box">
        <small>GANANCIA TOTAL</small>
        <strong style="color: var(--success-green);" id="lblProfit">$0</strong>
      </div>
      <div class="stat-box">
        <small>TOTAL VENTAS</small>
        <strong id="lblSales">$0</strong>
      </div>
    </div>
  </div>

  <script>
    let curGB = '128 GB';
    let provs = JSON.parse(localStorage.getItem('provs')) || ['Proveedor General'];
    let prods = JSON.parse(localStorage.getItem('prods')) || [];

    function init() { renderProvs(); renderProds(); }
    function toggleAcc(id) { document.getElementById(id).classList.toggle('active'); }
    function setGB(btn, val) {
      document.querySelectorAll('.gb-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      curGB = val;
    }

    function renderProvs() {
      const sel = document.getElementById('pProv');
      sel.innerHTML = '';
      provs.forEach(p => sel.innerHTML += `<option value="${p}">${p}</option>`);
    }

    function addProv(e) {
      e.preventDefault();
      const name = document.getElementById('provName').value;
      if (name && !provs.includes(name)) {
        provs.push(name);
        localStorage.setItem('provs', JSON.stringify(provs));
        renderProvs();
        document.getElementById('provName').value = '';
      }
    }

    function addProd(e) {
      e.preventDefault();
      const p = {
        id: Date.now(),
        name: document.getElementById('pName').value,
        prov: document.getElementById('pProv').value,
        gb: curGB,
        cost: parseFloat(document.getElementById('pCost').value),
        price: parseFloat(document.getElementById('pPrice').value),
        stock: parseInt(document.getElementById('pStock').value)
      };
      prods.push(p);
      localStorage.setItem('prods', JSON.stringify(prods));
      renderProds();
    }

    function delProd(id) {
      prods = prods.filter(p => p.id !== id);
      localStorage.setItem('prods', JSON.stringify(prods));
      renderProds();
    }

    function renderProds() {
      const g = document.getElementById('grid');
      g.innerHTML = '';
      let sales = 0, profit = 0;

      prods.forEach(p => {
        sales += p.price * p.stock;
        profit += (p.price - p.cost) * p.stock;
        g.innerHTML += `
          <div class="card">
            <div class="card-head">
              <div>
                <div class="card-title">${p.name}</div>
                <div class="card-sub">${p.prov}</div>
              </div>
              <span class="badge-gb">${p.gb}</span>
            </div>
            <div class="card-body">
              <div class="row"><span>Costo:</span><span>$${p.cost}</span></div>
              <div class="row"><span>Precio:</span><span style="color:var(--gold-primary);">$${p.price}</span></div>
              <div class="row"><span>Cantidad:</span><span class="stock-tag">STOCK ${p.stock}</span></div>
            </div>
            <button class="btn btn-danger" style="width:100%; justify-content:center;" onclick="delProd(${p.id})">Borrar</button>
          </div>
        `;
      });

      document.getElementById('lblSales').innerText = `$${sales.toLocaleString()}`;
      document.getElementById('lblProfit').innerText = `$${profit.toLocaleString()}`;
    }

    init();
  </script>
</body>
</html>

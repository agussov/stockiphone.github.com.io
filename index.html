<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agustín — Stock iPhone</title>

<style>
:root{
  --bg:#09090c;
  --bg2:#101016;
  --card:#15151d;
  --card2:#1b1b24;
  --border:#292934;
  --purple:#8b5cf6;
  --purple2:#a78bfa;
  --purple-dark:#6d28d9;
  --white:#f8f7ff;
  --text:#e7e5ee;
  --muted:#92909f;
  --green:#4ade80;
  --red:#f87171;
  --shadow:0 15px 45px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%, rgba(139,92,246,.13), transparent 28%),
    radial-gradient(circle at 90% 20%, rgba(109,40,217,.10), transparent 25%),
    linear-gradient(135deg,#08080b,#0d0d12 50%,#08080b);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(18px);
  background:rgba(9,9,12,.84);
  border-bottom:1px solid rgba(139,92,246,.16);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:18px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-icon{
  width:43px;
  height:43px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#8b5cf6,#5b21b6);
  box-shadow:0 0 25px rgba(139,92,246,.32);
  font-size:21px;
}

.brand h1{
  margin:0;
  font-size:20px;
  color:white;
  letter-spacing:.3px;
}

.brand span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}

.calculator-button{
  position:relative;
  width:46px;
  height:46px;
  border:1px solid #383344;
  border-radius:14px;
  background:#15131d;
  color:white;
  font-size:21px;
  transition:.2s;
}

.calculator-button:hover{
  border-color:var(--purple);
  box-shadow:0 0 20px rgba(139,92,246,.2);
}

.badge{
  position:absolute;
  right:-5px;
  top:-6px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:20px;
  background:#ef4444;
  color:white;
  font-size:11px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 18px 60px;
}

.section{
  background:rgba(18,18,24,.82);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.section-title h2{
  margin:0;
  font-size:16px;
  color:white;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}

.form-grid.product{
  grid-template-columns:1.4fr 1.2fr 1fr 1fr 1fr auto;
}

input,
select{
  width:100%;
  min-height:45px;
  border:1px solid #30303b;
  border-radius:12px;
  background:#101016;
  color:white;
  padding:0 13px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px rgba(139,92,246,.12);
}

select option{
  background:#15151d;
  color:white;
}

.btn{
  min-height:45px;
  border:none;
  border-radius:12px;
  padding:0 17px;
  color:white;
  font-weight:bold;
  transition:.2s;
}

.btn-purple{
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  box-shadow:0 7px 20px rgba(109,40,217,.22);
}

.btn-purple:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 25px rgba(139,92,246,.3);
}

.btn-gray{
  background:#24242d;
  border:1px solid #353541;
}

.btn-red{
  background:#3a171c;
  color:#fca5a5;
  border:1px solid #64242c;
}

.provider{
  border:1px solid #292934;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:14px;
  background:#111117;
}

.provider-header{
  min-height:63px;
  padding:0 14px 0 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:linear-gradient(90deg,#17151f,#121218);
}

.provider-left{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.provider-arrow{
  color:var(--purple2);
  font-size:14px;
  transition:.2s;
}

.provider-name{
  font-weight:bold;
  color:white;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.provider-count{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.dots{
  width:38px;
  height:38px;
  border:1px solid #30303b;
  border-radius:11px;
  background:#191820;
  color:#d4d0dd;
  font-size:21px;
  line-height:1;
}

.dots:hover{
  border-color:var(--purple);
  color:white;
}

.products{
  display:none;
  padding:8px;
  border-top:1px solid #292934;
}

.provider.open .products{
  display:block;
}

.provider.open .provider-arrow{
  transform:rotate(90deg);
}

.product-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  align-items:center;
  gap:14px;
  padding:14px 10px;
  border-bottom:1px solid #24242d;
}

.product-row:last-child{
  border-bottom:none;
}

.product-info{
  min-width:0;
}

.product-name{
  color:white;
  font-weight:bold;
  font-size:14px;
  margin-bottom:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.product-meta{
  color:var(--muted);
  font-size:12px;
}

.price{
  text-align:right;
  white-space:nowrap;
}

.sale{
  color:#c4b5fd;
  font-weight:bold;
  font-size:15px;
}

.cost{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.stock{
  min-width:42px;
  text-align:center;
  font-size:12px;
  color:#d4d4dc;
}

.stock.low{
  color:#fbbf24;
}

.stock.zero{
  color:#f87171;
}

.quantity-control{
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px;
  border-radius:12px;
  background:#0c0c11;
  border:1px solid #302b3b;
}

.qty-btn{
  width:32px;
  height:32px;
  border:none;
  border-radius:9px;
  background:#211a30;
  color:#c4b5fd;
  font-size:19px;
  font-weight:bold;
}

.qty-btn:hover{
  background:#6d28d9;
  color:white;
}

.qty-number{
  min-width:25px;
  text-align:center;
  color:white;
  font-weight:bold;
  font-size:13px;
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(450px,100%);
  background:#15151d;
  border:1px solid #36313f;
  border-radius:20px;
  padding:20px;
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.modal h3{
  margin:0 0 17px;
  color:white;
}

.modal-actions{
  display:flex;
  gap:9px;
  margin-top:12px;
}

.modal-actions .btn{
  flex:1;
}

.calculator-panel{
  position:fixed;
  top:0;
  right:-430px;
  z-index:80;
  width:min(430px,100%);
  height:100vh;
  background:#101016;
  border-left:1px solid #35313f;
  box-shadow:-20px 0 60px rgba(0,0,0,.45);
  transition:right .28s ease;
  display:flex;
  flex-direction:column;
}

.calculator-panel.open{
  right:0;
}

.calc-head{
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #292934;
}

.calc-head h2{
  margin:0;
  color:white;
  font-size:18px;
}

.close-calc{
  width:40px;
  height:40px;
  border-radius:11px;
  border:1px solid #34343e;
  background:#1b1b23;
  color:white;
  font-size:20px;
}

.calc-list{
  flex:1;
  overflow:auto;
  padding:12px 15px;
}

.calc-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  margin-bottom:8px;
  border-radius:13px;
  background:#17171f;
  border:1px solid #292934;
}

.calc-item-name{
  min-width:0;
}

.calc-item-name strong{
  display:block;
  color:white;
  font-size:13px;
}

.calc-item-name span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.calc-item-price{
  color:#c4b5fd;
  font-weight:bold;
  white-space:nowrap;
}

.calc-summary{
  border-top:1px solid #292934;
  padding:17px;
  background:#0c0c11;
}

.summary-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
  color:var(--muted);
  font-size:13px;
}

.summary-line strong{
  color:white;
}

.gain{
  color:var(--green)!important;
}

.total-label{
  margin-top:14px;
  color:#aaa6b7;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.total{
  color:white;
  font-size:31px;
  font-weight:bold;
  margin-top:3px;
}

.clear-calc{
  width:100%;
  margin-top:14px;
}

.message{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%) translateY(100px);
  z-index:200;
  padding:12px 18px;
  border-radius:12px;
  background:#1c1c25;
  border:1px solid #393442;
  color:white;
  box-shadow:0 12px 35px rgba(0,0,0,.4);
  opacity:0;
  transition:.25s;
  pointer-events:none;
}

.message.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

.message.error{
  border-color:#71303a;
  color:#fca5a5;
}

.loading{
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(7,7,10,.78);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
}

.loading.show{
  display:flex;
}

.loader-box{
  background:#17171f;
  border:1px solid #373140;
  border-radius:16px;
  padding:18px 25px;
  color:white;
}

@media(max-width:850px){
  .form-grid.product{
    grid-template-columns:1fr 1fr;
  }

  .form-grid.product button{
    grid-column:1/-1;
  }

  .product-row{
    grid-template-columns:minmax(0,1fr) auto;
    gap:10px;
  }

  .price{
    grid-column:2;
    grid-row:1;
  }

  .stock{
    grid-column:1;
    grid-row:2;
    text-align:left;
  }

  .quantity-control{
    grid-column:2;
    grid-row:2;
    justify-self:end;
  }
}

@media(max-width:600px){
  .header-inner{
    padding:14px;
  }

  .container{
    padding:16px 12px 45px;
  }

  .section{
    padding:14px;
    border-radius:17px;
  }

  .form-grid,
  .form-grid.product{
    grid-template-columns:1fr;
  }

  .form-grid.product button{
    grid-column:auto;
  }

  .brand h1{
    font-size:17px;
  }

  .brand span{
    font-size:11px;
  }

  .product-row{
    grid-template-columns:minmax(0,1fr) auto;
  }

  .price{
    grid-column:2;
    grid-row:1;
  }

  .stock{
    grid-column:1;
    grid-row:2;
  }

  .quantity-control{
    grid-column:2;
    grid-row:2;
  }

  .calculator-panel{
    width:100%;
    right:-100%;
  }

  .provider-header{
    padding:0 10px 0 13px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="brand">
      <div class="brand-icon">📱</div>

      <div>
        <h1>AGUSTÍN</h1>
        <span>Stock & ventas</span>
      </div>
    </div>

    <button class="calculator-button" id="openCalculator">
      🧮
      <span class="badge" id="calcBadge">0</span>
    </button>

  </div>
</header>


<main class="container">

  <!-- CREAR PROVEEDOR -->
  <section class="section">

    <div class="section-title">
      <h2>Proveedores</h2>
    </div>

    <div class="form-grid">
      <input
        id="providerName"
        type="text"
        placeholder="Nombre del proveedor"
      >

      <button class="btn btn-purple" id="createProvider">
        + Crear proveedor
      </button>
    </div>

  </section>


  <!-- AGREGAR PRODUCTO -->
  <section class="section">

    <div class="section-title">
      <h2>Agregar producto</h2>
    </div>

    <div class="form-grid product">

      <input
        id="productName"
        type="text"
        placeholder="Producto"
      >

      <select id="productProvider">
        <option value="">Seleccionar proveedor</option>
      </select>

      <input
        id="productSale"
        type="number"
        min="0"
        step="0.01"
        placeholder="Precio venta"
      >

      <input
        id="productCost"
        type="number"
        min="0"
        step="0.01"
        placeholder="Precio costo"
      >

      <input
        id="productQuantity"
        type="number"
        min="0"
        step="1"
        placeholder="Cantidad"
      >

      <button class="btn btn-purple" id="addProduct">
        + Agregar
      </button>

    </div>

  </section>


  <!-- STOCK -->
  <section class="section">

    <div class="section-title">
      <h2>Stock</h2>
    </div>

    <div id="stockContainer">
      <div class="empty">Cargando stock...</div>
    </div>

  </section>

</main>


<!-- CALCULADORA -->
<aside class="calculator-panel" id="calculatorPanel">

  <div class="calc-head">

    <h2>🧮 Calculadora</h2>

    <button class="close-calc" id="closeCalculator">
      ×
    </button>

  </div>


  <div class="calc-list" id="calculatorList">

    <div class="empty">
      No hay productos seleccionados.
    </div>

  </div>


  <div class="calc-summary">

    <div class="summary-line">
      <span>Ganancia</span>
      <strong class="gain" id="calcGain">$0</strong>
    </div>

    <div class="summary-line">
      <span>Total costo</span>
      <strong id="calcCost">$0</strong>
    </div>

    <div class="total-label">
      TOTAL DE VENTA
    </div>

    <div class="total" id="calcTotal">
      $0
    </div>

    <button class="btn btn-gray clear-calc" id="clearCalculator">
      Vaciar calculadora
    </button>

  </div>

</aside>


<!-- MODAL PROVEEDOR -->
<div class="modal-bg" id="providerModal">

  <div class="modal">

    <h3 id="providerModalTitle">
      Opciones del proveedor
    </h3>

    <input
      id="renameProviderInput"
      type="text"
      placeholder="Nuevo nombre"
    >

    <div class="modal-actions">

      <button class="btn btn-purple" id="renameProvider">
        Renombrar
      </button>

      <button class="btn btn-gray" id="closeProviderModal">
        Cancelar
      </button>

    </div>

    <div style="height:10px"></div>

    <button class="btn btn-gray" id="adjustProvider" style="width:100%">
      Ajustar precios
    </button>

    <div style="height:9px"></div>

    <button class="btn btn-red" id="deleteProvider" style="width:100%">
      Eliminar proveedor
    </button>

  </div>

</div>


<!-- MODAL PRODUCTO -->
<div class="modal-bg" id="productModal">

  <div class="modal">

    <h3>Editar producto</h3>

    <input id="editProductName" type="text" placeholder="Producto">

    <div style="height:9px"></div>

    <select id="editProductProvider"></select>

    <div style="height:9px"></div>

    <input id="editProductSale" type="number" min="0" step="0.01" placeholder="Precio venta">

    <div style="height:9px"></div>

    <input id="editProductCost" type="number" min="0" step="0.01" placeholder="Precio costo">

    <div style="height:9px"></div>

    <input id="editProductQuantity" type="number" min="0" step="1" placeholder="Cantidad">

    <div class="modal-actions">

      <button class="btn btn-purple" id="saveProduct">
        Guardar
      </button>

      <button class="btn btn-gray" id="closeProductModal">
        Cancelar
      </button>

    </div>

    <div style="height:9px"></div>

    <button class="btn btn-red" id="deleteProduct" style="width:100%">
      Eliminar producto
    </button>

  </div>

</div>


<div class="message" id="message"></div>


<div class="loading" id="loading">

  <div class="loader-box">
    Cargando...
  </div>

</div>


<script>

const API_URL =
  "https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";


let providers = [];
let products = [];

let calculator = {};

let selectedProviderId = null;
let selectedProductId = null;


/* =========================
   ELEMENTOS
========================= */

const stockContainer =
  document.getElementById("stockContainer");

const providerSelect =
  document.getElementById("productProvider");

const editProviderSelect =
  document.getElementById("editProductProvider");

const calculatorPanel =
  document.getElementById("calculatorPanel");

const calculatorList =
  document.getElementById("calculatorList");

const calcBadge =
  document.getElementById("calcBadge");

const providerModal =
  document.getElementById("providerModal");

const productModal =
  document.getElementById("productModal");

const loading =
  document.getElementById("loading");

const message =
  document.getElementById("message");


/* =========================
   UTILIDADES
========================= */

function money(value){

  return "$" + Number(value || 0).toLocaleString(
    "es-AR",
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }
  );

}


function showLoading(){

  loading.classList.add("show");

}


function hideLoading(){

  loading.classList.remove("show");

}


let messageTimer;

function showMessage(text,error=false){

  clearTimeout(messageTimer);

  message.textContent = text;

  message.classList.toggle("error",error);
  message.classList.add("show");

  messageTimer = setTimeout(()=>{
    message.classList.remove("show");
  },2500);

}


/* =========================
   API
========================= */

async function api(data){

  const response = await fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(data)
  });

  const result = await response.json();

  if(!response.ok || result.ok === false){

    throw new Error(
      result.mensaje || "Ocurrió un error"
    );

  }

  return result;

}


/* =========================
   CARGAR DATOS
========================= */

async function loadData(){

  try{

    showLoading();

    const response =
      await fetch(API_URL);

    const data =
      await response.json();

    if(!data.ok){

      throw new Error(
        data.mensaje || "No se pudieron cargar los datos"
      );

    }

    providers = data.proveedores || [];
    products = data.productos || [];

    renderProviderSelect();
    renderStock();
    renderCalculator();

  }catch(error){

    stockContainer.innerHTML =
      `<div class="empty">
        No se pudo conectar con el servidor.
        <br><br>
        ${error.message}
      </div>`;

    showMessage(error.message,true);

  }finally{

    hideLoading();

  }

}


/* =========================
   SELECT PROVEEDORES
========================= */

function renderProviderSelect(){

  providerSelect.innerHTML =
    `<option value="">Seleccionar proveedor</option>`;

  editProviderSelect.innerHTML = "";

  providers.forEach(provider => {

    const option =
      document.createElement("option");

    option.value = provider.id;
    option.textContent = provider.nombre;

    providerSelect.appendChild(option);

    const editOption =
      document.createElement("option");

    editOption.value = provider.id;
    editOption.textContent = provider.nombre;

    editProviderSelect.appendChild(editOption);

  });

}


/* =========================
   STOCK
========================= */

function renderStock(){

  if(!providers.length){

    stockContainer.innerHTML =
      `<div class="empty">
        Todavía no tenés proveedores.
      </div>`;

    return;

  }


  stockContainer.innerHTML = "";


  providers.forEach(provider => {

    const providerProducts =
      products.filter(
        p => Number(p.proveedor_id) === Number(provider.id)
      );


    const providerElement =
      document.createElement("div");

    providerElement.className = "provider";


    const header =
      document.createElement("div");

    header.className = "provider-header";


    const left =
      document.createElement("div");

    left.className = "provider-left";


    const arrow =
      document.createElement("span");

    arrow.className = "provider-arrow";

    arrow.textContent = "▶";


    const name =
      document.createElement("span");

    name.className = "provider-name";

    name.textContent = provider.nombre;


    const count =
      document.createElement("span");

    count.className = "provider-count";

    count.textContent =
      providerProducts.length +
      (providerProducts.length === 1
        ? " producto"
        : " productos");


    left.appendChild(arrow);
    left.appendChild(name);
    left.appendChild(count);


    const dots =
      document.createElement("button");

    dots.className = "dots";

    dots.textContent = "⋮";

    dots.type = "button";


    header.appendChild(left);
    header.appendChild(dots);


    const productContainer =
      document.createElement("div");

    productContainer.className = "products";


    providerProducts.forEach(product => {

      productContainer.appendChild(
        createProductRow(product)
      );

    });


    if(!providerProducts.length){

      productContainer.innerHTML =
        `<div class="empty">
          Este proveedor no tiene productos.
        </div>`;

    }


    providerElement.appendChild(header);
    providerElement.appendChild(productContainer);

    stockContainer.appendChild(providerElement);


    header.addEventListener("click",(event)=>{

      if(event.target === dots ||
         dots.contains(event.target)){

        return;

      }

      providerElement.classList.toggle("open");

    });


    dots.addEventListener("click",()=>{

      openProviderMenu(provider);

    });

  });

}


/* =========================
   PRODUCTO
========================= */

function createProductRow(product){

  const row =
    document.createElement("div");

  row.className = "product-row";


  const info =
    document.createElement("div");

  info.className = "product-info";


  const productName =
    document.createElement("div");

  productName.className = "product-name";

  productName.textContent =
    product.producto;


  const meta =
    document.createElement("div");

  meta.className = "product-meta";

  meta.textContent =
    "Costo " + money(product.costo);


  info.appendChild(productName);
  info.appendChild(meta);


  const price =
    document.createElement("div");

  price.className = "price";

  price.innerHTML =
    `<div class="sale">${money(product.venta)}</div>
     <div class="cost">venta</div>`;


  const stock =
    document.createElement("div");

  stock.className = "stock";

  if(Number(product.cantidad) <= 0){

    stock.classList.add("zero");

  }else if(Number(product.cantidad) <= 2){

    stock.classList.add("low");

  }

  stock.textContent =
    "Stock: " + product.cantidad;


  /* CONTROL − 0 + */

  const quantityControl =
    document.createElement("div");

  quantityControl.className =
    "quantity-control";


  const minus =
    document.createElement("button");

  minus.type = "button";
  minus.className = "qty-btn";
  minus.textContent = "−";


  const number =
    document.createElement("span");

  number.className = "qty-number";


  const plus =
    document.createElement("button");

  plus.type = "button";
  plus.className = "qty-btn";
  plus.textContent = "+";


  const currentQuantity =
    calculator[product.id] || 0;

  number.textContent =
    currentQuantity;


  minus.addEventListener("click",()=>{

    changeCalculatorQuantity(
      product.id,
      -1
    );

  });


  plus.addEventListener("click",()=>{

    changeCalculatorQuantity(
      product.id,
      1
    );

  });


  quantityControl.appendChild(minus);
  quantityControl.appendChild(number);
  quantityControl.appendChild(plus);


  /* MENÚ DEL PRODUCTO */

  const dots =
    document.createElement("button");

  dots.type = "button";
  dots.className = "dots";
  dots.textContent = "⋮";


  dots.addEventListener("click",()=>{

    openProductMenu(product);

  });


  row.appendChild(info);
  row.appendChild(price);
  row.appendChild(stock);
  row.appendChild(quantityControl);

  /*
    El menú de tres puntos queda dentro
    de la información cuando la pantalla
    es chica, mediante un wrapper visual.
  */

  info.style.position = "relative";

  const menuButtonWrapper =
    document.createElement("div");

  menuButtonWrapper.style.position = "absolute";
  menuButtonWrapper.style.right = "0";
  menuButtonWrapper.style.top = "0";

  menuButtonWrapper.appendChild(dots);

  info.appendChild(menuButtonWrapper);

  productName.style.paddingRight = "45px";


  return row;

}


/* =========================
   CALCULADORA
========================= */

function changeCalculatorQuantity(
  productId,
  change
){

  const product =
    products.find(
      p => Number(p.id) === Number(productId)
    );

  if(!product) return;


  const current =
    calculator[productId] || 0;

  let next =
    current + change;


  if(next < 0){

    next = 0;

  }


  if(next > Number(product.cantidad)){

    next = Number(product.cantidad);

    showMessage(
      "No hay más unidades disponibles",
      true
    );

  }


  if(next === 0){

    delete calculator[productId];

  }else{

    calculator[productId] = next;

  }


  renderStock();
  renderCalculator();

}


function renderCalculator(){

  const entries =
    Object.entries(calculator);


  const totalUnits =
    entries.reduce(
      (sum,[,quantity]) =>
        sum + Number(quantity),
      0
    );


  calcBadge.textContent =
    totalUnits;


  if(!entries.length){

    calculatorList.innerHTML =
      `<div class="empty">
        No hay productos seleccionados.
      </div>`;

  }else{

    calculatorList.innerHTML = "";


    entries.forEach(
      ([productId,quantity])=>{

        const product =
          products.find(
            p => Number(p.id) === Number(productId)
          );

        if(!product) return;


        const item =
          document.createElement("div");

        item.className = "calc-item";


        const name =
          document.createElement("div");

        name.className =
          "calc-item-name";

        name.innerHTML =
          `<strong>${escapeHtml(product.producto)}</strong>
           <span>${quantity} × ${money(product.venta)}</span>`;


        const subtotal =
          document.createElement("div");

        subtotal.className =
          "calc-item-price";

        subtotal.textContent =
          money(
            Number(product.venta) *
            Number(quantity)
          );


        item.appendChild(name);
        item.appendChild(subtotal);

        calculatorList.appendChild(item);

      }
    );

  }


  let totalSale = 0;
  let totalCost = 0;


  entries.forEach(
    ([productId,quantity])=>{

      const product =
        products.find(
          p => Number(p.id) === Number(productId)
        );

      if(!product) return;


      totalSale +=
        Number(product.venta) *
        Number(quantity);

      totalCost +=
        Number(product.costo) *
        Number(quantity);

    }
  );


  const gain =
    totalSale - totalCost;


  document.getElementById("calcGain")
    .textContent = money(gain);

  document.getElementById("calcCost")
    .textContent = money(totalCost);

  document.getElementById("calcTotal")
    .textContent = money(totalSale);

}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

document

  .addEventListener("click",async()=>{

    const value =
      prompt(
        "¿Cuánto querés sumar o restar a todos los precios?\n\nEjemplo: +20 o -20\nMáximo: 1000"
      );


    if(value === null) return;


    const amount =
      Number(value);


    if(!Number.isFinite(amount) ||
       Math.abs(amount) > 1000){

      showMessage(
        "El monto debe estar entre -1000 y 1000",
        true
      );

      return;

    }


    if(amount === 0){

      showMessage(
        "No se realizó ningún cambio"
      );

      return;

    }


    try{

      showLoading();

      await api({
        accion:"ajustar_precios",
        proveedor_id:selectedProviderId,
        monto:amount
      });


      providerModal.classList.remove("show");

      showMessage(
        "Precios actualizados"
      );

      await loadData();

    }catch(error){

      showMessage(
        error.message,
        true
      );

    }finally{

      hideLoading();

    }

  });

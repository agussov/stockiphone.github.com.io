<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Stock iPhone</title>

<style>
:root{
  --bg:#171124;
  --bg2:#211735;
  --panel:#251b3a;
  --panel2:#2b2043;
  --border:#49355f;

  --gold:#d8b35a;
  --gold2:#f0d27b;

  --text:#ffffff;
  --muted:#aaa2b8;

  --green:#62d39b;
  --red:#e77878;

  --shadow:0 12px 35px rgba(0,0,0,.30);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(
      circle at top,
      #302047 0%,
      var(--bg) 48%,
      #120d1c 100%
    );
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}


/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:360px;
  padding:30px;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(37,27,58,.92);
  box-shadow:var(--shadow);
  backdrop-filter:blur(15px);
}

.login-logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:6px;
}

.login-sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:25px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  height:42px;
  padding:0 12px;
  color:white;
  background:#171222;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--gold);
}

.login-button{
  width:100%;
  height:43px;
  border:0;
  border-radius:11px;
  background:linear-gradient(
    135deg,
    var(--gold),
    var(--gold2)
  );
  color:#241a08;
  font-weight:800;
}

.login-error{
  min-height:18px;
  margin-top:12px;
  color:var(--red);
  font-size:13px;
  text-align:center;
}


/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:22px 18px 60px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}

.brand{
  display:flex;
  flex-direction:column;
}

.brand-title{
  font-size:25px;
  line-height:1.1;
  font-weight:850;
  letter-spacing:-.5px;
}

.brand-title span{
  color:var(--gold2);
}

.brand-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.header-actions{
  display:flex;
  gap:8px;
}


/* =========================
   BUTTONS
========================= */

.btn{
  border:1px solid var(--border);
  border-radius:10px;
  height:38px;
  padding:0 13px;
  color:white;
  background:#2a203d;
  font-size:13px;
  font-weight:700;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:var(--gold);
}

.btn-gold{
  background:linear-gradient(
    135deg,
    #c99e42,
    #ebca70
  );
  color:#251b0b;
  border-color:#e3c36c;
}

.btn-small{
  height:30px;
  padding:0 9px;
  font-size:12px;
}


/* =========================
   SEARCH
========================= */

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  height:40px;
  border-radius:11px;
  border:1px solid var(--border);
  background:rgba(24,17,37,.9);
  color:white;
  padding:0 13px;
  outline:none;
}

.search input:focus{
  border-color:var(--gold);
}

.search input::placeholder{
  color:#777082;
}


/* =========================
   EMPTY
========================= */

.empty{
  border:1px dashed var(--border);
  border-radius:16px;
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  background:rgba(37,27,58,.5);
}

.empty-title{
  color:white;
  font-weight:700;
  margin-bottom:6px;
}

.empty-text{
  font-size:13px;
}


/* =========================
   PROVIDER
========================= */

.provider{
  background:rgba(37,27,58,.88);
  border:1px solid var(--border);
  border-radius:17px;
  margin-bottom:15px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.provider-head{
  min-height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 13px;
  background:
    linear-gradient(
      90deg,
      rgba(216,179,90,.10),
      rgba(216,179,90,.02)
    );
  border-bottom:1px solid var(--border);
}

.provider-name{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.provider-icon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:rgba(216,179,90,.12);
  color:var(--gold2);
  font-weight:800;
  font-size:13px;
}

.provider-title{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.provider-actions{
  display:flex;
  gap:5px;
}

.icon-btn{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:8px;
  background:#211830;
  color:#d5cedf;
  font-size:13px;
}

.icon-btn:hover{
  border-color:var(--gold);
  color:var(--gold2);
}


/* =========================
   PRODUCTS
========================= */

.products{
  padding:4px 9px 9px;
}

.product{
  display:grid;

  grid-template-columns:
    24px
    minmax(150px,1.6fr)
    90px
    95px
    120px
    105px;

  align-items:center;
  gap:9px;

  min-height:58px;

  padding:8px 6px;

  border-bottom:1px solid rgba(73,53,95,.55);
}

.product:last-child{
  border-bottom:0;
}

.product:hover{
  background:rgba(255,255,255,.025);
  border-radius:9px;
}

.drag{
  color:#766c83;
  cursor:grab;
  font-size:16px;
  text-align:center;
}

.product-main{
  min-width:0;
}

.product-name{
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-capacity{
  display:inline-block;
  margin-top:3px;
  padding:2px 6px;
  border-radius:5px;
  background:#352849;
  color:#c7bdd2;
  font-size:10px;
}

.price{
  font-size:12px;
}

.price-label{
  display:block;
  color:#81768d;
  font-size:9px;
  text-transform:uppercase;
  margin-bottom:2px;
}

.price-value{
  font-weight:700;
}

.stock{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.stock button{
  width:27px;
  height:27px;
  padding:0;
  border-radius:7px;
  border:1px solid var(--border);
  background:#211830;
  color:white;
  font-weight:800;
}

.stock button:hover{
  border-color:var(--gold);
}

.stock-number{
  min-width:25px;
  text-align:center;
  font-size:13px;
  font-weight:800;
}

.stock-zero{
  color:var(--red);
}

.product-actions{
  display:flex;
  justify-content:flex-end;
  gap:5px;
}

.add-product{
  margin:5px 6px 2px;
  width:calc(100% - 12px);
  height:32px;
  border:1px dashed var(--border);
  border-radius:8px;
  background:transparent;
  color:var(--gold2);
  font-size:12px;
  font-weight:700;
}

.add-product:hover{
  background:rgba(216,179,90,.07);
  border-color:var(--gold);
}


/* =====================================================
   CALCULADORA LATERAL
===================================================== */

.calc-overlay{
  position:fixed;
  inset:0;
  z-index:100;

  background:rgba(5,3,10,.48);

  opacity:0;
  pointer-events:none;

  transition:.22s;
}

.calc-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.calc-panel{
  position:fixed;
  top:0;
  right:0;

  width:390px;
  max-width:94vw;
  height:100vh;

  z-index:101;

  display:flex;
  flex-direction:column;

  background:
    linear-gradient(
      180deg,
      #2b2043 0%,
      #211832 100%
    );

  border-left:1px solid var(--border);

  box-shadow:
    -15px 0 45px rgba(0,0,0,.40);

  transform:translateX(100%);
  transition:.25s ease;
}

.calc-panel.open{
  transform:translateX(0);
}


/* calculator header */

.calc-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:17px 18px;

  border-bottom:1px solid var(--border);
}

.calc-title{
  font-size:18px;
  font-weight:850;
}

.calc-subtitle{
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}

.calc-close{
  width:34px;
  height:34px;

  border:1px solid var(--border);
  border-radius:9px;

  background:#1b1429;
  color:white;

  font-size:20px;
}


/* selected products */

.calc-products{
  flex:1;
  overflow:auto;
  padding:12px 14px;
}

.calc-empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.calc-item{
  padding:11px;

  margin-bottom:8px;

  border:1px solid var(--border);
  border-radius:12px;

  background:rgba(20,14,31,.38);
}

.calc-item-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.calc-item-name{
  min-width:0;
}

.calc-item-product{
  font-size:13px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.calc-item-capacity{
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
}

.calc-item-price{
  text-align:right;
  white-space:nowrap;
  color:var(--gold2);
  font-size:12px;
  font-weight:700;
}

.calc-item-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:9px;
}

.calc-stock{
  color:var(--muted);
  font-size:10px;
}

.calc-stock strong{
  color:white;
}

.calc-qty{
  display:flex;
  align-items:center;
  gap:6px;
}

.calc-qty button{
  width:28px;
  height:28px;

  border:1px solid var(--border);
  border-radius:7px;

  background:#302345;
  color:white;

  font-weight:800;
}

.calc-qty button:hover{
  border-color:var(--gold);
}

.calc-qty-number{
  min-width:22px;
  text-align:center;
  font-size:13px;
  font-weight:800;
}


/* totals */

.calc-summary{
  padding:14px 17px 18px;

  border-top:1px solid var(--border);

  background:
    rgba(17,11,27,.35);
}


/* SALE - BIG */

.total-sale{
  display:flex;
  align-items:end;
  justify-content:space-between;

  padding-bottom:13px;
  margin-bottom:12px;

  border-bottom:1px solid rgba(73,53,95,.65);
}

.total-sale-label{
  color:white;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
}

.total-sale-value{
  color:white;
  font-size:31px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}


/* cost / profit */

.total-small{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:7px;
}

.total-small-label{
  color:var(--gold2);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
}

.total-small-value{
  color:var(--gold2);
  font-size:15px;
  font-weight:800;
}


/* clear */

.calc-clear{
  width:100%;
  height:36px;

  margin-top:13px;

  border:1px solid var(--border);
  border-radius:9px;

  background:#211830;
  color:#aaa2b8;

  font-size:11px;
  font-weight:700;
}

.calc-clear:hover{
  border-color:var(--red);
  color:white;
}


/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:150;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px;

  background:rgba(8,5,14,.72);
  backdrop-filter:blur(7px);
}

.modal{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;

  border:1px solid var(--border);
  border-radius:18px;

  background:#251b3a;
  box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 17px;
  border-bottom:1px solid var(--border);
}

.modal-title{
  font-size:16px;
  font-weight:800;
}

.modal-close{
  width:30px;
  height:30px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#1b1429;
  color:white;
}

.modal-body{
  padding:17px;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:13px 17px;
  border-top:1px solid var(--border);
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .app{
    padding:16px 11px 45px;
  }

  .header{
    align-items:flex-start;
  }

  .brand-title{
    font-size:22px;
  }

  .header-actions{
    flex-direction:column;
  }

  .header-actions .btn{
    height:34px;
    font-size:11px;
  }

  .toolbar{
    flex-direction:column;
  }

  .product{
    grid-template-columns:
      20px
      minmax(120px,1fr)
      80px
      90px;

    gap:6px;
  }

  .product .price:nth-of-type(2){
    display:none;
  }

  .product-actions{
    grid-column:2 / -1;
    justify-content:flex-end;
  }

  .stock{
    justify-content:flex-start;
  }

  .provider-title{
    max-width:170px;
  }

  .calc-panel{
    width:390px;
    max-width:100vw;
  }

}
</style>
</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen" class="login-screen">

  <div class="login-box">

    <div class="login-logo">
      Stock iPhone
    </div>

    <div class="login-sub">
      Panel de administración
    </div>

    <form id="loginForm">

      <div class="field">
        <label>Usuario</label>

        <input
          id="loginUser"
          type="text"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label>Contraseña</label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        class="login-button"
        type="submit"
      >
        INGRESAR
      </button>

      <div
        id="loginError"
        class="login-error"
      ></div>

    </form>

  </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<main
  id="app"
  class="app hidden"
>

  <header class="header">

    <div class="brand">

      <div class="brand-title">
        Agustín · <span>Stock iPhone</span>
      </div>

      <div class="brand-sub">
        Control de productos, costos y stock
      </div>

    </div>


    <div class="header-actions">

      <button
        id="btnProveedor"
        class="btn btn-gold"
      >
        ＋ Proveedor
      </button>

      <button
        id="btnProducto"
        class="btn"
      >
        ＋ Producto
      </button>

      <button
        id="btnCalculadora"
        class="btn"
      >
        🧮 Calculadora
      </button>

    </div>

  </header>


  <div class="toolbar">

    <div class="search">

      <input
        id="buscar"
        type="search"
        placeholder="Buscar iPhone, capacidad o proveedor..."
      >

    </div>

  </div>


  <section id="stockContainer"></section>

</main>


<!-- =====================================================
     CALCULADORA LATERAL
===================================================== -->

<div
  id="calcOverlay"
  class="calc-overlay"
></div>


<aside
  id="calcPanel"
  class="calc-panel"
>

  <div class="calc-header">

    <div>

      <div class="calc-title">
        Venta
      </div>

      <div class="calc-subtitle">
        Equipos seleccionados
      </div>

    </div>

    <button
      id="calcClose"
      class="calc-close"
    >
      ×
    </button>

  </div>


  <div
    id="calcProducts"
    class="calc-products"
  ></div>


  <div class="calc-summary">

    <div class="total-sale">

      <div class="total-sale-label">
        Venta
      </div>

      <div
        id="calcVenta"
        class="total-sale-value"
      >
        $0
      </div>

    </div>


    <div class="total-small">

      <div class="total-small-label">
        Costo
      </div>

      <div
        id="calcCosto"
        class="total-small-value"
      >
        $0
      </div>

    </div>


    <div class="total-small">

      <div class="total-small-label">
        Ganancia
      </div>

      <div
        id="calcGanancia"
        class="total-small-value"
      >
        $0
      </div>

    </div>


    <button
      id="calcClear"
      class="calc-clear"
    >
      Vaciar calculadora
    </button>

  </div>

</aside>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modalBackdrop"
  class="modal-backdrop hidden"
>

  <div class="modal">

    <div class="modal-head">

      <div
        id="modalTitle"
        class="modal-title"
      >
        Ventana
      </div>

      <button
        id="modalClose"
        class="modal-close"
      >
        ×
      </button>

    </div>

    <div
      id="modalBody"
      class="modal-body"
    ></div>

    <div
      id="modalFooter"
      class="modal-footer"
    ></div>

  </div>

</div>


<script>

const API =
  "https://noisy-sound-2a71.agus-eloy-oviedo.workers.dev";


let proveedores = [];
let productos = [];

let draggedProduct = null;


/*
  CALCULADORA

  Guarda únicamente las unidades seleccionadas
  para la venta.

  Ejemplo:

  {
    15: 2,
    23: 1
  }

  significa:

  producto 15 → 2 unidades
  producto 23 → 1 unidad
*/

let calculadora = {};


const $ = id =>
  document.getElementById(id);


function escapeHTML(text){

  return String(text ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function dinero(valor){

  return new Intl.NumberFormat(
    "es-AR",
    {
      style:"currency",
      currency:"ARS",
      maximumFractionDigits:0
    }
  ).format(Number(valor) || 0);

}


/* =====================================================
   LOGIN
===================================================== */

$("loginForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    $("loginError").textContent = "";

    try{

      const response =
        await fetch(
          API + "/login",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },
            body:JSON.stringify({

              usuario:
                $("loginUser")
                  .value
                  .trim(),

              password:
                $("loginPassword")
                  .value

            })
          }
        );


      const result =
        await response.json();


      if(
        !response.ok ||
        result.ok === false
      ){

        throw new Error(
          result.error ||
          "Usuario o contraseña incorrectos"
        );

      }


      $("loginScreen")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      await cargarStock();

    }
    catch(error){

      $("loginError")
        .textContent =
          error.message;

    }

  }
);


/* =====================================================
   STOCK
===================================================== */

async function cargarStock(){

  try{

    const response =
      await fetch(
        API + "/stock"
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      result.ok === false
    ){

      throw new Error(
        result.error ||
        "No se pudo cargar el stock"
      );

    }


    proveedores =
      result.proveedores || [];

    productos =
      result.productos || [];


    /*
      Si algún producto fue eliminado,
      lo sacamos de la calculadora.
    */

    const ids =
      new Set(
        productos.map(
          p => Number(p.id)
        )
      );


    Object.keys(calculadora)
      .forEach(id => {

        if(!ids.has(Number(id))){

          delete calculadora[id];

        }

      });


    render();

    renderCalculadora();

  }
  catch(error){

    $("stockContainer").innerHTML = `

      <div class="empty">

        <div class="empty-title">
          No se pudo cargar el stock
        </div>

        <div class="empty-text">
          ${escapeHTML(error.message)}
        </div>

      </div>

    `;

  }

}


/* =====================================================
   API
===================================================== */

async function apiPost(data){

  const response =
    await fetch(
      API,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify(data)
      }
    );


  let result;

  try{

    result =
      await response.json();

  }
  catch{

    throw new Error(
      "El servidor devolvió una respuesta inválida"
    );

  }


  if(
    !response.ok ||
    result.ok === false
  ){

    throw new Error(
      result.error ||
      "Error del servidor"
    );

  }


  return result;

}

/* =====================================================
   CALCULADORA
===================================================== */

function agregarCalculadora(id){

  const producto =
    productos.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!producto){
    return;
  }


  const stock =
    Math.max(
      0,
      Number(producto.cantidad) || 0
    );


  const actual =
    Number(
      calculadora[id] || 0
    );


  /*
    No dejamos agregar más unidades
    de las que existen en stock.
  */

  if(actual >= stock){

    alert(
      `No hay más stock disponible de ${producto.producto}.`
    );

    return;

  }


  calculadora[id] =
    actual + 1;


  render();

  renderCalculadora();

  abrirCalculadora();

}


function quitarCalculadora(id){

  const actual =
    Number(
      calculadora[id] || 0
    );


  if(actual <= 0){
    return;
  }


  if(actual === 1){

    delete calculadora[id];

  }
  else{

    calculadora[id] =
      actual - 1;

  }


  render();

  renderCalculadora();

}


function renderCalculadora(){

  const container =
    $("calcProducts");


  const seleccionados =
    productos.filter(
      p =>
        Number(
          calculadora[p.id] || 0
        ) > 0
    );


  if(!seleccionados.length){

    container.innerHTML = `

      <div class="calc-empty">

        <div style="
          font-size:25px;
          margin-bottom:10px;
        ">
          🛒
        </div>

        Todavía no agregaste equipos.

        <div style="
          margin-top:6px;
          font-size:11px;
        ">
          Usá + en los productos para agregarlos.
        </div>

      </div>

    `;

  }
  else{

    container.innerHTML =
      seleccionados
        .map(
          p =>
            calculadoraProductoHTML(p)
        )
        .join("");

  }


  calcularTotales();

}


function calculadoraProductoHTML(p){

  const cantidad =
    Number(
      calculadora[p.id] || 0
    );


  const stock =
    Number(
      p.cantidad || 0
    );


  const subtotal =
    cantidad *
    (Number(p.venta) || 0);


  return `

    <div class="calc-item">

      <div class="calc-item-top">

        <div class="calc-item-name">

          <div class="calc-item-product">
            ${escapeHTML(p.producto)}
          </div>

          <div class="calc-item-capacity">
            ${escapeHTML(p.capacidad || "Ninguno")}
          </div>

        </div>


        <div class="calc-item-price">
          ${dinero(subtotal)}
        </div>

      </div>


      <div class="calc-item-bottom">

        <div class="calc-stock">
          Stock disponible:
          <strong>${stock}</strong>
        </div>


        <div class="calc-qty">

          <button
            onclick="quitarCalculadora(${p.id})"
          >
            −
          </button>

          <div class="calc-qty-number">
            ${cantidad}
          </div>

          <button
            onclick="agregarCalculadora(${p.id})"
          >
            +
          </button>

        </div>

      </div>

    </div>

  `;

}


function calcularTotales(){

  let venta = 0;
  let costo = 0;


  Object.keys(calculadora)
    .forEach(id => {

      const cantidad =
        Number(
          calculadora[id] || 0
        );


      const producto =
        productos.find(
          p =>
            Number(p.id) ===
            Number(id)
        );


      if(!producto){
        return;
      }


      venta +=
        cantidad *
        (Number(producto.venta) || 0);


      costo +=
        cantidad *
        (Number(producto.costo) || 0);

    });


  const ganancia =
    venta - costo;


  $("calcVenta")
    .textContent =
      dinero(venta);


  $("calcCosto")
    .textContent =
      dinero(costo);


  $("calcGanancia")
    .textContent =
      dinero(ganancia);

}

/* =====================================================
   DRAG & DROP
===================================================== */

function activarDragDrop(){

  document
    .querySelectorAll(".product")
    .forEach(element => {

      element.addEventListener(
        "dragstart",
        () => {

          draggedProduct =
            element;

          element.style.opacity =
            ".45";

        }
      );


      element.addEventListener(
        "dragend",
        () => {

          element.style.opacity =
            "1";

          draggedProduct =
            null;

        }
      );


      element.addEventListener(
        "dragover",
        event => {

          event.preventDefault();

        }
      );


      element.addEventListener(
        "drop",
        async event => {

          event.preventDefault();


          if(
            !draggedProduct ||
            draggedProduct === element
          ){
            return;
          }


          const container =
            element.parentElement;


          const items =
            [
              ...container
                .querySelectorAll(".product")
            ];


          const from =
            items.indexOf(
              draggedProduct
            );


          const to =
            items.indexOf(
              element
            );


          if(from < to){

            container.insertBefore(
              draggedProduct,
              element.nextSibling
            );

          }
          else{

            container.insertBefore(
              draggedProduct,
              element
            );

          }


          const ids =
            [
              ...container
                .querySelectorAll(".product")
            ]
            .map(
              el =>
                Number(
                  el.dataset.id
                )
            );


          const proveedorId =
            Number(
              container.dataset.products
            );


          try{

            await apiPost({

              accion:
                "ordenar_productos",

              proveedor_id:
                proveedorId,

              ids

            });


            await cargarStock();

          }
          catch(error){

            alert(
              error.message
            );

            await cargarStock();

          }

        }
      );

    });

}

/* =====================================================
   AJUSTAR PRECIOS
===================================================== */

async function ajustarPrecios(id){

  const proveedor =
    proveedores.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!proveedor){
    return;
  }


  const monto =
    prompt(
      `Modificar precios de ${proveedor.nombre}\n\n` +
      `Ejemplo: 10000 suma $10.000\n` +
      `Ejemplo: -5000 resta $5.000`,
      "0"
    );


  if(monto === null){
    return;
  }


  const numero =
    Number(monto);


  if(!Number.isFinite(numero)){

    alert(
      "Monto inválido."
    );

    return;

  }


  const tipo =
    prompt(
      "Escribí:\n\n" +
      "COSTO\n" +
      "VENTA\n" +
      "AMBOS",
      "VENTA"
    );


  if(tipo === null){
    return;
  }


  const valor =
    tipo
      .trim()
      .toUpperCase();


  const modificarCosto =
    valor === "COSTO" ||
    valor === "AMBOS";


  const modificarVenta =
    valor === "VENTA" ||
    valor === "AMBOS";


  if(
    !modificarCosto &&
    !modificarVenta
  ){

    alert(
      "Escribí COSTO, VENTA o AMBOS."
    );

    return;

  }


  try{

    await apiPost({

      accion:
        "ajustar_precios",

      proveedor_id:
        id,

      monto:
        numero,

      costo:
        modificarCosto,

      venta:
        modificarVenta

    });


    await cargarStock();

  }
  catch(error){

    alert(error.message);

  }

}

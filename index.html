<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock iPhone</title>

<style>
:root{
  --bg:#09070f;
  --bg2:#110c1d;
  --panel:#171122;
  --panel2:#201631;
  --panel3:#261a39;
  --border:#3b2a52;

  --gold:#e7b93f;
  --gold2:#f4d267;

  --violet:#8b5cf6;
  --violet2:#6d3de8;

  --text:#ffffff;
  --muted:#aaa3b7;

  --green:#53d769;
  --red:#ff5c6c;

  --shadow:0 15px 45px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(112,57,180,.20),transparent 35%),
    radial-gradient(circle at bottom right,rgba(80,35,130,.18),transparent 35%),
    var(--bg);
  color:var(--text);
}

/* =========================
   GENERAL
========================= */

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.container{
  width:min(1120px,calc(100% - 28px));
  margin:auto;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:min(420px,100%);
  background:linear-gradient(145deg,#171020,#241633);
  border:1px solid var(--border);
  border-radius:26px;
  padding:34px;
  box-shadow:var(--shadow);
}

.login-logo{
  text-align:center;
  margin-bottom:30px;
}

.login-logo .small{
  color:#fff;
  font-size:17px;
  margin-bottom:3px;
}

.login-logo .big{
  color:var(--gold);
  font-size:34px;
  font-weight:800;
  letter-spacing:-1px;
}

.input-group{
  margin-bottom:16px;
}

.input-group label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}

.input{
  width:100%;
  background:#0d0a13;
  border:1px solid var(--border);
  color:#fff;
  border-radius:12px;
  padding:13px 14px;
  outline:none;
}

.input:focus{
  border-color:var(--violet);
  box-shadow:0 0 0 3px rgba(139,92,246,.12);
}

.login-button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:8px;
  background:linear-gradient(135deg,var(--violet),var(--violet2));
  color:#fff;
  font-weight:700;
  font-size:15px;
}

.login-error{
  min-height:20px;
  color:#ff6978;
  font-size:13px;
  margin-top:13px;
  text-align:center;
}

/* =========================
   APP HEADER
========================= */

#app{
  padding:25px 0 100px;
}

.topbar{
  position:relative;
  text-align:center;
  margin-bottom:28px;
}

.brand{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
}

.brand-script{
  color:#fff;
  font-size:22px;
  font-style:italic;
  font-family:cursive;
  line-height:1;
}

.brand-main{
  color:var(--gold);
  font-size:32px;
  font-weight:900;
  letter-spacing:-1px;
}

.logout{
  position:absolute;
  right:0;
  top:8px;
  background:transparent;
  color:var(--muted);
  border:0;
  padding:7px 10px;
}

.logout:hover{
  color:#fff;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:22px;
}

.search{
  flex:1;
  background:var(--panel);
  border:1px solid var(--border);
  color:#fff;
  padding:13px 15px;
  border-radius:13px;
  outline:none;
}

.search:focus{
  border-color:var(--violet);
}

.primary{
  border:0;
  color:#fff;
  background:linear-gradient(135deg,var(--violet),var(--violet2));
  border-radius:13px;
  padding:13px 17px;
  font-weight:700;
  white-space:nowrap;
}

/* =========================
   PROVIDERS
========================= */

.provider{
  background:linear-gradient(145deg,var(--panel),#120d1b);
  border:1px solid var(--border);
  border-radius:19px;
  margin-bottom:17px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.provider-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:17px 18px;
}

.provider-arrow{
  width:28px;
  height:28px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

.provider.collapsed .provider-arrow{
  transform:rotate(-90deg);
}

.provider-name{
  flex:1;
  color:var(--gold);
  font-size:18px;
  font-weight:800;
}

.provider-actions{
  display:flex;
  gap:6px;
}

.small-btn{
  border:1px solid var(--border);
  background:var(--panel2);
  color:#ddd;
  border-radius:9px;
  padding:7px 10px;
  font-size:12px;
}

.small-btn:hover{
  border-color:var(--violet);
  color:#fff;
}

.provider-content{
  padding:0 14px 15px;
}

.provider.collapsed .provider-content{
  display:none;
}

/* =========================
   PRODUCTS
========================= */

.products{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.product{
  position:relative;
  display:grid;
  grid-template-columns:minmax(130px,1.5fr) 110px 120px 120px 90px auto;
  align-items:center;
  gap:12px;
  background:linear-gradient(145deg,#1c1428,#171121);
  border:1px solid #322442;
  border-radius:14px;
  padding:13px 14px;
  transition:.15s;
}

.product:hover{
  border-color:#513b70;
}

.product.dragging{
  opacity:.45;
  border-color:var(--gold);
}

.product.drag-over{
  border-color:var(--violet);
  transform:translateY(-2px);
}

.drag{
  color:#71687e;
  font-size:18px;
  cursor:grab;
  margin-right:5px;
}

.product-info{
  display:flex;
  align-items:center;
  min-width:0;
}

.product-title{
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.capacity{
  color:var(--gold);
  font-size:12px;
  margin-top:3px;
}

.label{
  color:#777080;
  font-size:10px;
  text-transform:uppercase;
  margin-bottom:3px;
}

.value{
  color:#fff;
  font-weight:700;
}

.cost{
  color:#aaa;
}

.sale{
  color:#fff;
  font-size:16px;
}

.stock{
  display:flex;
  align-items:center;
  gap:6px;
}

.stock-number{
  min-width:27px;
  text-align:center;
  font-weight:800;
}

.stock-btn{
  width:27px;
  height:27px;
  border:1px solid var(--border);
  background:#17111f;
  color:#fff;
  border-radius:8px;
}

.stock-btn:hover{
  border-color:var(--violet);
}

.product-menu{
  border:0;
  background:transparent;
  color:#aaa;
  font-size:20px;
}

.product-menu:hover{
  color:#fff;
}

.add-product{
  width:100%;
  margin-top:11px;
  border:1px dashed #514067;
  background:rgba(139,92,246,.05);
  color:#b9a6dc;
  padding:11px;
  border-radius:11px;
}

.add-product:hover{
  border-color:var(--violet);
  color:#fff;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
}

.main-empty{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
}

/* =========================
   FLOAT CALCULATOR
========================= */

.calculator-float{
  position:fixed;
  right:22px;
  bottom:22px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,var(--violet),var(--violet2));
  color:#fff;
  font-size:23px;
  box-shadow:0 10px 35px rgba(109,61,232,.4);
  z-index:50;
}

.calc-badge{
  position:absolute;
  right:-2px;
  top:-3px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:20px;
  background:var(--red);
  color:#fff;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   CALCULATOR DRAWER
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(3px);
  z-index:80;
}

.calculator{
  position:fixed;
  right:0;
  top:0;
  height:100vh;
  width:min(430px,100%);
  background:linear-gradient(180deg,#171021,#0e0a14);
  border-left:1px solid var(--border);
  z-index:90;
  transform:translateX(100%);
  transition:.25s ease;
  display:flex;
  flex-direction:column;
}

.calculator.open{
  transform:translateX(0);
}

.calc-head{
  display:flex;
  align-items:center;
  padding:19px;
  border-bottom:1px solid var(--border);
}

.calc-title{
  flex:1;
  color:var(--gold);
  font-size:19px;
  font-weight:800;
}

.calc-close{
  background:transparent;
  border:0;
  color:#aaa;
  font-size:24px;
}

.calc-body{
  flex:1;
  overflow:auto;
  padding:17px;
}

.calc-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px;
  margin-bottom:8px;
}

.calc-item-name{
  flex:1;
}

.calc-item-qty{
  display:flex;
  align-items:center;
  gap:6px;
}

.calc-total{
  padding:17px;
  border-top:1px solid var(--border);
  background:#120d19;
}

.total-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.total-row span:first-child{
  color:var(--muted);
}

.total-sale{
  color:var(--gold);
  font-size:21px;
  font-weight:900;
}

.total-profit{
  color:var(--green);
  font-weight:800;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:120;
}

.modal{
  width:min(450px,100%);
  background:linear-gradient(145deg,#191123,#261936);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
}

.modal h2{
  margin:0 0 18px;
  color:var(--gold);
  font-size:20px;
}

.modal-buttons{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.modal-buttons button{
  flex:1;
}

.cancel{
  background:var(--panel2);
  border:1px solid var(--border);
  color:#fff;
  border-radius:10px;
  padding:11px;
}

.confirm{
  background:linear-gradient(135deg,var(--violet),var(--violet2));
  border:0;
  color:#fff;
  border-radius:10px;
  padding:11px;
}

.delete{
  background:#451725;
  border:1px solid #753042;
  color:#ff8794;
  border-radius:10px;
  padding:11px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#241936;
  border:1px solid var(--border);
  color:#fff;
  padding:12px 17px;
  border-radius:11px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .toolbar{
    flex-direction:column;
  }

  .search,
  .primary{
    width:100%;
  }

  .provider-actions .small-btn{
    font-size:11px;
    padding:6px 7px;
  }

  .product{
    grid-template-columns:1fr auto;
    gap:9px;
  }

  .product-info{
    grid-column:1/-1;
  }

  .product-field{
    background:#171020;
    padding:8px;
    border-radius:9px;
  }

  .stock{
    justify-content:flex-end;
  }

  .logout{
    position:static;
    margin-top:12px;
  }

  .topbar{
    margin-bottom:20px;
  }
}

@media(max-width:500px){

  .container{
    width:calc(100% - 18px);
  }

  #app{
    padding-top:15px;
  }

  .brand-main{
    font-size:28px;
  }

  .provider-header{
    padding:13px;
  }

  .provider-name{
    font-size:16px;
  }

  .provider-actions .small-btn{
    display:none;
  }

  .login-card{
    padding:25px 20px;
  }
}
</style>
</head>

<body>

<!-- =========================
     APP
========================= -->

<div id="app">

  <div class="container">

    <div class="topbar">

      <div class="brand">
        <div class="brand-script">Agustín</div>
        <div class="brand-main">Stock iPhone</div>
      </div>

      <button class="logout" onclick="resetEverything()">
        Restablecer
      </button>

    </div>

    <div class="toolbar">

      <input
        id="search"
        class="search"
        placeholder="Buscar producto..."
        oninput="render()"
      >

      <button class="primary" onclick="openProviderModal()">
        ＋ Agregar proveedor
      </button>

    </div>

    <div id="providers"></div>

  </div>

</div>

<!-- CALCULATOR FLOAT -->

<button class="calculator-float" onclick="openCalculator()">
  🧮
  <span id="calcBadge" class="calc-badge">0</span>
</button>

<div id="calcOverlay" class="overlay hidden" onclick="closeCalculator()"></div>

<div id="calculator" class="calculator">

  <div class="calc-head">
    <div class="calc-title">Calculadora</div>
    <button class="calc-close" onclick="closeCalculator()">×</button>
  </div>

  <div id="calcBody" class="calc-body"></div>

  <div class="calc-total">

    <div class="total-row">
      <span>Costo total</span>
      <strong id="calcCost">$0</strong>
    </div>

    <div class="total-row">
      <span>Venta total</span>
      <strong id="calcSale" class="total-sale">$0</strong>
    </div>

    <div class="total-row">
      <span>Ganancia</span>
      <strong id="calcProfit" class="total-profit">$0</strong>
    </div>

  </div>

</div>

<!-- MODAL -->

<div id="modalBg" class="modal-bg hidden">

  <div class="modal">

    <h2 id="modalTitle">Agregar</h2>

    <div id="modalContent"></div>

    <div class="modal-buttons">

      <button class="cancel" onclick="closeModal()">
        Cancelar
      </button>

      <button id="modalConfirm" class="confirm">
        Guardar
      </button>

    </div>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "stock_iphone_data_v3";

let data = {
  providers: []
};

let calculator = {};

let modalAction = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function money(value){
  return "$" + Number(value || 0).toLocaleString("es-AR");
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function toast(message){

  const element = $("toast");

  element.textContent = message;

  element.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    element.classList.remove("show");
  },1800);
}


/* =========================================================
   SAVE / LOAD
========================================================= */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

function load(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){

      const parsed = JSON.parse(saved);

      if(parsed && Array.isArray(parsed.providers)){
        data = parsed;
      }

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================================================
   PROVIDERS
========================================================= */

function openProviderModal(){

  $("modalTitle").textContent = "Agregar proveedor";

  $("modalContent").innerHTML = `

    <div class="input-group">

      <label>Nombre del proveedor</label>

      <input
        id="modalProviderName"
        class="input"
        placeholder="Ej: Proveedor 1"
        autofocus
      >

    </div>

  `;

  modalAction = () => {

    const name = $("modalProviderName").value.trim();

    if(!name){
      toast("Ingresá un nombre");
      return;
    }

    data.providers.push({
      id:uid(),
      name,
      collapsed:false,
      products:[]
    });

    save();
    closeModal();
    render();

    toast("Proveedor agregado");

  };

  openModal();

}

function renameProvider(providerId){

  const provider = findProvider(providerId);

  if(!provider) return;

  $("modalTitle").textContent = "Renombrar proveedor";

  $("modalContent").innerHTML = `

    <div class="input-group">

      <label>Nombre</label>

      <input
        id="modalProviderName"
        class="input"
        value="${escapeHtml(provider.name)}"
      >

    </div>

  `;

  modalAction = () => {

    const name = $("modalProviderName").value.trim();

    if(!name){
      toast("El nombre no puede estar vacío");
      return;
    }

    provider.name = name;

    save();
    closeModal();
    render();

    toast("Proveedor renombrado");

  };

  openModal();

}

function deleteProvider(providerId){

  const provider = findProvider(providerId);

  if(!provider) return;

  if(!confirm(
    `¿Eliminar "${provider.name}" y todos sus productos?`
  )){
    return;
  }

  data.providers = data.providers.filter(
    p => p.id !== providerId
  );

  save();
  render();

  toast("Proveedor eliminado");

}

function toggleProvider(providerId){

  const provider = findProvider(providerId);

  if(!provider) return;

  provider.collapsed = !provider.collapsed;

  save();
  render();

}

function findProvider(id){

  return data.providers.find(
    p => p.id === id
  );

}


/* =========================================================
   PRODUCTS
========================================================= */

function openProductModal(providerId, productId=null){

  const provider = findProvider(providerId);

  if(!provider) return;

  const product = productId
    ? provider.products.find(p => p.id === productId)
    : null;

  $("modalTitle").textContent =
    product ? "Editar producto" : "Agregar producto";

  $("modalContent").innerHTML = `

    <div class="input-group">

      <label>Producto</label>

      <input
        id="mProduct"
        class="input"
        value="${escapeHtml(product?.name || "")}"
        placeholder="Ej: iPhone 15 Pro"
      >

    </div>

    <div class="input-group">

      <label>Capacidad</label>

      <select id="mCapacity" class="input">

        <option value="Ninguno">Ninguno</option>
        <option value="128 GB">128 GB</option>
        <option value="256 GB">256 GB</option>
        <option value="512 GB">512 GB</option>
        <option value="1 TB">1 TB</option>

      </select>

    </div>

    <div class="input-group">

      <label>Precio de proveedor</label>

      <input
        id="mProviderPrice"
        class="input"
        type="number"
        min="0"
        value="${product?.providerPrice ?? 0}"
      >

    </div>

    <div class="input-group">

      <label>Costo</label>

      <input
        id="mCost"
        class="input"
        type="number"
        min="0"
        value="${product?.cost ?? 0}"
      >

    </div>

    <div class="input-group">

      <label>Precio de venta</label>

      <input
        id="mSale"
        class="input"
        type="number"
        min="0"
        value="${product?.sale ?? 0}"
      >

    </div>

    <div class="input-group">

      <label>Stock</label>

      <input
        id="mStock"
        class="input"
        type="number"
        min="0"
        value="${product?.stock ?? 0}"
      >

    </div>

  `;

  $("mCapacity").value =
    product?.capacity || "Ninguno";

  modalAction = () => {

    const name = $("mProduct").value.trim();

    if(!name){
      toast("Ingresá el nombre del producto");
      return;
    }

    const productData = {

      id:product?.id || uid(),

      name,

      capacity:$("mCapacity").value,

      providerPrice:Number(
        $("mProviderPrice").value
      ) || 0,

      cost:Number(
        $("mCost").value
      ) || 0,

      sale:Number(
        $("mSale").value
      ) || 0,

      stock:Math.max(
        0,
        Number($("mStock").value) || 0
      )

    };

    if(product){

      Object.assign(product,productData);

    }else{

      provider.products.push(productData);

    }

    save();
    closeModal();
    render();

    toast(
      product
        ? "Producto actualizado"
        : "Producto agregado"
    );

  };

  openModal();

}

function deleteProduct(providerId,productId){

  const provider = findProvider(providerId);

  if(!provider) return;

  const product =
    provider.products.find(
      p => p.id === productId
    );

  if(!product) return;

  if(!confirm(
    `¿Eliminar "${product.name}"?`
  )){
    return;
  }

  provider.products =
    provider.products.filter(
      p => p.id !== productId
    );

  delete calculator[productId];

  save();
  render();
  updateCalculator();

  toast("Producto eliminado");

}

function changeStock(providerId,productId,amount){

  const provider = findProvider(providerId);

  const product =
    provider?.products.find(
      p => p.id === productId
    );

  if(!product) return;

  product.stock = Math.max(
    0,
    Number(product.stock || 0) + amount
  );

  save();
  render();
  updateCalculator();

}


/* =========================================================
   CALCULATOR
========================================================= */

function toggleCalculatorProduct(productId){

  if(calculator[productId]){
    delete calculator[productId];
  }else{
    calculator[productId] = 1;
  }

  updateCalculator();

}

function changeCalculatorQty(productId,amount){

  if(!calculator[productId]) return;

  calculator[productId] += amount;

  if(calculator[productId] <= 0){
    delete calculator[productId];
  }

  updateCalculator();

}

function getAllProducts(){

  const result = [];

  for(const provider of data.providers){

    for(const product of provider.products){

      result.push({
        ...product,
        providerName:provider.name
      });

    }

  }

  return result;

}

function updateCalculator(){

  const products = getAllProducts();

  const selected =
    products.filter(
      p => calculator[p.id]
    );

  $("calcBadge").textContent =
    selected.length;

  if(selected.length === 0){

    $("calcBody").innerHTML = `
      <div class="empty">
        Seleccioná productos desde la lista para agregarlos a la calculadora.
      </div>
    `;

  }else{

    $("calcBody").innerHTML =
      selected.map(product => `

        <div class="calc-item">

          <div class="calc-item-name">

            <strong>
              ${escapeHtml(product.name)}
            </strong>

            <div class="capacity">
              ${escapeHtml(product.capacity)}
            </div>

          </div>

          <div class="calc-item-qty">

            <button
              class="stock-btn"
              onclick="changeCalculatorQty('${product.id}',-1)"
            >
              −
            </button>

            <strong>
              ${calculator[product.id]}
            </strong>

            <button
              class="stock-btn"
              onclick="changeCalculatorQty('${product.id}',1)"
            >
              +
            </button>

          </div>

        </div>

      `).join("");

  }

  let cost = 0;
  let sale = 0;

  for(const product of selected){

    const qty = calculator[product.id];

    cost += Number(product.cost || 0) * qty;

    sale += Number(product.sale || 0) * qty;

  }

  $("calcCost").textContent = money(cost);
  $("calcSale").textContent = money(sale);
  $("calcProfit").textContent = money(sale-cost);

}

function openCalculator(){

  $("calcOverlay").classList.remove("hidden");

  $("calculator").classList.add("open");

  updateCalculator();

}

function closeCalculator(){

  $("calculator").classList.remove("open");

  $("calcOverlay").classList.add("hidden");

}


/* =========================================================
   MODAL
========================================================= */

function openModal(){

  $("modalBg").classList.remove("hidden");

  setTimeout(()=>{

    const input =
      $("modalContent").querySelector("input");

    if(input) input.focus();

  },50);

}

function closeModal(){

  $("modalBg").classList.add("hidden");

  modalAction = null;

}

$("modalConfirm").onclick = () => {

  if(typeof modalAction === "function"){
    modalAction();
  }

};

$("modalBg").addEventListener("click",event=>{

  if(event.target === $("modalBg")){
    closeModal();
  }

});


/* =========================================================
   RENDER
========================================================= */

function render(){

  const container = $("providers");

  const search =
    $("search").value.trim().toLowerCase();

  if(data.providers.length === 0){

    container.innerHTML = `

      <div class="main-empty empty">

        <div style="font-size:35px;margin-bottom:10px;">
          📦
        </div>

        <strong>
          No hay proveedores todavía
        </strong>

        <div style="margin-top:7px;">
          Agregá tu primer proveedor para comenzar.
        </div>

      </div>

    `;

    return;

  }

  container.innerHTML =
    data.providers.map(provider=>{

      let products = provider.products || [];

      if(search){

        products = products.filter(product=>

          product.name
            .toLowerCase()
            .includes(search)

          ||

          provider.name
            .toLowerCase()
            .includes(search)

        );

      }

      return `

        <div
          class="provider ${provider.collapsed ? "collapsed" : ""}"
          data-provider="${provider.id}"
        >

          <div class="provider-header">

            <button
              class="provider-arrow"
              onclick="toggleProvider('${provider.id}')"
            >
              ▼
            </button>

            <div class="provider-name">
              ${escapeHtml(provider.name)}
            </div>

            <div class="provider-actions">

              <button
                class="small-btn"
                onclick="renameProvider('${provider.id}')"
              >
                Renombrar
              </button>

              <button
                class="small-btn"
                onclick="deleteProvider('${provider.id}')"
              >
                Eliminar
              </button>

            </div>

          </div>

          <div class="provider-content">

            <div
              class="products"
              data-products="${provider.id}"
            >

              ${
                products.length
                ?

                products.map(product=>

                  productHTML(
                    provider.id,
                    product
                  )

                ).join("")

                :

                `
                <div class="empty">
                  No hay productos.
                </div>
                `
              }

            </div>

            <button
              class="add-product"
              onclick="openProductModal('${provider.id}')"
            >
              ＋ Agregar producto
            </button>

          </div>

        </div>

      `;

    }).join("");

  setupDragAndDrop();

  updateCalculator();

}


/* =========================================================
   PRODUCT HTML
========================================================= */

function productHTML(providerId,product){

  const selected =
    !!calculator[product.id];

  return `

    <div
      class="product ${selected ? "drag-over" : ""}"
      draggable="true"
      data-product="${product.id}"
      data-provider="${providerId}"
    >

      <div class="product-info">

        <span class="drag">☷</span>

        <div>

          <div class="product-title">
            ${escapeHtml(product.name)}
          </div>

          <div class="capacity">
            ${escapeHtml(product.capacity || "Ninguno")}
          </div>

        </div>

      </div>

      <div class="product-field">

        <div class="label">
          Proveedor
        </div>

        <div class="value">
          ${money(product.providerPrice)}
        </div>

      </div>

      <div class="product-field">

        <div class="label">
          Costo
        </div>

        <div class="value cost">
          ${money(product.cost)}
        </div>

      </div>

      <div class="product-field">

        <div class="label">
          Venta
        </div>

        <div class="value sale">
          ${money(product.sale)}
        </div>

      </div>

      <div class="product-field">

        <div class="label">
          Stock
        </div>

        <div class="stock">

          <button
            class="stock-btn"
            onclick="changeStock(
              '${providerId}',
              '${product.id}',
              -1
            )"
          >
            −
          </button>

          <span class="stock-number">
            ${product.stock}
          </span>

          <button
            class="stock-btn"
            onclick="changeStock(
              '${providerId}',
              '${product.id}',
              1
            )"
          >
            +
          </button>

        </div>

      </div>

      <button
        class="product-menu"
        onclick="productOptions(
          '${providerId}',
          '${product.id}'
        )"
      >
        ⋮
      </button>

    </div>

  `;

}


/* =========================================================
   PRODUCT OPTIONS
========================================================= */

function productOptions(providerId,productId){

  const provider = findProvider(providerId);

  const product =
    provider?.products.find(
      p => p.id === productId
    );

  if(!product) return;

  const option =
    prompt(
      `¿Qué querés hacer con "${product.name}"?\n\n` +
      `1 - Editar\n` +
      `2 - Calculadora\n` +
      `3 - Eliminar`
    );

  if(option === "1"){

    openProductModal(
      providerId,
      productId
    );

  }else if(option === "2"){

    toggleCalculatorProduct(productId);

    openCalculator();

  }else if(option === "3"){

    deleteProduct(
      providerId,
      productId
    );

  }

}


/* =========================================================
   DRAG & DROP
========================================================= */

function setupDragAndDrop(){

  document
    .querySelectorAll(".product")
    .forEach(element=>{

      element.addEventListener(
        "dragstart",
        dragStart
      );

      element.addEventListener(
        "dragover",
        dragOver
      );

      element.addEventListener(
        "dragleave",
        dragLeave
      );

      element.addEventListener(
        "drop",
        dragDrop
      );

      element.addEventListener(
        "dragend",
        dragEnd
      );

    });

}

let draggedProduct = null;

function dragStart(event){

  draggedProduct = {
    id:this.dataset.product,
    providerId:this.dataset.provider
  };

  this.classList.add("dragging");

  event.dataTransfer.effectAllowed = "move";

}

function dragOver(event){

  event.preventDefault();

  if(!draggedProduct) return;

  if(
    this.dataset.product !==
    draggedProduct.id
  ){

    this.classList.add("drag-over");

  }

}

function dragLeave(){

  this.classList.remove("drag-over");

}

function dragDrop(event){

  event.preventDefault();

  this.classList.remove("drag-over");

  if(!draggedProduct) return;

  const targetId =
    this.dataset.product;

  const targetProviderId =
    this.dataset.provider;

  if(
    draggedProduct.id === targetId
  ){
    return;
  }

  const fromProvider =
    findProvider(
      draggedProduct.providerId
    );

  const toProvider =
    findProvider(
      targetProviderId
    );

  if(!fromProvider || !toProvider){
    return;
  }

  const fromIndex =
    fromProvider.products.findIndex(
      p => p.id === draggedProduct.id
    );

  const targetIndex =
    toProvider.products.findIndex(
      p => p.id === targetId
    );

  if(fromIndex < 0 || targetIndex < 0){
    return;
  }

  const [moved] =
    fromProvider.products.splice(
      fromIndex,
      1
    );

  if(
    fromProvider.id ===
    toProvider.id
  ){

    let newIndex =
      targetIndex;

    if(fromIndex < targetIndex){
      newIndex--;
    }

    toProvider.products.splice(
      newIndex + 1,
      0,
      moved
    );

  }else{

    toProvider.products.splice(
      targetIndex + 1,
      0,
      moved
    );

  }

  save();
  render();

  toast("Orden guardado");

}

function dragEnd(){

  document
    .querySelectorAll(".product")
    .forEach(element=>{
      element.classList.remove(
        "dragging",
        "drag-over"
      );
    });

  draggedProduct = null;

}


/* =========================================================
   RESET
========================================================= */

function resetEverything(){

  if(!confirm(
    "Esto va a borrar todos los proveedores y productos guardados en este navegador. ¿Continuar?"
  )){
    return;
  }

  localStorage.removeItem(STORAGE_KEY);

  data = {
    providers:[]
  };

  calculator = {};

  render();

  toast("Datos eliminados");

}


/* =========================================================
   START
========================================================= */

load();

render();

</script>
